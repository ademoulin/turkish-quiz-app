name: Grammar integration checks

on:
  push:
    branches:
      - codex/yeni-hitit-v82-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-checks:
    name: Validate and build grammar quiz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate question bank
        run: node --import tsx scripts/validate-yeni-hitit.ts

      - name: Build production app (grammar enabled)
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run test:e2e

      - name: Build grammar preview
        run: npm run build:grammar-preview
