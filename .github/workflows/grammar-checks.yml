name: Grammar integration checks

on:
  push:
    branches:
      - codex/yeni-hitit-v82-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_bank_ui:
        description: Also run exhaustive per-question browser walkthroughs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  grammar-checks:
    name: Validate and build grammar quiz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
      PLAYWRIGHT_REUSE_BUILD: '1'
      UI_FULL_BANK: ${{ inputs.full_bank_ui && '1' || '0' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate question bank
        run: node --import tsx scripts/validate-yeni-hitit.ts

      - name: Build production app (grammar enabled)
        run: npm run build

      # GitHub's Ubuntu image includes stable Chrome and its OS dependencies.
      - name: Verify preinstalled browser
        run: google-chrome --version

      - name: Run browser checks
        id: browser
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/browser-checks.mjs

      - name: Build grammar preview
        run: npm run build:grammar-preview

      - name: Package review preview (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: grammar-review-preview
          path: dist/quiz-my-turkish.html
          if-no-files-found: error
          retention-days: 7

      - name: Package layout screenshots (no deployment)
        if: steps.browser.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: grammar-layout-review
          path: test-results/layout-*.png
          if-no-files-found: error
          retention-days: 7
