orrect_option_id":"B","explanation":"Yemeyecek is the negative future of yemek; compare affirmative yiyecek."},{"id":"YH1-V48-Q021","section":"7.1","skill_id":"YH1-07-01-S03","type":"single_select","prompt":"Choose the future-tense question meaning “Will they go tomorrow?”","options":[{"id":"A","text":"Yarın gittiler mi?"},{"id":"B","text":"Yarın gidiyorlar mı?"},{"id":"C","text":"Yarın gidecekler mi?"},{"id":"D","text":"Yarın gitmezler mi?"}],"correct_option_id":"C","explanation":"Gidecekler mi uses the future -ecek plus plural agreement and a separate question particle."},{"id":"YH1-V48-Q022","section":"7.1","skill_id":"YH1-07-01-S03","type":"single_select","prompt":"Choose the future-tense question meaning “Will you (singular) study tonight?”","options":[{"id":"A","text":"Bu akşam çalışıyor musun?"},{"id":"B","text":"Bu akşam çalıştın mı?"},{"id":"C","text":"Bu akşam çalışmaz mısın?"},{"id":"D","text":"Bu akşam çalışacak mısın?"}],"correct_option_id":"D","explanation":"Çalışacak mısın? asks a second-person singular future question."},{"id":"YH1-V48-Q023","section":"7.3","skill_id":"YH1-07-03-S01","type":"single_select","prompt":"Choose the sentence meaning “I speak English,” using the language adverb in -ce/-ca.","options":[{"id":"A","text":"İngilizce konuşuyorum."},{"id":"B","text":"İngiliz konuşuyorum."},{"id":"C","text":"İngiltere konuşuyorum."},{"id":"D","text":"İngilizce konuşmuyorum."}],"correct_option_id":"A","explanation":"İngilizce is the name of the language and functions adverbially with konuşmak."},{"id":"YH1-V48-Q024","section":"7.3","skill_id":"YH1-07-03-S01","type":"single_select","prompt":"Choose the sentence meaning “He/she speaks German,” using the language adverb in -ce/-ca.","options":[{"id":"A","text":"Alman konuşuyor."},{"id":"B","text":"Almanca konuşuyor."},{"id":"C","text":"Almanya konuşuyor."},{"id":"D","text":"Almanca konuşmuyor."}],"correct_option_id":"B","explanation":"Almanca is the German-language adverb used with konuşmak. Turkish konuşuyor has no grammatical gender, so it can mean “he speaks” or “she speaks” according to context."},{"id":"YH1-V50-Q001","section":"7.3","skill_id":"YH1-07-04-S01","type":"single_select","prompt":"Complete: “According to you, is it difficult?” ___ göre zor mu?","options":[{"id":"A","text":"Sana"},{"id":"B","text":"Seni"},{"id":"C","text":"Senden"},{"id":"D","text":"Senin"}],"correct_option_id":"A","explanation":"The postposition göre takes the dative: sana göre means “according to you.”"},{"id":"YH1-V50-Q002","section":"7.3","skill_id":"YH1-07-04-S01","type":"single_select","prompt":"Choose “according to the teacher.”","options":[{"id":"A","text":"öğretmeni göre"},{"id":"B","text":"öğretmenden göre"},{"id":"C","text":"öğretmene göre"},{"id":"D","text":"öğretmenin göre"}],"correct_option_id":"C","explanation":"Göre follows a dative-marked noun: öğretmene göre."},{"id":"YH1-V50-Q003","section":"7.3","skill_id":"YH1-07-05-S01","type":"single_select","prompt":"Choose “like a bird.”","options":[{"id":"A","text":"kuş gibi"},{"id":"B","text":"kuşa göre"},{"id":"C","text":"kuş için"},{"id":"D","text":"kuştan sonra"}],"correct_option_id":"A","explanation":"Gibi means “like/as” and follows the noun kuş without a case suffix here."},{"id":"YH1-V50-Q004","section":"7.3","skill_id":"YH1-07-05-S01","type":"single_select","prompt":"Complete: Çocuk ___ koşuyor. (He/she runs like a child.)","options":[{"id":"A","text":"kadar"},{"id":"B","text":"gibi"},{"id":"C","text":"göre"},{"id":"D","text":"önce"}],"correct_option_id":"B","explanation":"Gibi means “like/as”: çocuk gibi koşuyor means “runs like a child.” It follows the noun being compared."},{"id":"YH1-V50-Q005","section":"8.1","skill_id":"YH1-08-01-S02","type":"single_select","prompt":"Choose “Apparently they did not see it” (reported/inferred past).","options":[{"id":"A","text":"Görmediler."},{"id":"B","text":"Görmüyorlar."},{"id":"C","text":"Görmemişler."},{"id":"D","text":"Görmeyecekler."}],"correct_option_id":"C","explanation":"Görmemişler combines negation -me with the reported/inferred past -miş and plural -ler."},{"id":"YH1-V50-Q006","section":"8.1","skill_id":"YH1-08-01-S02","type":"single_select","prompt":"Complete with reported/inferred past: O dün gel___. (Apparently he/she did not come yesterday.)","options":[{"id":"A","text":"medi"},{"id":"B","text":"miyor"},{"id":"C","text":"meyecek"},{"id":"D","text":"memiş"}],"correct_option_id":"D","explanation":"Gelmemiş is the negative reported/inferred past of gelmek."},{"id":"YH1-V50-Q007","section":"8.1","skill_id":"YH1-08-01-S03","type":"single_select","prompt":"Choose the question in the reported/inferred past (rather than the directly witnessed past): “Have they left?”","options":[{"id":"A","text":"Gitmişler mi?"},{"id":"B","text":"Gittiler mi?"},{"id":"C","text":"Gidiyorlar mı?"},{"id":"D","text":"Gidecekler mi?"}],"correct_option_id":"A","explanation":"Gitmişler mi uses -miş for the reported/inferred past; mi is written separately."},{"id":"YH1-V50-Q008","section":"8.1","skill_id":"YH1-08-01-S03","type":"single_select","prompt":"Choose the informal singular question in the reported/inferred past: “Have you read it?”","options":[{"id":"A","text":"Okudun mu?"},{"id":"B","text":"Okuyacak mısın?"},{"id":"C","text":"Okumuş musun?"},{"id":"D","text":"Okuyor musun?"}],"correct_option_id":"C","explanation":"Okumuş musun uses the reported/inferred past -muş and the question particle mu with second-person ending."},{"id":"YH1-V50-Q009","section":"8.1","skill_id":"YH1-08-02-S01","type":"single_select","prompt":"Choose “Apparently they are students.”","options":[{"id":"A","text":"Öğrenciydiler."},{"id":"B","text":"Öğrenciymişler."},{"id":"C","text":"Öğrenci olacaklar."},{"id":"D","text":"Öğrencilerdi."}],"correct_option_id":"B","explanation":"Öğrenciymişler expresses reported/inferred nominal information with -ymiş."},{"id":"YH1-V50-Q010","section":"8.1","skill_id":"YH1-08-02-S01","type":"single_select","prompt":"Complete: Ayşe doktor___. (Apparently Ayşe is a doctor.)","options":[{"id":"A","text":"du"},{"id":"B","text":"miş"},{"id":"C","text":"muş"},{"id":"D","text":"mış"}],"correct_option_id":"C","explanation":"Doktormuş uses the reported/inferred nominal suffix -muş, matching the last vowel o in doktor."},{"id":"YH1-V50-Q011","section":"8.2","skill_id":"YH1-08-03-S01","type":"single_select","prompt":"Choose “Apparently they are working.”","options":[{"id":"A","text":"Çalıştılar."},{"id":"B","text":"Çalışıyorlarmış."},{"id":"C","text":"Çalışacaklar."},{"id":"D","text":"Çalışmışlar."}],"correct_option_id":"B","explanation":"Çalışıyorlarmış reports ongoing activity using -yor and reported -mış."},{"id":"YH1-V50-Q012","section":"8.2","skill_id":"YH1-08-03-S01","type":"single_select","prompt":"Choose “Apparently she is not sleeping.”","options":[{"id":"A","text":"Uyumadı."},{"id":"B","text":"Uyumayacak."},{"id":"C","text":"Uyumuyormuş."},{"id":"D","text":"Uyumamış."}],"correct_option_id":"C","explanation":"Uyumuyormuş combines present progressive negation with the reported/inferred marker."},{"id":"YH1-V50-Q013","section":"8.2","skill_id":"YH1-08-04-S02","type":"single_select","prompt":"Choose “Apparently they will not leave.”","options":[{"id":"A","text":"Gitmemişler."},{"id":"B","text":"Gitmeyeceklermiş."},{"id":"C","text":"Gitmeyecekler."},{"id":"D","text":"Gitmiyorlarmış."}],"correct_option_id":"B","explanation":"Gitmeyeceklermiş combines negative future and reported/inferred information."},{"id":"YH1-V50-Q014","section":"8.2","skill_id":"YH1-08-04-S02","type":"single_select","prompt":"Choose “Apparently she will not read.”","options":[{"id":"A","text":"Okumayacakmış."},{"id":"B","text":"Okumamış."},{"id":"C","text":"Okumuyor."},{"id":"D","text":"Okumayacak."}],"correct_option_id":"A","explanation":"Okumayacakmış combines future negation -ma-yacak with the reported/inferred marker -mış."},{"id":"YH1-V50-Q015","section":"9.1","skill_id":"YH1-09-01-S03","type":"single_select","prompt":"Choose the negative aorist for “I generally do not eat meat.”","options":[{"id":"A","text":"Et yemiyorum."},{"id":"B","text":"Et yemedim."},{"id":"C","text":"Et yemeyeceğim."},{"id":"D","text":"Et yemem."}],"correct_option_id":"D","explanation":"Yemem is first-person singular negative aorist; the prompt specifies a general habit."},{"id":"YH1-V50-Q016","section":"9.1","skill_id":"YH1-09-01-S03","type":"single_select","prompt":"Complete with negative aorist: Ben hafta sonları erken kalk___. (I do not generally get up early on weekends.)","options":[{"id":"A","text":"mam"},{"id":"B","text":"mıyorum"},{"id":"C","text":"madım"},{"id":"D","text":"mayacağım"}],"correct_option_id":"A","explanation":"Kalkmam is the first-person singular negative aorist of kalkmak."},{"id":"YH1-V50-Q017","section":"9.1","skill_id":"YH1-09-01-S04","type":"single_select","prompt":"Choose the aorist question “Do you usually drink tea?”","options":[{"id":"A","text":"Çay içtin mi?"},{"id":"B","text":"Çay içer misin?"},{"id":"C","text":"Çay içiyor musun?"},{"id":"D","text":"Çay içecek misin?"}],"correct_option_id":"B","explanation":"İçer misin asks about a general habit with the aorist."},{"id":"YH1-V50-Q018","section":"9.1","skill_id":"YH1-09-01-S04","type":"single_select","prompt":"Complete with the aorist: Sen genellikle kitap oku___?","options":[{"id":"A","text":"yor musun"},{"id":"B","text":"dun mu"},{"id":"C","text":"r musun"},{"id":"D","text":"yacak mısın"}],"correct_option_id":"C","explanation":"Okur musun is the aorist question; okur is formed from oku- + -r."},{"id":"YH1-V50-Q019","section":"9.2","skill_id":"YH1-09-02-S02","type":"single_select","prompt":"Choose “We cannot swim” using the negative ability suffix.","options":[{"id":"A","text":"Yüzmüyoruz."},{"id":"B","text":"Yüzemedik."},{"id":"C","text":"Yüzemeyiz."},{"id":"D","text":"Yüzmeyeceğiz."}],"correct_option_id":"C","explanation":"Yüzemeyiz expresses inability with -eme and first-person plural -yiz."},{"id":"YH1-V50-Q020","section":"9.2","skill_id":"YH1-09-02-S02","type":"single_select","prompt":"Complete with negative ability: Ben piyano çal___. (I cannot play the piano.)","options":[{"id":"A","text":"mıyorum"},{"id":"B","text":"amam"},{"id":"C","text":"mayacağım"},{"id":"D","text":"madım"}],"correct_option_id":"B","explanation":"Çalamam is the first-person singular negative ability form of çalmak."},{"id":"YH1-V50-Q021","section":"9.3","skill_id":"YH1-09-03-S02","type":"single_select","prompt":"Choose the sentence with the past habitual (-rDI) construction meaning “We used to come here every summer,” rather than the simple past.","options":[{"id":"A","text":"Her yaz buraya geliyoruz."},{"id":"B","text":"Her yaz buraya geleceğiz."},{"id":"C","text":"Her yaz buraya gelirdik."},{"id":"D","text":"Her yaz buraya geldik."}],"correct_option_id":"C","explanation":"Gelirdik describes a habitual past action; her yaz supports the repeated-habit reading."},{"id":"YH1-V50-Q022","section":"9.3","skill_id":"YH1-09-03-S02","type":"single_select","prompt":"Choose the sentence with the past habitual (-rDI) construction meaning “When I was a child, I used to play in the street.”","options":[{"id":"A","text":"Çocukken sokakta oynardım."},{"id":"B","text":"Çocukken sokakta oynuyorum."},{"id":"C","text":"Çocukken sokakta oynayacağım."},{"id":"D","text":"Çocukken sokakta oynadım."}],"correct_option_id":"A","explanation":"Oynardım uses the past habitual/aorist-past form; oynadım refers to a completed past event."},{"id":"YH1-V50-Q023","section":"10.1","skill_id":"YH1-10-01-S02","type":"single_select","prompt":"Complete: Çok yağmur yağdı, ___ evde kaldık. (It rained a lot, so we stayed home.)","options":[{"id":"A","text":"çünkü"},{"id":"B","text":"ama"},{"id":"C","text":"ve"},{"id":"D","text":"bu yüzden"}],"correct_option_id":"D","explanation":"Bu yüzden means “therefore/for this reason” and introduces the consequence."},{"id":"YH1-V50-Q024","section":"10.1","skill_id":"YH1-10-01-S02","type":"single_select","prompt":"Choose the connector meaning “because,” not “therefore.”","options":[{"id":"A","text":"bu yüzden"},{"id":"B","text":"çünkü"},{"id":"C","text":"böylece"},{"id":"D","text":"bu nedenle"}],"correct_option_id":"B","explanation":"Çünkü introduces a reason; bu yüzden and bu nedenle introduce a result."},{"id":"YH1-V52-Q001","section":"10.2","skill_id":"YH1-10-04-S01","type":"single_select","prompt":"Complete with the purpose expression -mAk üzere (not -mAk için): Sizinle konuşmak ___ geldim.","options":[{"id":"A","text":"için"},{"id":"B","text":"üzere"},{"id":"C","text":"sonra"},{"id":"D","text":"kadar"}],"correct_option_id":"B","explanation":"Konuşmak üzere geldim means “I came in order to speak”; the infinitive is followed by üzere."},{"id":"YH1-V52-Q002","section":"10.2","skill_id":"YH1-10-04-S01","type":"single_select","prompt":"Choose the sentence using -mAk üzere to express purpose: “I came to pick you up.”","options":[{"id":"A","text":"Seni almak üzere geldim."},{"id":"B","text":"Seni aldıktan sonra geldim."},{"id":"C","text":"Seni almadan geldim."},{"id":"D","text":"Seni alırken geldim."}],"correct_option_id":"A","explanation":"Almak üzere expresses the purpose of coming, rather than when the action occurred."},{"id":"YH1-V52-Q003","section":"10.3","skill_id":"YH1-10-05-S02","type":"single_select","prompt":"Choose “after finishing the homework” with -DIktAn sonra.","options":[{"id":"A","text":"ödevi bitirmeden önce"},{"id":"B","text":"ödevi bitirirken"},{"id":"C","text":"ödevi bitirdikten sonra"},{"id":"D","text":"ödevi bitirmek üzere"}],"correct_option_id":"C","explanation":"Bitirdikten sonra uses the -DIktAn sonra construction for “after finishing.”"},{"id":"YH1-V52-Q004","section":"10.3","skill_id":"YH1-10-05-S02","type":"single_select","prompt":"Complete with -DIktAn sonra: Kahvaltı yap___ sonra dışarı çıktık.","options":[{"id":"A","text":"madan"},{"id":"B","text":"tıktan"},{"id":"C","text":"arken"},{"id":"D","text":"mak"}],"correct_option_id":"B","explanation":"Yaptıktan sonra means “after doing”; yap- takes -tıktan after the voiceless p."},{"id":"YH1-V52-Q005","section":"10.3","skill_id":"YH1-10-06-S01","type":"single_select","prompt":"Choose “before opening the door” with -mAdAn önce.","options":[{"id":"A","text":"kapıyı açtıktan sonra"},{"id":"B","text":"kapıyı açmadan önce"},{"id":"C","text":"kapıyı açarken"},{"id":"D","text":"kapıyı açmak üzere"}],"correct_option_id":"B","explanation":"Açmadan önce means “before opening”; the negative-looking -madan here forms a temporal converb."},{"id":"YH1-V52-Q006","section":"10.3","skill_id":"YH1-10-06-S01","type":"single_select","prompt":"Complete with -mAdAn önce: Evden çık___ önce ışıkları kapat.","options":[{"id":"A","text":"tıktan"},{"id":"B","text":"arken"},{"id":"C","text":"madan"},{"id":"D","text":"mak"}],"correct_option_id":"C","explanation":"Çıkmadan önce means “before leaving.”"},{"id":"YH1-V52-Q007","section":"11.1","skill_id":"YH1-11-01-S02","type":"single_select","prompt":"Choose “She opened the door and entered” using -(y)Ip.","options":[{"id":"A","text":"Kapıyı açıp içeri girdi."},{"id":"B","text":"Kapıyı açmadan içeri girdi."},{"id":"C","text":"Kapıyı açarken içeri girdi."},{"id":"D","text":"Kapıyı açmak üzere içeri girdi."}],"correct_option_id":"A","explanation":"Açıp joins opening the door with entering, using the -(y)Ip converb."},{"id":"YH1-V52-Q008","section":"11.1","skill_id":"YH1-11-01-S02","type":"single_select","prompt":"Complete using -(y)Ip: Kitabı al___ masaya koydu.","options":[{"id":"A","text":"madan"},{"id":"B","text":"ıp"},{"id":"C","text":"arak"},{"id":"D","text":"ırken"}],"correct_option_id":"B","explanation":"Alıp links “taking the book” and “putting it on the table.”"},{"id":"YH1-V52-Q009","section":"11.1","skill_id":"YH1-11-02-S01","type":"single_select","prompt":"Choose “She went out without drinking tea” using -mAdAn.","options":[{"id":"A","text":"Çay içerek dışarı çıktı."},{"id":"B","text":"Çay içip dışarı çıktı."},{"id":"C","text":"Çay içmeden dışarı çıktı."},{"id":"D","text":"Çay içtikten sonra dışarı çıktı."}],"correct_option_id":"C","explanation":"İçmeden expresses doing the second action without doing the first."},{"id":"YH1-V52-Q010","section":"11.1","skill_id":"YH1-11-02-S01","type":"single_select","prompt":"Complete with -mAdAn: Kimseye haber ver___ ayrıldı. (He/she left without telling anyone.)","options":[{"id":"A","text":"erek"},{"id":"B","text":"meden"},{"id":"C","text":"dikten"},{"id":"D","text":"ip"}],"correct_option_id":"B","explanation":"Vermeden expresses “without giving/telling” in this context."},{"id":"YH1-V52-Q011","section":"11.2","skill_id":"YH1-11-03-S02","type":"single_select","prompt":"Choose “He walked while smiling” using -(y)ArAk.","options":[{"id":"A","text":"Gülmeden yürüdü."},{"id":"B","text":"Gülüp yürüdü."},{"id":"C","text":"Gülerek yürüdü."},{"id":"D","text":"Güldükten sonra yürüdü."}],"correct_option_id":"C","explanation":"Gülerek presents smiling as accompanying manner of walking."},{"id":"YH1-V52-Q012","section":"11.2","skill_id":"YH1-11-03-S02","type":"single_select","prompt":"Complete with -(y)ArAk: Koş___ otobüse yetişti. (He/she caught the bus by running.)","options":[{"id":"A","text":"madan"},{"id":"B","text":"arak"},{"id":"C","text":"tıktan"},{"id":"D","text":"mak"}],"correct_option_id":"B","explanation":"Koşarak expresses running as the manner or means of catching the bus."},{"id":"YH1-V52-Q013","section":"11.2","skill_id":"YH1-11-04-S01","type":"single_select","prompt":"Complete with olarak to mean “as a profession”: Hastanede hemşire ___ çalışıyor.","options":[{"id":"A","text":"gibi"},{"id":"B","text":"olarak"},{"id":"C","text":"kadar"},{"id":"D","text":"sonra"}],"correct_option_id":"B","explanation":"Hemşire olarak çalışıyor means “works as a nurse.”"},{"id":"YH1-V52-Q014","section":"11.2","skill_id":"YH1-11-04-S01","type":"single_select","prompt":"Choose “She works as a translator” using olarak.","options":[{"id":"A","text":"Çevirmen gibi çalışıyor."},{"id":"B","text":"Çevirmen için çalışıyor."},{"id":"C","text":"Çevirmen olarak çalışıyor."},{"id":"D","text":"Çevirmenden çalışıyor."}],"correct_option_id":"C","explanation":"Çevirmen olarak indicates the role or capacity in which someone works."},{"id":"YH1-V52-Q015","section":"12.1","skill_id":"YH1-12-01-S02","type":"single_select","prompt":"Choose the infinitive/verbal noun in “Reading is useful.”","options":[{"id":"A","text":"Okuyan"},{"id":"B","text":"Okumak"},{"id":"C","text":"Okudu"},{"id":"D","text":"Okuyor"}],"correct_option_id":"B","explanation":"Okumak is the -mAk verbal noun meaning “reading/to read.”"},{"id":"YH1-V52-Q016","section":"12.1","skill_id":"YH1-12-01-S02","type":"single_select","prompt":"Complete with -mAk: Her gün yürü___ sağlıklıdır. (Walking every day is healthy.)","options":[{"id":"A","text":"mek"},{"id":"B","text":"yor"},{"id":"C","text":"dü"},{"id":"D","text":"yen"}],"correct_option_id":"A","explanation":"Yürümek is the infinitive/verbal noun formed with -mek after the front vowel ü."},{"id":"YH1-V52-Q017","section":"12.2","skill_id":"YH1-12-02-S02","type":"single_select","prompt":"Choose “I am glad you arrived” using a dative-marked verbal noun.","options":[{"id":"A","text":"Gelmen sevindim."},{"id":"B","text":"Gelmene sevindim."},{"id":"C","text":"Gelmeni sevindim."},{"id":"D","text":"Gelmeden sevindim."}],"correct_option_id":"B","explanation":"Gelmene is gelme + second-person singular possessive -n + dative -e."},{"id":"YH1-V52-Q018","section":"12.2","skill_id":"YH1-12-02-S02","type":"single_select","prompt":"Choose “I am glad Ayşe came” using a dative-marked verbal noun.","options":[{"id":"A","text":"Ayşe’nin gelmesini sevindim."},{"id":"B","text":"Ayşe’nin gelmesine sevindim."},{"id":"C","text":"Ayşe’nin gelmeden sevindim."},{"id":"D","text":"Ayşe’nin gelmesi sevindim."}],"correct_option_id":"B","explanation":"Ayşe’nin gelmesine means “at/about Ayşe’s coming”: gelme + third-person possessive -si + dative -ne. Sevinmek takes a dative complement here."},{"id":"YH1-V52-Q019","section":"0","skill_id":"YH1-00-01-S01","type":"single_select","prompt":"Which character is a letter of the Turkish alphabet?","options":[{"id":"A","text":"q"},{"id":"B","text":"w"},{"id":"C","text":"ş"},{"id":"D","text":"x"}],"correct_option_id":"C","explanation":"Ş is a Turkish alphabet letter; q, w and x are not letters in the standard Turkish alphabet."},{"id":"YH1-V52-Q020","section":"0","skill_id":"YH1-00-01-S01","type":"single_select","prompt":"Choose the Turkish letter that represents a dotless vowel.","options":[{"id":"A","text":"i"},{"id":"B","text":"ı"},{"id":"C","text":"j"},{"id":"D","text":"ğ"}],"correct_option_id":"B","explanation":"The Turkish letter ı is a dotless vowel, distinct from dotted i."},{"id":"YH1-V52-Q021","section":"0","skill_id":"YH1-00-01-S03","type":"single_select","prompt":"Which word contains the dotless Turkish vowel ı?","options":[{"id":"A","text":"bir"},{"id":"B","text":"sıcak"},{"id":"C","text":"şehir"},{"id":"D","text":"güzel"}],"correct_option_id":"B","explanation":"Sıcak contains dotless ı; the other words do not."},{"id":"YH1-V52-Q022","section":"0","skill_id":"YH1-00-01-S03","type":"single_select","prompt":"Choose the correctly spelled Turkish word meaning “light.”","options":[{"id":"A","text":"ışık"},{"id":"B","text":"işik"},{"id":"C","text":"isık"},{"id":"D","text":"işık"}],"correct_option_id":"A","explanation":"Işık (“light”) is spelled with dotless ı at both vowel positions."},{"id":"YH1-V52-Q023","section":"0","skill_id":"YH1-00-02-S01","type":"single_select","prompt":"How do you write 68 in Turkish?","options":[{"id":"A","text":"altmış sekiz"},{"id":"B","text":"altı sekiz"},{"id":"C","text":"seksen altı"},{"id":"D","text":"altmış yedi"}],"correct_option_id":"A","explanation":"68 is altmış sekiz: sixty plus eight."},{"id":"YH1-V52-Q024","section":"0","skill_id":"YH1-00-02-S01","type":"single_select","prompt":"Choose the Turkish spelling of 93.","options":[{"id":"A","text":"doksan üç"},{"id":"B","text":"dokuz üç"},{"id":"C","text":"otuz dokuz"},{"id":"D","text":"doksan iki"}],"correct_option_id":"A","explanation":"Doksan means ninety and üç means three. Turkish puts tens before units: doksan üç = 93."},{"id":"YH1-V54-Q001","section":"0","skill_id":"YH1-00-02-S03","type":"single_select","prompt":"How do you write 246 in Turkish?","options":[{"id":"A","text":"iki yüz kırk altı"},{"id":"B","text":"iki yüz altmış dört"},{"id":"C","text":"yirmi dört altı"},{"id":"D","text":"iki bin kırk altı"}],"correct_option_id":"A","explanation":"246 is iki yüz (200) + kırk (40) + altı (6)."},{"id":"YH1-V54-Q002","section":"0","skill_id":"YH1-00-02-S03","type":"single_select","prompt":"Choose the Turkish spelling of 318.","options":[{"id":"A","text":"üç yüz on sekiz"},{"id":"B","text":"üç yüz seksen bir"},{"id":"C","text":"otuz yüz on sekiz"},{"id":"D","text":"üç bin on sekiz"}],"correct_option_id":"A","explanation":"318 is üç yüz (300) + on (10) + sekiz (8)."},{"id":"YH1-V54-Q003","section":"0","skill_id":"YH1-00-03-S01","type":"single_select","prompt":"Choose the plain plural of kitap (without any possessive suffix).","options":[{"id":"A","text":"kitaplar"},{"id":"B","text":"kitapler"},{"id":"C","text":"kitaplarım"},{"id":"D","text":"kitapı"}],"correct_option_id":"A","explanation":"The plural suffix follows back-vowel harmony: kitap + -lar = kitaplar."},{"id":"YH1-V54-Q004","section":"0","skill_id":"YH1-00-03-S01","type":"single_select","prompt":"Choose the correct plural of şehir.","options":[{"id":"A","text":"şehirler"},{"id":"B","text":"şehirlar"},{"id":"C","text":"şehiri"},{"id":"D","text":"şehirde"}],"correct_option_id":"A","explanation":"The plural suffix follows front-vowel harmony: şehir + -ler = şehirler."},{"id":"YH1-V54-Q005","section":"1.2","skill_id":"YH1-01-01-S01","type":"single_select","prompt":"Complete the nominal predicate: Ben doktor___. (I am a doctor.)","options":[{"id":"A","text":"um"},{"id":"B","text":"üm"},{"id":"C","text":"ım"},{"id":"D","text":"sun"}],"correct_option_id":"A","explanation":"Doktor has o as its last vowel, so the first-person singular ending is -um: doktorum."},{"id":"YH1-V54-Q006","section":"1.2","skill_id":"YH1-01-01-S01","type":"single_select","prompt":"Complete the nominal predicate: Ben mühendis___. (I am an engineer.)","options":[{"id":"A","text":"im"},{"id":"B","text":"ım"},{"id":"C","text":"um"},{"id":"D","text":"sin"}],"correct_option_id":"A","explanation":"Mühendis has i as its last vowel, so the first-person singular ending is -im: mühendisim."},{"id":"YH1-V54-Q007","section":"1.2","skill_id":"YH1-01-02-S02","type":"single_select","prompt":"Complete: Biz doktor___. (We are doctors.)","options":[{"id":"A","text":"uz"},{"id":"B","text":"üz"},{"id":"C","text":"ız"},{"id":"D","text":"sunuz"}],"correct_option_id":"A","explanation":"Doktor has o as its last vowel: doktoruz (we are doctors)."},{"id":"YH1-V54-Q008","section":"1.2","skill_id":"YH1-01-02-S02","type":"single_select","prompt":"Complete: Biz mühendis___. (We are engineers.)","options":[{"id":"A","text":"iz"},{"id":"B","text":"ız"},{"id":"C","text":"uz"},{"id":"D","text":"siniz"}],"correct_option_id":"A","explanation":"Mühendis has i as its last vowel: mühendisiz (we are engineers)."},{"id":"YH1-V54-Q009","section":"1.2","skill_id":"YH1-01-02-S03","type":"single_select","prompt":"Complete: Ben yorgun___. (I am tired.)","options":[{"id":"A","text":"um"},{"id":"B","text":"üm"},{"id":"C","text":"ım"},{"id":"D","text":"sun"}],"correct_option_id":"A","explanation":"Yorgun has u as its last vowel, so the first-person singular ending is -um: yorgunum."},{"id":"YH1-V54-Q010","section":"1.2","skill_id":"YH1-01-02-S03","type":"single_select","prompt":"Complete: Ben üzgün___. (I am sad.)","options":[{"id":"A","text":"üm"},{"id":"B","text":"um"},{"id":"C","text":"ım"},{"id":"D","text":"sün"}],"correct_option_id":"A","explanation":"Üzgün has ü as its last vowel, so the first-person singular ending is -üm: üzgünüm."},{"id":"YH1-V54-Q011","section":"1.3","skill_id":"YH1-01-03-S02","type":"single_select","prompt":"Complete for absence right now: Masada hiç ekmek ___. (There is no bread at all on the table now.)","options":[{"id":"A","text":"yok"},{"id":"B","text":"var"},{"id":"C","text":"yoktu"},{"id":"D","text":"varmış"}],"correct_option_id":"A","explanation":"Yok expresses nonexistence or absence: Masada hiç ekmek yok."},{"id":"YH1-V54-Q012","section":"1.3","skill_id":"YH1-01-03-S02","type":"single_select","prompt":"Choose the sentence meaning “There is no coffee in the cup.”","options":[{"id":"A","text":"Fincanda kahve yok."},{"id":"B","text":"Fincanda kahve var."},{"id":"C","text":"Fincanda kahve de var."},{"id":"D","text":"Fincandaki kahve sıcak."}],"correct_option_id":"A","explanation":"Yok indicates absence; the other sentences affirm coffee exists or describe it."},{"id":"YH1-V54-Q013","section":"1.3","skill_id":"YH1-01-03-S03","type":"single_select","prompt":"Complete the yes/no question asking whether there is bread: Ekmek ___?","options":[{"id":"A","text":"var mı"},{"id":"B","text":"var mi"},{"id":"C","text":"yoktur"},{"id":"D","text":"varım"}],"correct_option_id":"A","explanation":"The separate question particle harmonizes with var: Ekmek var mı?"},{"id":"YH1-V54-Q014","section":"1.3","skill_id":"YH1-01-03-S03","type":"single_select","prompt":"Choose the present-time question meaning “Is there a bus?”","options":[{"id":"A","text":"Otobüs var mı?"},{"id":"B","text":"Otobüs var mi?"},{"id":"C","text":"Otobüs varım?"},{"id":"D","text":"Otobüs var mıydı?"}],"correct_option_id":"A","explanation":"Existence questions use var plus separate mı: Otobüs var mı?"},{"id":"YH1-V54-Q015","section":"1.3","skill_id":"YH1-01-04-S02","type":"single_select","prompt":"What is the singular ordinal form of altı (six)?","options":[{"id":"A","text":"altıncı"},{"id":"B","text":"altıcı"},{"id":"C","text":"altıncılar"},{"id":"D","text":"altmış"}],"correct_option_id":"A","explanation":"The ordinal of altı is altıncı (sixth)."},{"id":"YH1-V54-Q016","section":"1.3","skill_id":"YH1-01-04-S02","type":"single_select","prompt":"What is the ordinal form of dört (four)?","options":[{"id":"A","text":"dördüncü"},{"id":"B","text":"dörtüncü"},{"id":"C","text":"dörtlü"},{"id":"D","text":"dördü"}],"correct_option_id":"A","explanation":"The ordinal of dört is dördüncü (fourth): the final t softens to d before the vowel-initial ordinal suffix -üncü."},{"id":"YH1-V54-Q017","section":"2.1","skill_id":"YH1-02-01-S03","type":"single_select","prompt":"Complete the present progressive yes/no question: Sen kitap okuyor ___?","options":[{"id":"A","text":"musun"},{"id":"B","text":"müsün"},{"id":"C","text":"mısın"},{"id":"D","text":"muyum"}],"correct_option_id":"A","explanation":"Okuyor has o as its last vowel, so the separate question particle is mu: okuyor musun?"},{"id":"YH1-V54-Q018","section":"2.1","skill_id":"YH1-02-01-S03","type":"single_select","prompt":"Complete the present progressive yes/no question: Sen bizi dinliyor ___?","options":[{"id":"A","text":"musun"},{"id":"B","text":"müsün"},{"id":"C","text":"misin"},{"id":"D","text":"muyuz"}],"correct_option_id":"A","explanation":"Dinliyor has o as its last vowel; the correct form is dinliyor musun?"},{"id":"YH1-V54-Q019","section":"2.2","skill_id":"YH1-02-02-S02","type":"single_select","prompt":"Complete the dative suffix: Çocuklar öğretmen___ soru soruyor. (The children ask the teacher a question.)","options":[{"id":"A","text":"e"},{"id":"B","text":"a"},{"id":"C","text":"i"},{"id":"D","text":"de"}],"correct_option_id":"A","explanation":"Öğretmen ends in a consonant and has a front vowel, so the dative is öğretmene."},{"id":"YH1-V54-Q020","section":"2.2","skill_id":"YH1-02-02-S02","type":"single_select","prompt":"Complete the dative suffix: Babam doktor___ telefon ediyor. (My father phones the doctor.)","options":[{"id":"A","text":"a"},{"id":"B","text":"e"},{"id":"C","text":"u"},{"id":"D","text":"da"}],"correct_option_id":"A","explanation":"Doktor has a back vowel and ends in a consonant, so the dative is doktora."},{"id":"YH1-V54-Q021","section":"2.2","skill_id":"YH1-02-02-S03","type":"single_select","prompt":"Supply the full dative suffix after the apostrophe, including a buffer consonant if needed: Yarın Bursa’___ gidiyoruz. (We are going to Bursa tomorrow.)","options":[{"id":"A","text":"ya"},{"id":"B","text":"ye"},{"id":"C","text":"a"},{"id":"D","text":"da"}],"correct_option_id":"A","explanation":"Bursa ends in a vowel and has a back vowel; the dative is Bursa’ya with buffer y."},{"id":"YH1-V54-Q022","section":"2.2","skill_id":"YH1-02-02-S03","type":"single_select","prompt":"Supply the full dative suffix after the apostrophe: Yarın İzmir’___ gidiyoruz. (We are going to İzmir tomorrow.)","options":[{"id":"A","text":"e"},{"id":"B","text":"a"},{"id":"C","text":"ye"},{"id":"D","text":"de"}],"correct_option_id":"A","explanation":"İzmir ends in a consonant and has a front vowel, so the dative is İzmir’e."},{"id":"YH1-V54-Q023","section":"2.2","skill_id":"YH1-02-03-S01","type":"single_select","prompt":"Complete the locative suffix: Telefon çanta___. (The phone is in the bag.)","options":[{"id":"A","text":"da"},{"id":"B","text":"de"},{"id":"C","text":"ta"},{"id":"D","text":"dan"}],"correct_option_id":"A","explanation":"Çanta ends in a vowel and has a back vowel, so the locative is çantada."},{"id":"YH1-V54-Q024","section":"2.2","skill_id":"YH1-02-03-S01","type":"single_select","prompt":"Complete the locative suffix: Kitap raf___. (The book is on the shelf.)","options":[{"id":"A","text":"ta"},{"id":"B","text":"da"},{"id":"C","text":"te"},{"id":"D","text":"tan"}],"correct_option_id":"A","explanation":"Raf ends in voiceless f and has a back vowel, so the locative is rafta."},{"id":"YH1-V56-Q001","section":"2.2","skill_id":"YH1-02-03-S02","type":"single_select","prompt":"Complete: Anahtar ev___ kaldı. (The key remained at home.)","options":[{"id":"A","text":"de"},{"id":"B","text":"da"},{"id":"C","text":"te"},{"id":"D","text":"den"}],"correct_option_id":"A","explanation":"Ev has a front vowel and ends in a voiced consonant: evde."},{"id":"YH1-V56-Q002","section":"2.2","skill_id":"YH1-02-03-S02","type":"single_select","prompt":"Complete: Biz ev___ oturuyoruz. (We are sitting at home.)","options":[{"id":"A","text":"ta"},{"id":"B","text":"den"},{"id":"C","text":"de"},{"id":"D","text":"e"}],"correct_option_id":"C","explanation":"Ev takes the locative ending -de because e is a front vowel and v is voiced: ev + de → evde (“at home”). -den means “from home,” and -e means “to home.”"},{"id":"YH1-V56-Q003","section":"2.2","skill_id":"YH1-02-04-S02","type":"single_select","prompt":"Complete: Öğrenci okul___ çıktı. (The student came out of school.)","options":[{"id":"A","text":"a"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"u"}],"correct_option_id":"B","explanation":"Okuldan marks movement from school with the ablative -dan."},{"id":"YH1-V56-Q004","section":"2.2","skill_id":"YH1-02-04-S02","type":"single_select","prompt":"Complete: Sabah okul___ eve geldim. (I came home from school.)","options":[{"id":"A","text":"da"},{"id":"B","text":"a"},{"id":"C","text":"dan"},{"id":"D","text":"un"}],"correct_option_id":"C","explanation":"Okuldan means from school; -dan is the ablative ending."},{"id":"YH1-V56-Q005","section":"2.2","skill_id":"YH1-02-04-S04","type":"single_select","prompt":"Complete: Çocuk park___ koşarak çıktı. (The child ran out of the park.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"tan"},{"id":"C","text":"ta"},{"id":"D","text":"a"}],"correct_option_id":"B","explanation":"Park ends in voiceless k, so the ablative is parktan."},{"id":"YH1-V56-Q006","section":"2.2","skill_id":"YH1-02-04-S04","type":"single_select","prompt":"Complete: Park___ eve yürüdük. (We walked home from the park.)","options":[{"id":"A","text":"a"},{"id":"B","text":"ta"},{"id":"C","text":"tan"},{"id":"D","text":"dan"}],"correct_option_id":"C","explanation":"The ablative suffix after park begins with t: parktan."},{"id":"YH1-V56-Q007","section":"2.3","skill_id":"YH1-02-05-S01","type":"single_select","prompt":"Complete: Sabah___ kadar uyudum. (I slept until morning.)","options":[{"id":"A","text":"a"},{"id":"B","text":"da"},{"id":"C","text":"dan"},{"id":"D","text":"ı"}],"correct_option_id":"A","explanation":"Kadar in the sense of until takes the dative: sabaha kadar."},{"id":"YH1-V56-Q008","section":"2.3","skill_id":"YH1-02-05-S01","type":"single_select","prompt":"Complete: Gece___ kadar çalıştık. (We worked until night.)","options":[{"id":"A","text":"yi"},{"id":"B","text":"den"},{"id":"C","text":"ye"},{"id":"D","text":"de"}],"correct_option_id":"C","explanation":"Geceye kadar means until night; vowel-final gece takes buffer y before -e."},{"id":"YH1-V56-Q009","section":"2.3","skill_id":"YH1-02-05-S03","type":"single_select","prompt":"Complete: Kahvaltıdan ___ işe gidiyorum. (I go to work after breakfast.)","options":[{"id":"A","text":"önce"},{"id":"B","text":"kadar"},{"id":"C","text":"sonra"},{"id":"D","text":"gibi"}],"correct_option_id":"C","explanation":"The ablative + sonra construction expresses after: kahvaltıdan sonra."},{"id":"YH1-V56-Q010","section":"2.3","skill_id":"YH1-02-05-S03","type":"single_select","prompt":"Complete: Dersten ___ arkadaşımı aradım. (I called my friend after class.)","options":[{"id":"A","text":"sonra"},{"id":"B","text":"önce"},{"id":"C","text":"gibi"},{"id":"D","text":"kadar"}],"correct_option_id":"A","explanation":"Sonra means “after” and commonly follows an ablative-marked noun: ders + ten + sonra → dersten sonra (“after class”)."},{"id":"YH1-V56-Q011","section":"3.1","skill_id":"YH1-03-01-S02","type":"single_select","prompt":"Complete: Bu benim söz___. (This is my word/promise.)","options":[{"id":"A","text":"üm"},{"id":"B","text":"im"},{"id":"C","text":"um"},{"id":"D","text":"ım"}],"correct_option_id":"A","explanation":"Söz takes the first-person singular possessive suffix -üm: sözüm."},{"id":"YH1-V56-Q012","section":"3.1","skill_id":"YH1-03-01-S02","type":"single_select","prompt":"Complete: Benim göz___ ağrıyor. (My eye hurts.)","options":[{"id":"A","text":"im"},{"id":"B","text":"um"},{"id":"C","text":"üm"},{"id":"D","text":"ım"}],"correct_option_id":"C","explanation":"Gözüm is göz + -üm, following four-way vowel harmony."},{"id":"YH1-V56-Q013","section":"3.1","skill_id":"YH1-03-01-S04","type":"single_select","prompt":"Complete: Bu sizin kitab___. (This is your book; plural/polite you.)","options":[{"id":"A","text":"ınız"},{"id":"B","text":"iniz"},{"id":"C","text":"unuz"},{"id":"D","text":"ünüz"}],"correct_option_id":"A","explanation":"The softened stem kitab- takes -ınız: kitabınız."},{"id":"YH1-V56-Q014","section":"3.1","skill_id":"YH1-03-01-S04","type":"single_select","prompt":"Complete: Sizin ev___ büyük. (Your [plural/polite] house is big.)","options":[{"id":"A","text":"imiz"},{"id":"B","text":"iniz"},{"id":"C","text":"leri"},{"id":"D","text":"in"}],"correct_option_id":"B","explanation":"Eviniz uses second-person plural/polite possessive -iniz."},{"id":"YH1-V56-Q015","section":"3.2","skill_id":"YH1-03-02-S02","type":"single_select","prompt":"Complete: Mehmet’in araba___ yeni. (Mehmet’s car is new.)","options":[{"id":"A","text":"ı"},{"id":"B","text":"si"},{"id":"C","text":"sı"},{"id":"D","text":"nı"}],"correct_option_id":"C","explanation":"After vowel-final araba, third-person possessive uses buffer s: arabası."},{"id":"YH1-V56-Q016","section":"3.2","skill_id":"YH1-03-02-S02","type":"single_select","prompt":"Complete: Elif’in oda___ geniş. (Elif’s room is spacious.)","options":[{"id":"A","text":"sı"},{"id":"B","text":"sü"},{"id":"C","text":"su"},{"id":"D","text":"ı"}],"correct_option_id":"A","explanation":"Oda + -sı gives odası, with third-person possessive buffer s."},{"id":"YH1-V56-Q017","section":"3.3","skill_id":"YH1-03-03-S02","type":"single_select","prompt":"Which means ‘the window of a particular house’ (not a general house-window compound)?","options":[{"id":"A","text":"ev pencere"},{"id":"B","text":"evin penceresi"},{"id":"C","text":"ev penceresi"},{"id":"D","text":"eve pencere"}],"correct_option_id":"B","explanation":"Specific possession takes evin (genitive) + penceresi (possessive)."},{"id":"YH1-V56-Q018","section":"3.3","skill_id":"YH1-03-03-S02","type":"single_select","prompt":"Which means ‘the garden of a particular school’ (not a generic school garden)?","options":[{"id":"A","text":"okul bahçesi"},{"id":"B","text":"okula bahçe"},{"id":"C","text":"okulun bahçesi"},{"id":"D","text":"okul bahçe"}],"correct_option_id":"C","explanation":"The genitive–possessive construction is okulun bahçesi."},{"id":"YH1-V56-Q019","section":"3.3","skill_id":"YH1-03-04-S02","type":"single_select","prompt":"Choose the bare noun phrase meaning ‘new books’ (no case or possessive suffix).","options":[{"id":"A","text":"yeniler kitaplar"},{"id":"B","text":"yeni kitaplar"},{"id":"C","text":"yeniler kitap"},{"id":"D","text":"yeninin kitapları"}],"correct_option_id":"B","explanation":"Turkish adjectives do not pluralize to agree with nouns: yeni kitaplar."},{"id":"YH1-V56-Q020","section":"3.3","skill_id":"YH1-03-04-S02","type":"single_select","prompt":"Choose the bare noun phrase meaning ‘small rooms’ (no case or possessive suffix).","options":[{"id":"A","text":"küçük odalar"},{"id":"B","text":"küçükler odalar"},{"id":"C","text":"küçük oda"},{"id":"D","text":"küçüklerin odaları"}],"correct_option_id":"A","explanation":"Plural attaches to the noun, not the adjective: küçük odalar."},{"id":"YH1-V56-Q021","section":"4.3","skill_id":"YH1-04-04-S02","type":"single_select","prompt":"Complete: Ben öğrenci___ her gün kitap okurdum. (When I was a student, I used to read daily.)","options":[{"id":"A","text":"yken"},{"id":"B","text":"ken"},{"id":"C","text":"den"},{"id":"D","text":"ler"}],"correct_option_id":"A","explanation":"The vowel-final noun öğrenci takes -yken: öğrenciyken."},{"id":"YH1-V56-Q022","section":"4.3","skill_id":"YH1-04-04-S02","type":"single_select","prompt":"Complete: Biz küçük___ bu sokakta oynardık. (When we were little, we played on this street.)","options":[{"id":"A","text":"ken"},{"id":"B","text":"ten"},{"id":"C","text":"ler"},{"id":"D","text":"e"}],"correct_option_id":"A","explanation":"Küçükken is küçük (“small/young”) + -ken (“when”); Biz küçükken means “when we were little.”"},{"id":"YH1-V56-Q023","section":"5.2","skill_id":"YH1-05-02-S03","type":"single_select","prompt":"Complete the adjective: tuz + -sIz → ___ (salt-free).","options":[{"id":"A","text":"tuzsız"},{"id":"B","text":"tuzsuz"},{"id":"C","text":"tuzsiz"},{"id":"D","text":"tuzsüz"}],"correct_option_id":"B","explanation":"Tuzsuz follows back rounded vowel harmony with -suz."},{"id":"YH1-V56-Q024","section":"5.2","skill_id":"YH1-05-02-S03","type":"single_select","prompt":"Complete the adjective: yağ + -sIz → ___ (fat-free).","options":[{"id":"A","text":"yağsız"},{"id":"B","text":"yağsiz"},{"id":"C","text":"yağsuz"},{"id":"D","text":"yağsüz"}],"correct_option_id":"A","explanation":"Yağsız follows back unrounded vowel harmony with -sız."},{"id":"YH1-V58-Q001","section":"6.2","skill_id":"YH1-06-02-S02","type":"single_select","prompt":"Choose the sentence meaning “I saw the specific dog.”","options":[{"id":"A","text":"Köpek gördüm."},{"id":"B","text":"Köpeği gördüm."},{"id":"C","text":"Köpeğe gördüm."},{"id":"D","text":"Köpekte gördüm."}],"correct_option_id":"B","explanation":"A specific direct object takes the accusative: köpek → köpeği (k softens to ğ)."},{"id":"YH1-V58-Q002","section":"6.2","skill_id":"YH1-06-02-S02","type":"single_select","prompt":"Complete with the simple past: Bu filmi daha önce ___. (I watched this particular film before.)","options":[{"id":"A","text":"izledim"},{"id":"B","text":"izledim mi"},{"id":"C","text":"izliyorum"},{"id":"D","text":"izlemek"}],"correct_option_id":"A","explanation":"Bu filmi is accusative-marked; izledim gives the stated past-tense meaning."},{"id":"YH1-V58-Q003","section":"6.3","skill_id":"YH1-06-03-S02","type":"single_select","prompt":"Complete the modifier: Yarın___ sınav zor olacak. (“Tomorrow’s exam will be difficult.”)","options":[{"id":"A","text":"ki"},{"id":"B","text":"kü"},{"id":"C","text":"kı"},{"id":"D","text":"ku"}],"correct_option_id":"A","explanation":"Yarınki is the standard temporal adjective meaning tomorrow’s."},{"id":"YH1-V58-Q004","section":"6.3","skill_id":"YH1-06-03-S02","type":"single_select","prompt":"Which expression means “today’s newspaper”?","options":[{"id":"A","text":"bugünde gazete"},{"id":"B","text":"bugünkü gazete"},{"id":"C","text":"bugünlü gazete"},{"id":"D","text":"bugüne gazete"}],"correct_option_id":"B","explanation":"Bugünkü is the adjective derived from bugün with -kü."},{"id":"YH1-V58-Q005","section":"7.1","skill_id":"YH1-07-01-S04","type":"single_select","prompt":"Choose the standard future tense of gitmek for “we will go.”","options":[{"id":"A","text":"gitaceğiz"},{"id":"B","text":"gideceğiz"},{"id":"C","text":"giteceğiz"},{"id":"D","text":"gidiyoruz"}],"correct_option_id":"B","explanation":"Git- softens t → d before -ecek: gideceğiz."},{"id":"YH1-V58-Q006","section":"7.1","skill_id":"YH1-07-01-S04","type":"single_select","prompt":"Complete with the future tense: Ben yarın eve ___ . (I will go home tomorrow.)","options":[{"id":"A","text":"gideceğim"},{"id":"B","text":"gittim"},{"id":"C","text":"gidiyordum"},{"id":"D","text":"giderdim"}],"correct_option_id":"A","explanation":"Gideceğim is the first-person singular future form of gitmek."},{"id":"YH1-V58-Q007","section":"9.1","skill_id":"YH1-09-01-S01","type":"single_select","prompt":"Choose the aorist habitual form: O her hafta sonu kitap ___ . (He/she reads books every weekend.)","options":[{"id":"A","text":"okudu"},{"id":"B","text":"okuyacak"},{"id":"C","text":"okur"},{"id":"D","text":"okuyordu"}],"correct_option_id":"C","explanation":"Okur is the aorist form indicating a habitual action."},{"id":"YH1-V58-Q008","section":"9.1","skill_id":"YH1-09-01-S01","type":"single_select","prompt":"Complete with the aorist: Biz genellikle erken ___ . (We generally get up early.)","options":[{"id":"A","text":"kalktık"},{"id":"B","text":"kalkarız"},{"id":"C","text":"kalkacağız"},{"id":"D","text":"kalkıyorduk"}],"correct_option_id":"B","explanation":"Kalkarız is the first-person plural aorist of kalkmak."},{"id":"YH1-V58-Q009","section":"9.2","skill_id":"YH1-09-02-S04","type":"single_select","prompt":"Complete the ability question: Siz Türkçe konuşabilir ___? (Can you speak Turkish?)","options":[{"id":"A","text":"mısınız"},{"id":"B","text":"musunuz"},{"id":"C","text":"misiniz"},{"id":"D","text":"müsünüz"}],"correct_option_id":"C","explanation":"Konuşabilir takes the question particle mi + second-person plural/polite ending: misiniz."},{"id":"YH1-V58-Q010","section":"9.2","skill_id":"YH1-09-02-S04","type":"single_select","prompt":"Complete: O hızlı koşabilir ___? (Can he/she run fast?)","options":[{"id":"A","text":"mi"},{"id":"B","text":"mı"},{"id":"C","text":"mu"},{"id":"D","text":"mü"}],"correct_option_id":"A","explanation":"The final vowel in koşabilir is i, so the separate question particle is mi."},{"id":"YH1-V58-Q011","section":"10.1","skill_id":"YH1-10-01-S03","type":"single_select","prompt":"Choose the connector that means “therefore”: Çok yorgunum, ___ erken yatacağım.","options":[{"id":"A","text":"çünkü"},{"id":"B","text":"bu yüzden"},{"id":"C","text":"ama"},{"id":"D","text":"veya"}],"correct_option_id":"B","explanation":"Bu yüzden expresses a result: I am tired, therefore I will go to bed early."},{"id":"YH1-V58-Q012","section":"10.1","skill_id":"YH1-10-01-S03","type":"single_select","prompt":"Complete with a cause connector: Evde kaldım ___ hastaydım. (I stayed home because I was ill.)","options":[{"id":"A","text":"bu yüzden"},{"id":"B","text":"ama"},{"id":"C","text":"çünkü"},{"id":"D","text":"ve"}],"correct_option_id":"C","explanation":"Çünkü introduces the reason for staying home."},{"id":"YH1-V58-Q013","section":"11.2","skill_id":"YH1-11-04-S02","type":"single_select","prompt":"Complete: Ayşe doktor ___ çalışıyor. (Ayşe works as a doctor.)","options":[{"id":"A","text":"olarak"},{"id":"B","text":"olmak"},{"id":"C","text":"oldu"},{"id":"D","text":"olunca"}],"correct_option_id":"A","explanation":"Doktor olarak means in the role/capacity of a doctor."},{"id":"YH1-V58-Q014","section":"11.2","skill_id":"YH1-11-04-S02","type":"single_select","prompt":"Which phrase expresses someone’s actual occupation as “a translator,” rather than merely resembling a translator?","options":[{"id":"A","text":"çevirmen gibi"},{"id":"B","text":"çevirmen olarak"},{"id":"C","text":"çevirmen olmak"},{"id":"D","text":"çevirmen oldu"}],"correct_option_id":"B","explanation":"Çevirmen olarak expresses the occupational role; gibi means like/as if."},{"id":"YH1-V58-Q015","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S01","type":"single_select","prompt":"Which group contains only Turkish back vowels?","options":[{"id":"A","text":"a, ı, o, u"},{"id":"B","text":"a, e, o, u"},{"id":"C","text":"e, i, ö, ü"},{"id":"D","text":"ı, i, o, u"}],"correct_option_id":"A","explanation":"The four back vowels are a, ı, o and u."},{"id":"YH1-V58-Q016","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S01","type":"single_select","prompt":"Which vowel is a back unrounded vowel?","options":[{"id":"A","text":"ü"},{"id":"B","text":"ö"},{"id":"C","text":"ı"},{"id":"D","text":"i"}],"correct_option_id":"C","explanation":"The back unrounded vowels are a and ı; ı is the only such choice."},{"id":"YH1-V58-Q017","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S02","type":"single_select","prompt":"Complete with the correct locative: sınıf + -DA → ___.","options":[{"id":"A","text":"sınıfda"},{"id":"B","text":"sınıfte"},{"id":"C","text":"sınıfta"},{"id":"D","text":"sınıfde"}],"correct_option_id":"C","explanation":"After voiceless f, -DA becomes -ta; the final vowel ı is back."},{"id":"YH1-V58-Q018","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S02","type":"single_select","prompt":"Complete with the correct locative: ağaç + -DA → ___.","options":[{"id":"A","text":"ağaçda"},{"id":"B","text":"ağaçta"},{"id":"C","text":"ağaçte"},{"id":"D","text":"ağaçde"}],"correct_option_id":"B","explanation":"After voiceless ç, -DA becomes -ta; the final vowel a is back."},{"id":"YH1-V58-Q019","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S01","type":"single_select","prompt":"Complete with the accusative: ağaç + -(y)I → ___.","options":[{"id":"A","text":"ağaçı"},{"id":"B","text":"ağacı"},{"id":"C","text":"ağaca"},{"id":"D","text":"ağaçta"}],"correct_option_id":"B","explanation":"Ağaç softens final ç to c before accusative -ı: ağacı."},{"id":"YH1-V58-Q020","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S01","type":"single_select","prompt":"Complete with the accusative: renk + -(y)I → ___.","options":[{"id":"A","text":"renki"},{"id":"B","text":"rengi"},{"id":"C","text":"renke"},{"id":"D","text":"renkte"}],"correct_option_id":"B","explanation":"Renk takes the accusative as rengi, with final k → g."},{"id":"YH1-V58-Q021","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S01","type":"single_select","prompt":"Complete: anne + third-person singular possessive → ___. (his/her mother)","options":[{"id":"A","text":"annei"},{"id":"B","text":"anneyi"},{"id":"C","text":"annesi"},{"id":"D","text":"annene"}],"correct_option_id":"C","explanation":"After vowel-final anne, third-person possessive uses buffer s: annesi."},{"id":"YH1-V58-Q022","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S01","type":"single_select","prompt":"Complete: oda + third-person singular possessive → ___. (his/her room)","options":[{"id":"A","text":"odayı"},{"id":"B","text":"odası"},{"id":"C","text":"odaı"},{"id":"D","text":"odaya"}],"correct_option_id":"B","explanation":"Oda takes the third-person possessive suffix with buffer s: odası."},{"id":"YH1-V58-Q023","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S02","type":"single_select","prompt":"Choose the neutral, non-emphatic subject–object–verb (SOV) order for “Zeynep is drinking tea.”","options":[{"id":"A","text":"Zeynep çay içiyor."},{"id":"B","text":"Zeynep içiyor çay."},{"id":"C","text":"Çay içiyor Zeynep."},{"id":"D","text":"İçiyor Zeynep çay."}],"correct_option_id":"A","explanation":"The neutral order is subject Zeynep, object çay, verb içiyor; alternatives may be possible in marked contexts."},{"id":"YH1-V58-Q024","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S02","type":"single_select","prompt":"Choose the neutral, non-emphatic subject–object–verb (SOV) order for “We are watching a film.”","options":[{"id":"A","text":"Film izliyoruz biz."},{"id":"B","text":"İzliyoruz biz film."},{"id":"C","text":"Biz izliyoruz film."},{"id":"D","text":"Biz film izliyoruz."}],"correct_option_id":"D","explanation":"Neutral subject–object–verb order is Biz film izliyoruz; other orders can occur for discourse emphasis."},{"id":"YH1-V60-Q001","section":"0","skill_id":"YH1-00-02-S02","type":"single_select","prompt":"Which is the standard Turkish written date for “5 November 2026”?","options":[{"id":"A","text":"11 Kasım 2026"},{"id":"B","text":"5 Kasım 2026"},{"id":"C","text":"Kasım 5, 2026"},{"id":"D","text":"2026 Kasım 5"}],"correct_option_id":"B","explanation":"In the standard written format, the day comes before the month: 5 Kasım 2026."},{"id":"YH1-V60-Q002","section":"0","skill_id":"YH1-00-02-S02","type":"single_select","prompt":"Choose the written date meaning “1 January 2027.”","options":[{"id":"A","text":"1 Ocak 2027"},{"id":"B","text":"1 Şubat 2027"},{"id":"C","text":"Ocak 1 2027"},{"id":"D","text":"2027 Ocak 1"}],"correct_option_id":"A","explanation":"Ocak means January; Turkish dates commonly place the day first."},{"id":"YH1-V60-Q003","section":"1.2","skill_id":"YH1-01-02-S04","type":"single_select","prompt":"Complete the negative nominal predicate: Biz hazır ___. (We are not ready.)","options":[{"id":"A","text":"değiliz"},{"id":"B","text":"değilim"},{"id":"C","text":"değilsin"},{"id":"D","text":"değillerim"}],"correct_option_id":"A","explanation":"Biz hazır değiliz is the first-person plural negative nominal predicate."},{"id":"YH1-V60-Q004","section":"1.2","skill_id":"YH1-01-02-S04","type":"single_select","prompt":"Complete: O öğrenci ___. (He/she is not a student.)","options":[{"id":"A","text":"değilim"},{"id":"B","text":"değil"},{"id":"C","text":"değilsiniz"},{"id":"D","text":"değiliz"}],"correct_option_id":"B","explanation":"The third-person singular negative nominal predicate is değil without a personal ending."},{"id":"YH1-V60-Q005","section":"2.1","skill_id":"YH1-02-01-S04","type":"single_select","prompt":"Choose the present progressive: Ben şimdi seni ___. (I am waiting for you now.)","options":[{"id":"A","text":"bekledim"},{"id":"B","text":"beklerim"},{"id":"C","text":"bekliyorum"},{"id":"D","text":"bekleyeceğim"}],"correct_option_id":"C","explanation":"Beklemek forms the present progressive as bekliyorum, with e → i before -yor."},{"id":"YH1-V60-Q006","section":"2.1","skill_id":"YH1-02-01-S04","type":"single_select","prompt":"Complete the present progressive: Biz şu anda yemeğe ___. (We are starting the meal now.)","options":[{"id":"A","text":"başladık"},{"id":"B","text":"başlıyoruz"},{"id":"C","text":"başlarız"},{"id":"D","text":"başlayacağız"}],"correct_option_id":"B","explanation":"Başlamak forms başlıyoruz in the first-person plural present progressive; the stem-final a narrows to ı."},{"id":"YH1-V60-Q007","section":"2.2","skill_id":"YH1-02-02-S04","type":"single_select","prompt":"Complete: Kitab___ bakıyorum. (I am looking at the book.)","options":[{"id":"A","text":"ı"},{"id":"B","text":"ta"},{"id":"C","text":"a"},{"id":"D","text":"tan"}],"correct_option_id":"C","explanation":"The dative of kitap is kitaba: p softens to b before the vowel-initial -a. The prompt already supplies kitab-."},{"id":"YH1-V60-Q008","section":"2.2","skill_id":"YH1-02-02-S04","type":"single_select","prompt":"Complete: Dolab___ koyuyorum. (I am putting it in the cupboard.)","options":[{"id":"A","text":"ı"},{"id":"B","text":"a"},{"id":"C","text":"ta"},{"id":"D","text":"ın"}],"correct_option_id":"B","explanation":"Dolap becomes dolaba with p → b before dative -a; dolaba koyuyorum means I am putting it into the cupboard."},{"id":"YH1-V60-Q009","section":"2.2","skill_id":"YH1-02-04-S03","type":"single_select","prompt":"Complete: İstanbul’___ geliyorum. (I am coming from Istanbul.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"den"},{"id":"C","text":"tan"},{"id":"D","text":"ten"}],"correct_option_id":"A","explanation":"İstanbul’dan uses -dan because the last vowel u is back and final l is voiced."},{"id":"YH1-V60-Q010","section":"2.2","skill_id":"YH1-02-04-S03","type":"single_select","prompt":"Complete: Ev___ çıkıyorum. (I am leaving the house.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"den"},{"id":"C","text":"tan"},{"id":"D","text":"ten"}],"correct_option_id":"B","explanation":"Evden uses ablative -den after a front vowel and a voiced consonant."},{"id":"YH1-V60-Q011","section":"2.3","skill_id":"YH1-02-05-S04","type":"single_select","prompt":"Complete: Ders___ sonra eve gideceğim. (After class I will go home.)","options":[{"id":"A","text":"te"},{"id":"B","text":"ten"},{"id":"C","text":"e"},{"id":"D","text":"i"}],"correct_option_id":"B","explanation":"Dersten sonra uses ablative -ten following voiceless s."},{"id":"YH1-V60-Q012","section":"2.3","skill_id":"YH1-02-05-S04","type":"single_select","prompt":"Which phrase means “after the meeting”?","options":[{"id":"A","text":"toplantıya sonra"},{"id":"B","text":"toplantıda sonra"},{"id":"C","text":"toplantıdan sonra"},{"id":"D","text":"toplantıyı sonra"}],"correct_option_id":"C","explanation":"Toplantıdan sonra uses the ablative -dan before sonra."},{"id":"YH1-V60-Q013","section":"3.2","skill_id":"YH1-03-02-S03","type":"single_select","prompt":"Which means “Mehmet’s car”?","options":[{"id":"A","text":"Mehmet araba"},{"id":"B","text":"Mehmet’in arabası"},{"id":"C","text":"Mehmet’i araba"},{"id":"D","text":"Mehmet’e arabası"}],"correct_option_id":"B","explanation":"Mehmet’in marks the possessor with genitive; arabası has third-person possessive -sı."},{"id":"YH1-V60-Q014","section":"3.2","skill_id":"YH1-03-02-S03","type":"single_select","prompt":"Which means “the child’s room”?","options":[{"id":"A","text":"çocuğun odası"},{"id":"B","text":"çocuk odası"},{"id":"C","text":"çocuğa oda"},{"id":"D","text":"çocuğu oda"}],"correct_option_id":"A","explanation":"Çocuğun odası has genitive çocuğun and possessive odası; çocuk softens to çocuğ-."},{"id":"YH1-V60-Q015","section":"3.3","skill_id":"YH1-03-04-S03","type":"single_select","prompt":"Which is an adjective + noun phrase meaning “a quiet street”?","options":[{"id":"A","text":"sokak kapısı"},{"id":"B","text":"sessiz sokak"},{"id":"C","text":"şehir merkezi"},{"id":"D","text":"okul bahçesi"}],"correct_option_id":"B","explanation":"Sessiz is an adjective modifying the noun sokak; the other phrases are noun compounds."},{"id":"YH1-V60-Q016","section":"3.3","skill_id":"YH1-03-04-S03","type":"single_select","prompt":"Choose the adjective + noun phrase meaning “an old house.”","options":[{"id":"A","text":"ev kapısı"},{"id":"B","text":"eski ev"},{"id":"C","text":"evin kapısı"},{"id":"D","text":"ev sahibi"}],"correct_option_id":"B","explanation":"Eski modifies ev as an adjective; the other choices are noun constructions."},{"id":"YH1-V60-Q017","section":"4.3","skill_id":"YH1-04-03-S04","type":"single_select","prompt":"Complete the past progressive: Ben dün saat dokuzda kitap ___. (I was reading a book at nine yesterday.)","options":[{"id":"A","text":"okudum"},{"id":"B","text":"okuyacağım"},{"id":"C","text":"okuyordum"},{"id":"D","text":"okurum"}],"correct_option_id":"C","explanation":"Okuyordum is first-person singular past progressive."},{"id":"YH1-V60-Q018","section":"4.3","skill_id":"YH1-04-03-S04","type":"single_select","prompt":"Complete: Onlar dün akşam televizyon ___. (They were watching TV last night.)","options":[{"id":"A","text":"izliyorlardı"},{"id":"B","text":"izleyecekler"},{"id":"C","text":"izlediler"},{"id":"D","text":"izlerler"}],"correct_option_id":"A","explanation":"İzliyorlardı expresses third-person plural past progressive."},{"id":"YH1-V60-Q019","section":"4.3","skill_id":"YH1-04-05-S02","type":"single_select","prompt":"Choose the phrase meaning “coffee and tea.”","options":[{"id":"A","text":"kahve ile çay"},{"id":"B","text":"kahve için çay"},{"id":"C","text":"kahveden çay"},{"id":"D","text":"kahvede çay"}],"correct_option_id":"A","explanation":"İle can coordinate nouns, meaning and, as in kahve ile çay."},{"id":"YH1-V60-Q020","section":"4.3","skill_id":"YH1-04-05-S02","type":"single_select","prompt":"Which sentence means “I went with Ayşe”?","options":[{"id":"A","text":"Ayşe için gittim."},{"id":"B","text":"Ayşe’den gittim."},{"id":"C","text":"Ayşe ile gittim."},{"id":"D","text":"Ayşe’ye gittim."}],"correct_option_id":"C","explanation":"Ayşe ile gittim means “I went with Ayşe.” İle marks accompaniment; Ayşe için means “for Ayşe,” and Ayşe’ye indicates movement toward Ayşe."},{"id":"YH1-V60-Q021","section":"6.3","skill_id":"YH1-06-03-S03","type":"single_select","prompt":"Complete the locative relative: Masa___ kitap benim. (The book on the table is mine.)","options":[{"id":"A","text":"daki"},{"id":"B","text":"deki"},{"id":"C","text":"dan"},{"id":"D","text":"da"}],"correct_option_id":"A","explanation":"Masadaki modifies kitap: masa + da + ki."},{"id":"YH1-V60-Q022","section":"6.3","skill_id":"YH1-06-03-S03","type":"single_select","prompt":"Which phrase means “the person at home”?","options":[{"id":"A","text":"evde insan"},{"id":"B","text":"evdeki kişi"},{"id":"C","text":"eveki kişi"},{"id":"D","text":"evden kişi"}],"correct_option_id":"B","explanation":"Evdeki is the locative relative adjective modifying kişi."},{"id":"YH1-V60-Q023","section":"7.2","skill_id":"YH1-07-02-S02","type":"single_select","prompt":"Choose the future-in-the-past form: Biz gelecektik ama hastalandık. What does gelecektik mean?","options":[{"id":"A","text":"we are coming"},{"id":"B","text":"we came"},{"id":"C","text":"we were going to come"},{"id":"D","text":"we will come"}],"correct_option_id":"C","explanation":"Gelecektik expresses a past plan or expectation to come."},{"id":"YH1-V60-Q024","section":"7.2","skill_id":"YH1-07-02-S02","type":"single_select","prompt":"Complete the past intention: O arayacak___ ama unuttu. (He/she was going to call, but forgot.)","options":[{"id":"A","text":"tı"},{"id":"B","text":"tım"},{"id":"C","text":"tık"},{"id":"D","text":"sın"}],"correct_option_id":"A","explanation":"Arayacaktı expresses a past plan or intention: ara-yacak-tı. The future suffix ends in k, which remains k before the consonant-initial past marker -tı."},{"id":"YH1-V62-Q001","section":"7.2","skill_id":"YH1-07-02-S03","type":"single_select","prompt":"Complete the negative future-in-the-past. Fill only the missing portion before -tik: Biz git___tik. (We were not going to go.)","options":[{"id":"A","text":"meyecek"},{"id":"B","text":"meyeceğ"},{"id":"C","text":"meyecekti"},{"id":"D","text":"meyecektik"}],"correct_option_id":"A","explanation":"Gitmeyecektik = git- + -me + -yecek + -tik. Since -tik is already printed after the blank, choose only -meyecek."},{"id":"YH1-V62-Q002","section":"7.2","skill_id":"YH1-07-02-S03","type":"single_select","prompt":"Which sentence means “She was not going to buy it”?","options":[{"id":"A","text":"Onu almayacaktı."},{"id":"B","text":"Onu almayacak."},{"id":"C","text":"Onu almadı."},{"id":"D","text":"Onu almıyordu."}],"correct_option_id":"A","explanation":"Almayacaktı expresses a negative future intention viewed from the past."},{"id":"YH1-V62-Q003","section":"7.3","skill_id":"YH1-07-04-S03","type":"single_select","prompt":"Complete: ___ göre bu film çok güzel. (In my opinion, this film is very good.)","options":[{"id":"A","text":"Beni"},{"id":"B","text":"Bana"},{"id":"C","text":"Benim"},{"id":"D","text":"Bende"}],"correct_option_id":"B","explanation":"Bana göre means in my opinion; göre requires the dative."},{"id":"YH1-V62-Q004","section":"7.3","skill_id":"YH1-07-04-S03","type":"single_select","prompt":"Which expression means “according to the teacher”?","options":[{"id":"A","text":"öğretmeni göre"},{"id":"B","text":"öğretmenden göre"},{"id":"C","text":"öğretmene göre"},{"id":"D","text":"öğretmenin göre"}],"correct_option_id":"C","explanation":"Öğretmene göre uses the dative ending -e with göre."},{"id":"YH1-V62-Q005","section":"7.3","skill_id":"YH1-07-05-S02","type":"single_select","prompt":"Complete: Bu çanta seninki ___ ağır. (This bag is as heavy as yours.)","options":[{"id":"A","text":"göre"},{"id":"B","text":"kadar"},{"id":"C","text":"sonra"},{"id":"D","text":"önce"}],"correct_option_id":"B","explanation":"Seninki kadar ağır compares equal degree of heaviness."},{"id":"YH1-V62-Q006","section":"7.3","skill_id":"YH1-07-05-S02","type":"single_select","prompt":"Which means “as tall as my brother”?","options":[{"id":"A","text":"kardeşimden uzun"},{"id":"B","text":"kardeşim için uzun"},{"id":"C","text":"kardeşim kadar uzun"},{"id":"D","text":"kardeşime uzun"}],"correct_option_id":"C","explanation":"Kardeşim kadar uzun expresses equal degree with kadar."},{"id":"YH1-V62-Q007","section":"8.1","skill_id":"YH1-08-02-S02","type":"single_select","prompt":"Complete the reported negative nominal predicate: Meğer onlar evde ___ . (Apparently they were not at home.)","options":[{"id":"A","text":"değiller"},{"id":"B","text":"değilmişler"},{"id":"C","text":"değildiler"},{"id":"D","text":"değiliz"}],"correct_option_id":"B","explanation":"Değilmişler expresses an inferred or reported negative nominal predicate for onlar."},{"id":"YH1-V62-Q008","section":"8.1","skill_id":"YH1-08-02-S02","type":"single_select","prompt":"Which sentence means “Apparently the shop was not open”?","options":[{"id":"A","text":"Dükkân açık değil."},{"id":"B","text":"Dükkân açık değildi."},{"id":"C","text":"Dükkân açık değilmiş."},{"id":"D","text":"Dükkân açık olmayacak."}],"correct_option_id":"C","explanation":"Değilmiş marks a reported or newly discovered negative nominal predicate."},{"id":"YH1-V62-Q009","section":"8.1","skill_id":"YH1-08-02-S03","type":"single_select","prompt":"Which reported/inferred nominal question means “Was Ali apparently sick?”","options":[{"id":"A","text":"Ali hasta mı?"},{"id":"B","text":"Ali hasta mıydı?"},{"id":"C","text":"Ali hasta mıymış?"},{"id":"D","text":"Ali hasta mısın?"}],"correct_option_id":"C","explanation":"Ali hasta mıymış? uses the separate question particle mı followed by the reported/inferred past form -ymış. The other options ask about a present or directly known past condition, or address “you.”"},{"id":"YH1-V62-Q010","section":"8.1","skill_id":"YH1-08-02-S03","type":"single_select","prompt":"Complete the reported nominal question: Bu ev eski ___? (Was this house apparently old?)","options":[{"id":"A","text":"miydi"},{"id":"B","text":"miymiş"},{"id":"C","text":"midir"},{"id":"D","text":"misiniz"}],"correct_option_id":"B","explanation":"Eski miymiş? asks whether it was reportedly or apparently old."},{"id":"YH1-V62-Q011","section":"8.2","skill_id":"YH1-08-03-S02","type":"single_select","prompt":"Choose the negative reported present progressive: O şimdi çalış___ . (Apparently he/she is not working now.)","options":[{"id":"A","text":"mıyormuş"},{"id":"B","text":"miyormuş"},{"id":"C","text":"muyormuş"},{"id":"D","text":"muyormuştu"}],"correct_option_id":"A","explanation":"Çalışmıyormuş is çalış- + -mı- + -yor + -muş."},{"id":"YH1-V62-Q012","section":"8.2","skill_id":"YH1-08-03-S02","type":"single_select","prompt":"Which sentence means “Apparently they are not coming”?","options":[{"id":"A","text":"Onlar gelmediler."},{"id":"B","text":"Onlar gelmeyecekler."},{"id":"C","text":"Onlar gelmiyorlarmış."},{"id":"D","text":"Onlar gelmiyorlar mı?"}],"correct_option_id":"C","explanation":"Gelmiyorlarmış is the negative reported present progressive."},{"id":"YH1-V62-Q013","section":"8.2","skill_id":"YH1-08-03-S03","type":"single_select","prompt":"Which question uses the reported/inferred form to ask whether he was NOT coming?","options":[{"id":"A","text":"Gelmiyor muymuş?"},{"id":"B","text":"Gelmedi mi?"},{"id":"C","text":"Gelmeyecek mi?"},{"id":"D","text":"Gelmiyor muydu?"}],"correct_option_id":"A","explanation":"Gelmiyor muymuş? asks whether he apparently was not coming: gel-mi-yor (negative progressive) + muymuş (reported question). Gelmiyor muydu? instead asks directly about the past."},{"id":"YH1-V62-Q014","section":"8.2","skill_id":"YH1-08-03-S03","type":"single_select","prompt":"Complete the reported progressive question: Yağmur yağıyor ___? (Was it apparently raining?)","options":[{"id":"A","text":"muydu"},{"id":"B","text":"muymuş"},{"id":"C","text":"miydi"},{"id":"D","text":"miyormuş"}],"correct_option_id":"B","explanation":"Yağıyor muymuş? is the reported present-progressive question; the particle is mu after -yor."},{"id":"YH1-V62-Q015","section":"8.2","skill_id":"YH1-08-04-S03","type":"single_select","prompt":"Which asks “Was she apparently going to leave?” using the reported future?","options":[{"id":"A","text":"Ayrılıyor mu?"},{"id":"B","text":"Ayrılacak mıymış?"},{"id":"C","text":"Ayrıldı mı?"},{"id":"D","text":"Ayrılacak mıydı?"}],"correct_option_id":"B","explanation":"Ayrılacak mıymış? uses future -acak and reported question miymiş."},{"id":"YH1-V62-Q016","section":"8.2","skill_id":"YH1-08-04-S03","type":"single_select","prompt":"Complete: Toplantı yarın başlayacak ___? (Was the meeting apparently going to start tomorrow?)","options":[{"id":"A","text":"mıymış"},{"id":"B","text":"miymiş"},{"id":"C","text":"miydi"},{"id":"D","text":"mısın"}],"correct_option_id":"A","explanation":"Başlayacak mıymış? uses mı after the back vowel a in -acak."},{"id":"YH1-V62-Q017","section":"9.1","skill_id":"YH1-09-01-S05","type":"single_select","prompt":"Choose the first-person singular aorist: Ben hafta sonları erken ___. (I get up early on weekends.)","options":[{"id":"A","text":"kalktım"},{"id":"B","text":"kalkarım"},{"id":"C","text":"kalkıyorum"},{"id":"D","text":"kalkacağım"}],"correct_option_id":"B","explanation":"Kalkarım is the first-person singular aorist of kalkmak."},{"id":"YH1-V62-Q018","section":"9.1","skill_id":"YH1-09-01-S05","type":"single_select","prompt":"Complete the habitual sentence: O her sabah çay ___. (He/she drinks tea every morning.)","options":[{"id":"A","text":"içti"},{"id":"B","text":"içecek"},{"id":"C","text":"içer"},{"id":"D","text":"içiyor"}],"correct_option_id":"C","explanation":"İçer is the third-person singular aorist, appropriate for a repeated habit."},{"id":"YH1-V62-Q019","section":"9.2","skill_id":"YH1-09-02-S03","type":"single_select","prompt":"Choose the ability form: Biz yarın size yardım ___. (We can help you tomorrow.)","options":[{"id":"A","text":"edebilirim"},{"id":"B","text":"edebiliriz"},{"id":"C","text":"edebilirsiniz"},{"id":"D","text":"edebilirler"}],"correct_option_id":"B","explanation":"Yardım edebiliriz is first-person plural ability."},{"id":"YH1-V62-Q020","section":"9.2","skill_id":"YH1-09-02-S03","type":"single_select","prompt":"Complete: Biz bu soruyu çözebil___ . (We can solve this question.)","options":[{"id":"A","text":"irim"},{"id":"B","text":"irsin"},{"id":"C","text":"iriz"},{"id":"D","text":"irler"}],"correct_option_id":"C","explanation":"Çözebiliriz combines ability with first-person plural -iz."},{"id":"YH1-V62-Q021","section":"9.3","skill_id":"YH1-09-03-S03","type":"single_select","prompt":"Complete the past negative habit: Çocukken kahve iç___ . (I did not use to drink coffee as a child.)","options":[{"id":"A","text":"medim"},{"id":"B","text":"mezdim"},{"id":"C","text":"miyorum"},{"id":"D","text":"meyeceğim"}],"correct_option_id":"B","explanation":"İçmezdim expresses a negative past habit."},{"id":"YH1-V62-Q022","section":"9.3","skill_id":"YH1-09-03-S03","type":"single_select","prompt":"Which sentence means “We did not use to go there”?","options":[{"id":"A","text":"Oraya gitmeyeceğiz."},{"id":"B","text":"Oraya gitmedik."},{"id":"C","text":"Oraya gitmezdik."},{"id":"D","text":"Oraya gitmiyoruz."}],"correct_option_id":"C","explanation":"Gitmezdik is the first-person plural negative aorist in the past."},{"id":"YH1-V62-Q023","section":"9.3","skill_id":"YH1-09-04-S01","type":"single_select","prompt":"Complete the reported past habit: Dedemin anlattığına göre, eskiden burada kar yağar___ . (According to my grandfather, it apparently used to snow here.)","options":[{"id":"A","text":"mış"},{"id":"B","text":"ıyor"},{"id":"C","text":"acak"},{"id":"D","text":"dı"}],"correct_option_id":"A","explanation":"Yağarmış combines the aorist -ar with the reported/inferred past -mış. The grandfather’s account supplies the reported-information context."},{"id":"YH1-V62-Q024","section":"9.3","skill_id":"YH1-09-04-S01","type":"single_select","prompt":"Which sentence reports that someone apparently used to walk to school?","options":[{"id":"A","text":"Okula yürürmüş."},{"id":"B","text":"Okula yürüyor."},{"id":"C","text":"Okula yürüdü."},{"id":"D","text":"Okula yürüyecek."}],"correct_option_id":"A","explanation":"Yürürmüş is the reported aorist, expressing a habit known from a report."},{"id":"YH1-V64-Q001","section":"9.3","skill_id":"YH1-09-04-S03","type":"single_select","prompt":"Complete the negative reported habitual form: Eskiden et yemez___. (Apparently he/she did not use to eat meat.)","options":[{"id":"A","text":"di"},{"id":"B","text":"miş"},{"id":"C","text":"yor"},{"id":"D","text":"cek"}],"correct_option_id":"B","explanation":"Yemezmiş combines negative habitual -mez with reported past -miş."},{"id":"YH1-V64-Q002","section":"9.3","skill_id":"YH1-09-04-S03","type":"single_select","prompt":"Which sentence means “Apparently she never used to smoke”?","options":[{"id":"A","text":"Hiç sigara içmezmiş."},{"id":"B","text":"Hiç sigara içmiyor."},{"id":"C","text":"Hiç sigara içmedi."},{"id":"D","text":"Hiç sigara içmeyecek."}],"correct_option_id":"A","explanation":"İçmezmiş reports a negative former habit learned indirectly."},{"id":"YH1-V64-Q003","section":"10.1","skill_id":"YH1-10-02-S01","type":"single_select","prompt":"Choose the phrase meaning “the window of the teacher’s office”.","options":[{"id":"A","text":"öğretmenin odanın penceresi"},{"id":"B","text":"öğretmenin odasının penceresi"},{"id":"C","text":"öğretmen odası pencere"},{"id":"D","text":"öğretmene odasının penceresi"}],"correct_option_id":"B","explanation":"Öğretmenin odasının penceresi has genitive–possessive marking at both links."},{"id":"YH1-V64-Q004","section":"10.1","skill_id":"YH1-10-02-S01","type":"single_select","prompt":"Complete the phrase: okulun bahçe___ kapısı (the gate of the school’s garden).","options":[{"id":"A","text":"si"},{"id":"B","text":"sinin"},{"id":"C","text":"sine"},{"id":"D","text":"sinde"}],"correct_option_id":"B","explanation":"Bahçesinin marks the school garden as the possessor of the gate: okulun bahçesinin kapısı."},{"id":"YH1-V64-Q005","section":"10.2","skill_id":"YH1-10-03-S03","type":"single_select","prompt":"Complete the possessive verbal noun agreeing with senin: Senin burada kal___ iyi olur. (It would be good for you to stay here.)","options":[{"id":"A","text":"mam"},{"id":"B","text":"man"},{"id":"C","text":"ması"},{"id":"D","text":"mak"}],"correct_option_id":"B","explanation":"Kalman is the nominalized verb kal-ma with second-person possessive -n."},{"id":"YH1-V64-Q006","section":"10.2","skill_id":"YH1-10-03-S03","type":"single_select","prompt":"Choose the unmarked (non-accusative) possessive verbal-noun phrase for “your leaving early” (addressing one person). The subject is senin.","options":[{"id":"A","text":"senin erken gitmem"},{"id":"B","text":"senin erken gitmesi"},{"id":"C","text":"senin erken gitmen"},{"id":"D","text":"senin erken gitmeni"}],"correct_option_id":"C","explanation":"Senin (your) requires second-person singular agreement on the verbal noun: git-me-n → gitmen. Gitmeni has an additional accusative -i and is grammatical in some contexts, but not the unmarked form requested."},{"id":"YH1-V64-Q007","section":"10.2","skill_id":"YH1-10-04-S02","type":"single_select","prompt":"Complete: Doktorla konuşmak ___ hastaneye gittim. (I went to the hospital to speak with the doctor.)","options":[{"id":"A","text":"kadar"},{"id":"B","text":"üzere"},{"id":"C","text":"sonra"},{"id":"D","text":"önce"}],"correct_option_id":"B","explanation":"Konuşmak üzere marks the purpose of the hospital visit: “I went to the hospital in order to speak with the doctor.” The alternatives kadar, sonra, and önce do not form the intended purpose construction here."},{"id":"YH1-V64-Q008","section":"10.2","skill_id":"YH1-10-04-S02","type":"single_select","prompt":"Which expression means “in order to learn Turkish” using -mek üzere?","options":[{"id":"A","text":"Türkçe öğrendikten sonra"},{"id":"B","text":"Türkçe öğrenmek üzere"},{"id":"C","text":"Türkçe öğrenmeden önce"},{"id":"D","text":"Türkçe öğrendiği için"}],"correct_option_id":"B","explanation":"Öğrenmek üzere is the infinitive followed by üzere, expressing purpose."},{"id":"YH1-V64-Q009","section":"10.3","skill_id":"YH1-10-05-S03","type":"single_select","prompt":"Complete: Kitabı oku___ sonra uyudum. (After reading the book, I slept.)","options":[{"id":"A","text":"madan"},{"id":"B","text":"yacak"},{"id":"C","text":"duktan"},{"id":"D","text":"yarak"}],"correct_option_id":"C","explanation":"Okuduktan sonra means after reading; oku- takes -duktan."},{"id":"YH1-V64-Q010","section":"10.3","skill_id":"YH1-10-05-S03","type":"single_select","prompt":"Which sentence means “We ate after the film ended”?","options":[{"id":"A","text":"Film bitmeden önce yemek yedik."},{"id":"B","text":"Film biterken yemek yedik."},{"id":"C","text":"Film bittikten sonra yemek yedik."},{"id":"D","text":"Film bitinceye kadar yemek yedik."}],"correct_option_id":"C","explanation":"Bittikten sonra marks an event completed before the next action."},{"id":"YH1-V64-Q011","section":"10.3","skill_id":"YH1-10-06-S02","type":"single_select","prompt":"Complete: Yemek ye___ önce ellerini yıka. (Wash your hands before eating.)","options":[{"id":"A","text":"dikten"},{"id":"B","text":"meden"},{"id":"C","text":"yerek"},{"id":"D","text":"yecek"}],"correct_option_id":"B","explanation":"Ye- (eat) + -meden + önce yields yemeden önce (“before eating”). The negative converb -mAdAn plus önce expresses “before doing.”"},{"id":"YH1-V64-Q012","section":"10.3","skill_id":"YH1-10-06-S02","type":"single_select","prompt":"Which means “before sleeping”?","options":[{"id":"A","text":"uyuduktan sonra"},{"id":"B","text":"uyurken"},{"id":"C","text":"uyumadan önce"},{"id":"D","text":"uyumak üzere"}],"correct_option_id":"C","explanation":"Uyumadan önce combines -madan with önce to mean before sleeping."},{"id":"YH1-V64-Q013","section":"11.1","skill_id":"YH1-11-01-S03","type":"single_select","prompt":"Complete: Kapıyı aç___ içeri girdim. (I opened the door and entered.)","options":[{"id":"A","text":"ıp"},{"id":"B","text":"ip"},{"id":"C","text":"up"},{"id":"D","text":"üp"}],"correct_option_id":"A","explanation":"Açıp uses the converb -ıp after the back unrounded vowel a."},{"id":"YH1-V64-Q014","section":"11.1","skill_id":"YH1-11-01-S03","type":"single_select","prompt":"Complete: Eve gel___ yemek yaptım. (I came home and cooked.)","options":[{"id":"A","text":"ıp"},{"id":"B","text":"up"},{"id":"C","text":"üp"},{"id":"D","text":"ip"}],"correct_option_id":"D","explanation":"Gelip takes -ip after the front unrounded vowel e."},{"id":"YH1-V64-Q015","section":"11.1","skill_id":"YH1-11-02-S02","type":"single_select","prompt":"Complete: Hiç konuş___ odadan çıktı. (He/she left the room without speaking.)","options":[{"id":"A","text":"arak"},{"id":"B","text":"madan"},{"id":"C","text":"duktan"},{"id":"D","text":"up"}],"correct_option_id":"B","explanation":"Konuşmadan is konuş- (speak) + -madan (“without speaking”). Hiç reinforces that no speaking took place."},{"id":"YH1-V64-Q016","section":"11.1","skill_id":"YH1-11-02-S02","type":"single_select","prompt":"Which means “without looking”?","options":[{"id":"A","text":"bakarak"},{"id":"B","text":"bakıp"},{"id":"C","text":"bakmadan"},{"id":"D","text":"baktıktan sonra"}],"correct_option_id":"C","explanation":"Bakmadan is the negative converb expressing without looking."},{"id":"YH1-V64-Q017","section":"11.2","skill_id":"YH1-11-03-S03","type":"single_select","prompt":"Complete: Çocuk gül___ odaya girdi. (The child entered the room laughing.)","options":[{"id":"A","text":"erek"},{"id":"B","text":"arak"},{"id":"C","text":"madan"},{"id":"D","text":"ıp"}],"correct_option_id":"A","explanation":"Gülerek uses -erek after the front vowel ü."},{"id":"YH1-V64-Q018","section":"11.2","skill_id":"YH1-11-03-S03","type":"single_select","prompt":"Which means “walking” as a manner of movement?","options":[{"id":"A","text":"yürüyerek"},{"id":"B","text":"yürümeden"},{"id":"C","text":"yürüdükten"},{"id":"D","text":"yürümek üzere"}],"correct_option_id":"A","explanation":"Yürüyerek is the manner converb of yürümek."},{"id":"YH1-V64-Q019","section":"12.1","skill_id":"YH1-12-01-S03","type":"single_select","prompt":"Choose the grammatical sentence in which an infinitive functions as the subject and means “Reading is useful.”","options":[{"id":"A","text":"Okuyor faydalıdır."},{"id":"B","text":"Okudu faydalıdır."},{"id":"C","text":"Okumak faydalıdır."},{"id":"D","text":"Okuyacak faydalıdır."}],"correct_option_id":"C","explanation":"Okumak is an infinitive nominal subject."},{"id":"YH1-V64-Q020","section":"12.1","skill_id":"YH1-12-01-S03","type":"single_select","prompt":"Complete: Her gün yürü___ sağlıklıdır. (Walking every day is healthy.)","options":[{"id":"A","text":"mek"},{"id":"B","text
