erent forms or endings, not the requested -A converb."},{"id":"YH1-V68-Q018","section":"11.3","skill_id":"YH1-11-05-S03","type":"single_select","prompt":"Complete with the reduplicated -A converb: Bebek ___ uyudu. (The baby fell asleep while crying continuously.)","options":[{"id":"A","text":"ağlayacak"},{"id":"B","text":"ağlaya ağlaya"},{"id":"C","text":"ağlamıyor"},{"id":"D","text":"ağladı"}],"correct_option_id":"B","explanation":"Ağlaya ağlaya conveys repeated or sustained crying accompanying the process of falling asleep; the converb does not itself mean “after.”"},{"id":"YH1-V68-Q019","section":"12.2","skill_id":"YH1-12-02-S03","type":"single_select","prompt":"Choose “I heard that Mehmet arrived.”","options":[{"id":"A","text":"Mehmet’in gelmesini duydum."},{"id":"B","text":"Mehmet’in geldiğini duydum."},{"id":"C","text":"Mehmet’in gelince duydum."},{"id":"D","text":"Mehmet’in gelecek duydum."}],"correct_option_id":"B","explanation":"Geldiğini is a factive embedded-clause form with possessive and accusative marking."},{"id":"YH1-V68-Q020","section":"12.2","skill_id":"YH1-12-02-S03","type":"single_select","prompt":"Complete: Ayşe’nin sınavı geç___ biliyorum. (I know that Ayşe passed the exam.)","options":[{"id":"A","text":"tiğini"},{"id":"B","text":"mesini"},{"id":"C","text":"ince"},{"id":"D","text":"mek"}],"correct_option_id":"A","explanation":"Geçtiğini is built from geç- + -DIK (with consonant softening before a vowel) + third-person possessive + accusative, yielding “that Ayşe passed.”"},{"id":"YH1-V68-Q021","section":"12.3","skill_id":"YH1-12-03-S02","type":"single_select","prompt":"Choose “My mother told me to study.”","options":[{"id":"A","text":"Annem bana ders çalışmamı söyledi."},{"id":"B","text":"Annem bana ders çalıştım söyledi."},{"id":"C","text":"Annem bana ders çalışmak söyledi."},{"id":"D","text":"Annem bana ders çalışıyor söyledi."}],"correct_option_id":"A","explanation":"Çalışmamı is a first-person possessive verbal noun with accusative marking."},{"id":"YH1-V68-Q022","section":"12.3","skill_id":"YH1-12-03-S02","type":"single_select","prompt":"Complete: Müdür bana erken gel___ söyledi. (The manager told me to come early.)","options":[{"id":"A","text":"diğimi"},{"id":"B","text":"memi"},{"id":"C","text":"eceğim"},{"id":"D","text":"iyorum"}],"correct_option_id":"B","explanation":"Gelmemi is the first-person nominalized instruction complement."},{"id":"YH1-V68-Q023","section":"12.3","skill_id":"YH1-12-03-S03","type":"single_select","prompt":"Choose “The coach told us to run.”","options":[{"id":"A","text":"Antrenör bize koşmamı söyledi."},{"id":"B","text":"Antrenör bize koşmasını söyledi."},{"id":"C","text":"Antrenör bize koşmamızı söyledi."},{"id":"D","text":"Antrenör bize koşmanı söyledi."}],"correct_option_id":"C","explanation":"Koşmamızı marks us as the people instructed to run."},{"id":"YH1-V68-Q024","section":"12.3","skill_id":"YH1-12-03-S03","type":"single_select","prompt":"Complete: Öğretmen bize sessiz ol___ söyledi. (The teacher told us to be quiet.)","options":[{"id":"A","text":"mamızı"},{"id":"B","text":"manı"},{"id":"C","text":"masını"},{"id":"D","text":"mak"}],"correct_option_id":"A","explanation":"Olmamızı is the first-person plural possessive verbal noun with accusative marking."},{"id":"YH1-V70-Q001","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S02","type":"single_select","prompt":"Choose the correct accusative form of saat (clock/hour).","options":[{"id":"A","text":"saadı"},{"id":"B","text":"saati"},{"id":"C","text":"saatti"},{"id":"D","text":"saate"}],"correct_option_id":"B","explanation":"Saat takes the accusative -i without changing its final t: saat → saati."},{"id":"YH1-V70-Q002","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S02","type":"single_select","prompt":"Which pair correctly shows a noun retaining its final consonant before the accusative suffix?","options":[{"id":"A","text":"kitap → kitapı"},{"id":"B","text":"ağaç → ağaçı"},{"id":"C","text":"saat → saat
