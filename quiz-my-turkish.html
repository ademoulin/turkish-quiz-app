ompt":"Complete: Çocukken her gün parkta ___ (oynamak, ben, past continuous).","options":[{"id":"A","text":"oynuyordum"},{"id":"B","text":"oynadım"},{"id":"C","text":"oynuyorum"},{"id":"D","text":"oynayacağım"}],"correct_option_id":"A","explanation":"Past progressive is -(I)yor + -DI + person: oynuyordum."},{"id":"YH1-V6-Q006","section":"4.3","skill_id":"YH1-04-04-S01","type":"single_select","prompt":"Complete: Ben küçük___ İstanbul’da yaşıyordum. (When I was little.)","options":[{"id":"A","text":"ken"},{"id":"B","text":"dan"},{"id":"C","text":"de"},{"id":"D","text":"ki"}],"correct_option_id":"A","explanation":"The temporal suffix -(y)ken means “while/when”: küçükken."},{"id":"YH1-V6-Q007","section":"4.3","skill_id":"YH1-04-05-S03","type":"single_select","prompt":"Choose the correct attached form meaning “by bus”.","options":[{"id":"A","text":"otobüsle"},{"id":"B","text":"otobüsla"},{"id":"C","text":"otobüsile"},{"id":"D","text":"otobüsden"}],"correct_option_id":"A","explanation":"The instrumental/comitative ile can attach as -(y)lA: otobüsle."},{"id":"YH1-V6-Q008","section":"5.1","skill_id":"YH1-05-01-S04","type":"single_select","prompt":"You are politely addressing a group. Complete: Lütfen içeri ___ (girmek).","options":[{"id":"A","text":"girin"},{"id":"B","text":"gir"},{"id":"C","text":"girsin"},{"id":"D","text":"girelim"}],"correct_option_id":"A","explanation":"Polite/plural second-person command of girmek is girin."},{"id":"YH1-V6-Q009","section":"5.1","skill_id":"YH1-05-01-S03","type":"single_select","prompt":"Choose the negative polite command: “Please do not smoke.”","options":[{"id":"A","text":"Lütfen sigara içmeyin."},{"id":"B","text":"Lütfen sigara içmedin."},{"id":"C","text":"Lütfen sigara içmiyorsun."},{"id":"D","text":"Lütfen sigara içmez."}],"correct_option_id":"A","explanation":"İçmeyin is the polite/plural negative command: iç- (drink/smoke) + -me- (negation) + -yin (polite imperative). The other options are indicative statements, not requests."},{"id":"YH1-V6-Q010","section":"5.2","skill_id":"YH1-05-02-S02","type":"single_select","prompt":"Complete: Şeker___ çay istiyorum. (without sugar)","options":[{"id":"A","text":"siz"},{"id":"B","text":"li"},{"id":"C","text":"de"},{"id":"D","text":"den"}],"correct_option_id":"A","explanation":"The suffix -sIz means “without” and follows four-way vowel harmony: şeker + -siz → şekersiz (“sugar-free”). By contrast, şekerli means “with sugar.”"},{"id":"YH1-V6-Q011","section":"5.2","skill_id":"YH1-05-03-S01","type":"single_select","prompt":"Complete: Haydi birlikte ___ (gitmek, biz, suggestion).","options":[{"id":"A","text":"gidelim"},{"id":"B","text":"gideriz"},{"id":"C","text":"gittik"},{"id":"D","text":"gidiyoruz"}],"correct_option_id":"A","explanation":"First-person plural suggestion uses -(y)AlIm: gid-e-lim."},{"id":"YH1-V6-Q012","section":"5.3","skill_id":"YH1-05-04-S02","type":"single_select","prompt":"Complete: Ankara, İstanbul’___ daha küçük.","options":[{"id":"A","text":"dan"},{"id":"B","text":"da"},{"id":"C","text":"a"},{"id":"D","text":"ı"}],"correct_option_id":"A","explanation":"Comparisons use the ablative case -DAn before daha: İstanbul’dan daha küçük."},{"id":"YH1-V6-Q013","section":"5.3","skill_id":"YH1-05-05-S01","type":"single_select","prompt":"Choose the superlative: “Ali is the tallest student in this class.” Bu sınıftaki ___ uzun öğrenci Ali.","options":[{"id":"A","text":"en"},{"id":"B","text":"daha"},{"id":"C","text":"kadar"},{"id":"D","text":"gibi"}],"correct_option_id":"A","explanation":"The superlative marker en precedes the adjective: en uzun."},{"id":"YH1-V6-Q014","section":"6.1","skill_id":"YH1-06-01-S03","type":"single_select","prompt":"Complete: Bu araba___ satın aldım. (I bought this car.)","options":[{"id":"A","text":"yı"},{"id":"B","text":"ya"},{"id":"C","text":"da"},{"id":"D","text":"dan"}],"correct_option_id":"A","explanation":"A definite direct object with demonstrative bu takes accusative -(y)I: bu arabayı."},{"id":"YH1-V6-Q015","section":"6.1","skill_id":"YH1-06-01-S01","type":"single_select","prompt":"Choose the sentence with the correct definite-object form of kitap (book): “I finished the book yesterday.”","options":[{"id":"A","text":"Kitabı dün bitirdim."},{"id":"B","text":"Kitabı dün bitireceğim."},{"id":"C","text":"Kitap dün bitirdim."},{"id":"D","text":"Kitabı dün bitiriyorum."}],"correct_option_id":"A","explanation":"Kitabı is the definite accusative of kitap (p → b before -ı); bitirdim is first-person singular definite past. The other choices either omit accusative marking or change the tense."},{"id":"YH1-V6-Q016","section":"6.2","skill_id":"YH1-06-02-S01","type":"single_select","prompt":"You are telling a friend you bought a book, but neither of you has a particular book in mind. Which sentence expresses this indefinite, nonspecific object?","options":[{"id":"A","text":"Bir kitap aldım."},{"id":"B","text":"Bir kitabı aldım."},{"id":"C","text":"Kitabı aldım."},{"id":"D","text":"Bu kitabı aldım."}],"correct_option_id":"A","explanation":"An indefinite direct object can appear without accusative: bir kitap aldım."},{"id":"YH1-V6-Q017","section":"6.3","skill_id":"YH1-06-03-S01","type":"single_select","prompt":"Complete the modifier meaning “on the table”: Masa___ kitap benim. (“The book on the table is mine.”)","options":[{"id":"A","text":"daki"},{"id":"B","text":"dakiymış"},{"id":"C","text":"dan"},{"id":"D","text":"ya"}],"correct_option_id":"A","explanation":"The modifier masadaki (“on the table”) is formed with locative -da and attributive -ki: masa-da-ki. The other endings do not form the required attributive modifier."},{"id":"YH1-V6-Q018","section":"6.3","skill_id":"YH1-06-04-S02","type":"single_select","prompt":"Choose the correct spelling for “I am coming too.”","options":[{"id":"A","text":"Ben de geliyorum."},{"id":"B","text":"Bende geliyorum."},{"id":"C","text":"Ben te geliyorum."},{"id":"D","text":"Ben den geliyorum."}],"correct_option_id":"A","explanation":"The additive particle de (“too”) is written separately: Ben de geliyorum."},{"id":"YH1-V7-Q001","section":"7.1","skill_id":"YH1-07-01-S01","type":"single_select","prompt":"Yarın Ankara’ya ___ (gitmek, ben, future).","options":[{"id":"A","text":"gideceğim"},{"id":"B","text":"gidiyorum"},{"id":"C","text":"gittim"},{"id":"D","text":"gidermişim"}],"correct_option_id":"A","explanation":"Future -(y)AcAk takes first-person singular and stem alternation: gideceğim."},{"id":"YH1-V7-Q002","section":"7.2","skill_id":"YH1-07-02-S01","type":"single_select","prompt":"Dün seni aramayı planlıyordum, ama zamanım olmadı. Niyetimi geçmişte gelecek zamanla ifade et: Seni ___ . (aramak, ben)","options":[{"id":"A","text":"arıyorum"},{"id":"B","text":"arayacaktım"},{"id":"C","text":"aradım"},{"id":"D","text":"aramışım"}],"correct_option_id":"B","explanation":"Future-in-the-past -AcAktI expresses an unrealized intention: arayacaktım."},{"id":"YH1-V7-Q003","section":"7.3","skill_id":"YH1-07-04-S02","type":"single_select","prompt":"___ göre bu film çok güzel. (according to me)","options":[{"id":"A","text":"Bana"},{"id":"B","text":"Beni"},{"id":"C","text":"Bende"},{"id":"D","text":"Benden"}],"correct_option_id":"A","explanation":"Göre (“according to”) requires a dative-marked pronoun. Ben changes to bana in the dative, so bana göre means “according to me / in my opinion”; beni is accusative."},{"id":"YH1-V7-Q004","section":"8.1","skill_id":"YH1-08-01-S01","type":"single_select","prompt":"Sabah uyandın ve sokakların ıslak olduğunu gördün. Şaşırarak söyle: “Aa, yağmur ___!” (You infer it rained.)","options":[{"id":"A","text":"yağacak"},{"id":"B","text":"yağıyor"},{"id":"C","text":"yağmış"},{"id":"D","text":"yağardı"}],"correct_option_id":"C","explanation":"The inferred/reported past -mIş gives yağmış (“apparently it rained”). Seeing wet streets is evidence for an inference; yağıyor instead says it is raining now."},{"id":"YH1-V7-Q005","section":"8.2","skill_id":"YH1-08-04-S01","type":"single_select","prompt":"Duyduğuma göre yarın ___ (gelmek, o, reported future).","options":[{"id":"A","text":"gelecekmiş"},{"id":"B","text":"geldi"},{"id":"C","text":"geliyor"},{"id":"D","text":"gelirdi"}],"correct_option_id":"A","explanation":"Gelecekmiş combines the future gelecek (“will come”) with reported-information -miş (“apparently / reportedly”). Geldi is simple past and does not convey reported future."},{"id":"YH1-V7-Q006","section":"8.3","skill_id":"YH1-08-05-S02","type":"single_select","prompt":"Ali is not answering his phone, so you guess he is at home. Complete with the present-time third-person predicate ending -DIr: Ali şu anda evde___.","options":[{"id":"A","text":"ydi"},{"id":"B","text":"dir"},{"id":"C","text":"yse"},{"id":"D","text":"yim"}],"correct_option_id":"B","explanation":"Evde-dir contains the third-person predicate ending -DIr. In this context it can convey a supposition (“Ali is probably at home”), though -DIr can also be used for more formal assertions."},{"id":"YH1-V7-Q007","section":"9.1","skill_id":"YH1-09-01-S02","type":"single_select","prompt":"Her sabah kahve ___ (içmek, ben, habitual aorist).","options":[{"id":"A","text":"içtim"},{"id":"B","text":"içeceğim"},{"id":"C","text":"içerim"},{"id":"D","text":"içmişim"}],"correct_option_id":"C","explanation":"İçerim is the first-person singular aorist: iç- + -er + -im. With her sabah (“every morning”), it expresses a repeated habit rather than one completed or planned event."},{"id":"YH1-V7-Q008","section":"9.2","skill_id":"YH1-09-02-S01","type":"single_select","prompt":"Which form means “I can speak Turkish” (ability, not merely the fact that I speak it)? Türkçe ___ .","options":[{"id":"A","text":"konuştum"},{"id":"B","text":"konuşuyorum"},{"id":"C","text":"konuşabilirim"},{"id":"D","text":"konuşacağım"}],"correct_option_id":"C","explanation":"Ability -(y)Abil- combines with aorist and person: konuşabilirim."},{"id":"YH1-V7-Q009","section":"9.3","skill_id":"YH1-09-03-S01","type":"single_select","prompt":"Eskiden burada ___ (yaşamak, biz, habitual past).","options":[{"id":"A","text":"yaşardık"},{"id":"B","text":"yaşarız"},{"id":"C","text":"yaşamışız"},{"id":"D","text":"yaşayacağız"}],"correct_option_id":"A","explanation":"Yaşardık combines the aorist stem yaşar- with past -dı- and first-person plural -k. Eskiden (“in the past”) supports the meaning “we used to live.”"},{"id":"YH1-V7-Q010","section":"10.1","skill_id":"YH1-10-01-S01","type":"single_select","prompt":"Complete with the conjunction that explicitly gives the reason: Evde kaldım, ___ hastaydım. (I stayed home because I was sick.)","options":[{"id":"A","text":"çünkü"},{"id":"B","text":"ama"},{"id":"C","text":"ve"},{"id":"D","text":"gibi"}],"correct_option_id":"A","explanation":"Çünkü introduces a reason: I stayed home because I was sick."},{"id":"YH1-V7-Q011","section":"10.2","skill_id":"YH1-10-03-S01","type":"single_select","prompt":"Türkçe öğren___ için her gün çalışıyorum.","options":[{"id":"A","text":"dim"},{"id":"B","text":"mek"},{"id":"C","text":"iyor"},{"id":"D","text":"ecek"}],"correct_option_id":"B","explanation":"The infinitive -mAk is used before için: öğrenmek için."},{"id":"YH1-V7-Q012","section":"10.3","skill_id":"YH1-10-05-S01","type":"single_select","prompt":"Kahvaltı yap___ sonra işe gidiyorum.","options":[{"id":"A","text":"madan"},{"id":"B","text":"tıktan"},{"id":"C","text":"arken"},{"id":"D","text":"mak"}],"correct_option_id":"B","explanation":"The sequence -DIktAn sonra means “after doing.” Yap- + -tık- + -tan → yaptıktan, so kahvaltı yaptıktan sonra means “after having breakfast,” not “before.”"},{"id":"YH1-V7-Q013","section":"11.1","skill_id":"YH1-11-01-S01","type":"single_select","prompt":"Eve gid___ uyudum. (and then I slept)","options":[{"id":"A","text":"ip"},{"id":"B","text":"erek"},{"id":"C","text":"meden"},{"id":"D","text":"e"}],"correct_option_id":"A","explanation":"The converb -(y)Ip links successive actions: gidip uyudum."},{"id":"YH1-V7-Q014","section":"11.2","skill_id":"YH1-11-03-S01","type":"single_select","prompt":"Complete using the manner converb -(y)ArAk: Otobüse bin___ şehir merkezine gittim. (I traveled to the city center by taking the bus.)","options":[{"id":"A","text":"erek"},{"id":"B","text":"meden"},{"id":"C","text":"miş"},{"id":"D","text":"ecek"}],"correct_option_id":"A","explanation":"Binerek is bin- (“board”) + -erek, a converb indicating manner or a means of travel: “by taking the bus.” Binmeden means “without boarding,” a different relationship."},{"id":"YH1-V7-Q015","section":"12.1","skill_id":"YH1-12-01-S01","type":"single_select","prompt":"Yüz___ sağlıklıdır. (Swimming is healthy.)","options":[{"id":"A","text":"me"},{"id":"B","text":"üyor"},{"id":"C","text":"dü"},{"id":"D","text":"ecek"}],"correct_option_id":"A","explanation":"Yüzme turns the verb yüz- (“swim”) into an activity noun. Thus yüzme sağlıklıdır means “swimming is healthy”; the other endings make finite or future forms."},{"id":"YH1-V7-Q016","section":"12.3","skill_id":"YH1-12-03-S01","type":"single_select","prompt":"Complete the reported instruction: Öğretmen öğrencilere sessiz ol___ söyledi. (The teacher told the students to be quiet.)","options":[{"id":"A","text":"malarını"},{"id":"B","text":"acaklarını"},{"id":"C","text":"duklarını"},{"id":"D","text":"muşlarını"}],"correct_option_id":"A","explanation":"Reported commands can use -mA with a possessive ending and accusative: olmalarını."},{"id":"YH1-V10-Q001","section":"0","skill_id":"YH1-00-01-S02","type":"single_select","prompt":"Which word contains only back vowels?","options":[{"id":"A","text":"kapı"},{"id":"B","text":"şehir"},{"id":"C","text":"güneş"},{"id":"D","text":"kedi"}],"correct_option_id":"A","explanation":"Kapı contains a and ı, both back vowels. Şehir and kedi contain front vowels e/i; güneş contains front vowels ü/e."},{"id":"YH1-V10-Q002","section":"0","skill_id":"YH1-00-03-S02","type":"single_select","prompt":"Choose the plural of “ev”.","options":[{"id":"A","text":"evlar"},{"id":"B","text":"evleri"},{"id":"C","text":"evlir"},{"id":"D","text":"evler"}],"correct_option_id":"D","explanation":"The plural suffix follows two-way vowel harmony: evler."},{"id":"YH1-V10-Q003","section":"1.2","skill_id":"YH1-01-01-S02","type":"single_select","prompt":"Complete: Ben doktor ___ . (I am not a doctor.)","options":[{"id":"A","text":"değil"},{"id":"B","text":"değiliz"},{"id":"C","text":"değilim"},{"id":"D","text":"değilsin"}],"correct_option_id":"C","explanation":"First-person singular negation of a nominal predicate is değilim."},{"id":"YH1-V10-Q004","section":"1.2","skill_id":"YH1-01-01-S03","type":"single_select","prompt":"Complete: Sen öğrenci ___? (Are you a student?)","options":[{"id":"A","text":"mısın"},{"id":"B","text":"musun"},{"id":"C","text":"misin"},{"id":"D","text":"müsün"}],"correct_option_id":"C","explanation":"The question particle agrees with the last vowel in öğrenci: misin."},{"id":"YH1-V10-Q005","section":"1.2","skill_id":"YH1-01-02-S01","type":"single_select","prompt":"Complete: Biz Türk___ . (We are Turkish.)","options":[{"id":"A","text":"üm"},{"id":"B","text":"üz"},{"id":"C","text":"sün"},{"id":"D","text":"ler"}],"correct_option_id":"B","explanation":"The first-person plural nominal predicate ending is -üz after Türk."},{"id":"YH1-V10-Q006","section":"1.3","skill_id":"YH1-01-03-S01","type":"single_select","prompt":"Complete with the neutral present-time existential form: Masada bir kitap ___. (There is a book on the table now.)","options":[{"id":"A","text":"var"},{"id":"B","text":"varmış"},{"id":"C","text":"vardı"},{"id":"D","text":"yok"}],"correct_option_id":"A","explanation":"Var states that something exists in the present. Vardı refers to past existence, varmış adds reported or inferred information, and yok means there is none."},{"id":"YH1-V10-Q007","section":"1.3","skill_id":"YH1-01-04-S01","type":"single_select","prompt":"Choose the ordinal meaning “third”.","options":[{"id":"A","text":"üçte"},{"id":"B","text":"üçler"},{"id":"C","text":"üçün"},{"id":"D","text":"üçüncü"}],"correct_option_id":"D","explanation":"Üçüncü is the ordinal “third”: üç (three) + the ordinal suffix -üncü. Üçte is a locative form, not an ordinal number."},{"id":"YH1-V10-Q008","section":"2.1","skill_id":"YH1-02-01-S01","type":"single_select","prompt":"Complete: Şu anda Türkçe ___ . (I am studying Turkish.)","options":[{"id":"A","text":"çalışıyorum"},{"id":"B","text":"çalışırım"},{"id":"C","text":"çalışacağım"},{"id":"D","text":"çalıştım"}],"correct_option_id":"A","explanation":"Çalışıyorum combines çalış- with the present continuous -ıyor and first-person -um. Şu anda (“right now”) calls for an action in progress, not habitual, future, or past."},{"id":"YH1-V10-Q009","section":"2.1","skill_id":"YH1-02-01-S02","type":"single_select","prompt":"Complete using the negative present continuous (-mIyor): Şu anda işe ___ . (I am not going to work right now.)","options":[{"id":"A","text":"gidiyorum"},{"id":"B","text":"gitmeyeceğim"},{"id":"C","text":"gitmiyorum"},{"id":"D","text":"gitmedim"}],"correct_option_id":"C","explanation":"Gitmiyorum is git- + negative -mi- + present continuous -yor + first-person -um. It describes not going now; gitmeyeceğim instead describes a future non-action."},{"id":"YH1-V10-Q010","section":"2.2","skill_id":"YH1-02-02-S01","type":"single_select","prompt":"Complete the destination suffix (including any buffer consonant): Yarın Ankara’___ gidiyorum.","options":[{"id":"A","text":"yı"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"ya"}],"correct_option_id":"D","explanation":"Ankara ends in a vowel, so the dative ending -a needs buffer -y-: Ankara + -ya → Ankara’ya (“to Ankara”). -da marks location and -dan marks departure."},{"id":"YH1-V10-Q011","section":"2.2","skill_id":"YH1-02-03-S03","type":"single_select","prompt":"Complete: Kitap raf___ duruyor. (The book is on the shelf.)","options":[{"id":"A","text":"ta"},{"id":"B","text":"tan"},{"id":"C","text":"da"},{"id":"D","text":"ya"}],"correct_option_id":"A","explanation":"Raf ends in voiceless f, so the locative suffix is -ta rather than -da: raf + -ta → rafta (“on the shelf”). -tan would mean “from the shelf.”"},{"id":"YH1-V10-Q012","section":"2.2","skill_id":"YH1-02-04-S01","type":"single_select","prompt":"Complete: Okul___ geliyorum. (I am coming from school.)","options":[{"id":"A","text":"a"},{"id":"B","text":"u"},{"id":"C","text":"da"},{"id":"D","text":"dan"}],"correct_option_id":"D","explanation":"The ablative -DAn expresses motion or origin “from”: okul + -dan → okuldan (“from school”). -da instead means “at school,” and -a means “to school.”"},{"id":"YH1-V10-Q013","section":"2.3","skill_id":"YH1-02-05-S02","type":"single_select","prompt":"Complete: Ders___ önce kahve içiyorum. (I drink coffee before class.)","options":[{"id":"A","text":"te"},{"id":"B","text":"e"},{"id":"C","text":"den"},{"id":"D","text":"ten"}],"correct_option_id":"D","explanation":"Dersten önce means “before class.” The noun ders takes ablative -ten after the voiceless s; önce follows that ablative form."},{"id":"YH1-V10-Q014","section":"2.3","skill_id":"YH1-02-TIME-S01","type":"single_select","prompt":"Choose the sentence meaning “It is quarter past three.”","options":[{"id":"A","text":"Saat üç buçuk."},{"id":"B","text":"Saat üçe çeyrek var."},{"id":"C","text":"Saat üçü çeyrek geçiyor."},{"id":"D","text":"Saat dörde çeyrek var."}],"correct_option_id":"C","explanation":"Saat üçü çeyrek geçiyor means “it is a quarter past three” (3:15). Çeyrek var expresses time remaining until an hour, while buçuk means half past."},{"id":"YH1-V10-Q015","section":"2.3","skill_id":"YH1-02-TIME-S02","type":"single_select","prompt":"Complete: Ders saat üçü çeyrek ___ başlıyor. (Class starts at 3:15.)","options":[{"id":"A","text":"var"},{"id":"B","text":"kala"},{"id":"C","text":"geçe"},{"id":"D","text":"geçiyor"}],"correct_option_id":"C","explanation":"When giving the time of a scheduled event, Turkish uses the converb geçe: saat üçü çeyrek geçe = “at 3:15.” Geçiyor states the current clock time instead."},{"id":"YH1-V10-Q016","section":"3.1","skill_id":"YH1-03-01-S01","type":"single_select","prompt":"Complete: Bu benim araba___ . (This is my car.)","options":[{"id":"A","text":"sı"},{"id":"B","text":"nız"},{"id":"C","text":"m"},{"id":"D","text":"n"}],"correct_option_id":"C","explanation":"Araba ends in a vowel, so first-person singular possession adds -m directly: araba + -m → arabam (“my car”). -sı marks third-person possession."},{"id":"YH1-V10-Q017","section":"3.1","skill_id":"YH1-03-01-S03","type":"single_select","prompt":"Complete: Bu onun araba___ . (This is his/her car.)","options":[{"id":"A","text":"nız"},{"id":"B","text":"m"},{"id":"C","text":"sı"},{"id":"D","text":"ı"}],"correct_option_id":"C","explanation":"Vowel-final araba takes buffer -s- before third-person possessive -ı."},{"id":"YH1-V10-Q018","section":"3.2","skill_id":"YH1-03-02-S01","type":"single_select","prompt":"Supply the full genitive suffix after the apostrophe: Ali’___ kitabı burada. (Ali’s book is here.)","options":[{"id":"A","text":"nın"},{"id":"B","text":"nin"},{"id":"C","text":"na"},{"id":"D","text":"nün"}],"correct_option_id":"B","explanation":"Ali ends in a vowel, so the genitive takes buffer -n- plus front-vowel -in: Ali’nin kitabı (Ali’s book). The apostrophe separates the proper name and its case ending."},{"id":"YH1-V10-Q019","section":"3.3","skill_id":"YH1-03-03-S01","type":"single_select","prompt":"Complete the noun compound: Türk kahve___ . (Turkish coffee.)","options":[{"id":"A","text":"de"},{"id":"B","text":"si"},{"id":"C","text":"den"},{"id":"D","text":"yi"}],"correct_option_id":"B","explanation":"An indefinite noun compound has the possessive ending on its head: Türk kahvesi."},{"id":"YH1-V10-Q020","section":"3.3","skill_id":"YH1-03-04-S01","type":"single_select","prompt":"Choose the bare adjective + noun phrase for “a beautiful house,” with no possessive suffix.","options":[{"id":"A","text":"ev güzel"},{"id":"B","text":"evin güzel"},{"id":"C","text":"güzel evi"},{"id":"D","text":"güzel ev"}],"correct_option_id":"D","explanation":"Attributive adjectives normally precede the noun: güzel ev."},{"id":"YH1-V11-Q001","section":"4.1","skill_id":"YH1-04-01-S03","type":"single_select","prompt":"Choose the correct question: “Did you go home yesterday?”","options":[{"id":"A","text":"Dün eve gidiyor musun?"},{"id":"B","text":"Dün eve gittim mi?"},{"id":"C","text":"Dün eve gidecek misin?"},{"id":"D","text":"Dün eve gittin mi?"}],"correct_option_id":"D","explanation":"The past marker -DI takes person agreement; the question particle is separate."},{"id":"YH1-V11-Q002","section":"4.1","skill_id":"YH1-04-01-S04","type":"single_select","prompt":"Complete: “She went.” (gitmek, definite past)","options":[{"id":"A","text":"gittiği"},{"id":"B","text":"gitmiş"},{"id":"C","text":"gitdi"},{"id":"D","text":"gitti"}],"correct_option_id":"D","explanation":"After the voiceless t in git-, the past suffix starts with t."},{"id":"YH1-V11-Q003","section":"4.2","skill_id":"YH1-04-02-S02","type":"single_select","prompt":"Complete: “I was not a student.”","options":[{"id":"A","text":"Öğrenci değildim."},{"id":"B","text":"Öğrenci olmayacağım."},{"id":"C","text":"Öğrenci değilmişim."},{"id":"D","text":"Öğrenci değilim."}],"correct_option_id":"A","explanation":"Değil takes the past nominal-predicate ending -di and first-person -m."},{"id":"YH1-V11-Q004","section":"4.3","skill_id":"YH1-04-03-S02","type":"single_select","prompt":"Complete: “I was not sleeping.”","options":[{"id":"A","text":"Uyumadım."},{"id":"B","text":"Uyumuyordum."},{"id":"C","text":"Uyumuyorum."},{"id":"D","text":"Uyumayacağım."}],"correct_option_id":"B","explanation":"The negative past continuous uses -mIyor + -du + personal ending."},{"id":"YH1-V11-Q005","section":"4.3","skill_id":"YH1-04-03-S03","type":"single_select","prompt":"Which means “Were you studying?”","options":[{"id":"A","text":"Ders çalışıyor musun?"},{"id":"B","text":"Ders çalıştın mı?"},{"id":"C","text":"Ders çalışacak mısın?"},{"id":"D","text":"Ders çalışıyor muydun?"}],"correct_option_id":"D","explanation":"Past continuous question: -yor + question particle + past/person."},{"id":"YH1-V11-Q006","section":"4.3","skill_id":"YH1-04-05-S01","type":"single_select","prompt":"Translate “I went with my friend.”","options":[{"id":"A","text":"Arkadaşımdan gittim."},{"id":"B","text":"Arkadaşımda gittim."},{"id":"C","text":"Arkadaşıma gittim."},{"id":"D","text":"Arkadaşımla gittim."}],"correct_option_id":"D","explanation":"The instrumental/comitative suffix -(y)lA expresses “with”."},{"id":"YH1-V11-Q007","section":"5.1","skill_id":"YH1-05-01-S01","type":"single_select","prompt":"Give an informal singular command: “Come!”","options":[{"id":"A","text":"Gelin!"},{"id":"B","text":"Geliyor!"},{"id":"C","text":"Gelsin!"},{"id":"D","text":"Gel!"}],"correct_option_id":"D","explanation":"The informal singular imperative is the bare verb stem."},{"id":"YH1-V11-Q008","section":"5.1","skill_id":"YH1-05-01-S02","type":"single_select","prompt":"Give a third-person singular command: “Let him/her come!”","options":[{"id":"A","text":"Gelse!"},{"id":"B","text":"Gelin!"},{"id":"C","text":"Gel!"},{"id":"D","text":"Gelsin!"}],"correct_option_id":"D","explanation":"The third-person imperative uses -sIn: gel- + -sin → gelsin (“let him/her come”). Gel is a singular second-person command; gelin addresses a plural or polite second person."},{"id":"YH1-V11-Q009","section":"5.2","skill_id":"YH1-05-02-S01","type":"single_select","prompt":"Choose the adjective meaning “with sugar / sugary.”","options":[{"id":"A","text":"şekerden"},{"id":"B","text":"şekerli"},{"id":"C","text":"şekersiz"},{"id":"D","text":"şekerde"}],"correct_option_id":"B","explanation":"The adjective suffix -lI means “with / containing”: şeker + -li → şekerli (“sugary”). Its opposite, -sIz, gives şekersiz (“without sugar”)."},{"id":"YH1-V11-Q010","section":"5.2","skill_id":"YH1-05-02-S04","type":"single_select","prompt":"Choose the adjective meaning “without salt.”","options":[{"id":"A","text":"tuzdan"},{"id":"B","text":"tuzlu"},{"id":"C","text":"tuzda"},{"id":"D","text":"tuzsuz"}],"correct_option_id":"D","explanation":"Tuzsuz means “without salt”: tuz (salt) + -suz, the back-vowel form of the privative suffix -sIz. Tuzlu means “salty,” the opposite."},{"id":"YH1-V11-Q011","section":"5.3","skill_id":"YH1-05-04-S01","type":"single_select","prompt":"Complete: “Izmir is warmer than Ankara.” İzmir, ___ daha sıcak.","options":[{"id":"A","text":"Ankara’yı"},{"id":"B","text":"Ankara’ya"},{"id":"C","text":"Ankara’da"},{"id":"D","text":"Ankara’dan"}],"correct_option_id":"D","explanation":"Comparatives with daha use the ablative -DAn on the comparison point."},{"id":"YH1-V11-Q012","section":"5.3","skill_id":"YH1-05-05-S02","type":"single_select","prompt":"Which means “the most beautiful city”?","options":[{"id":"A","text":"güzelden şehir"},{"id":"B","text":"en güzel şehir"},{"id":"C","text":"daha güzel şehir"},{"id":"D","text":"şehirden güzel"}],"correct_option_id":"B","explanation":"En before an adjective forms a superlative: en güzel şehir = “the most beautiful city.” Daha güzel means “more beautiful” and expresses comparison, not a superlative."},{"id":"YH1-V11-Q013","section":"6.1","skill_id":"YH1-06-01-S02","type":"single_select","prompt":"Complete: “I saw the dog.” ___ gördüm.","options":[{"id":"A","text":"köpekte"},{"id":"B","text":"köpeği"},{"id":"C","text":"köpeğe"},{"id":"D","text":"köpekten"}],"correct_option_id":"B","explanation":"The definite object takes accusative -(y)I; köpek softens to köpeğ-."},{"id":"YH1-V11-Q014","section":"6.3","skill_id":"YH1-06-04-S01","type":"single_select","prompt":"Translate “I also want tea.”","options":[{"id":"A","text":"Ben de çay istiyorum."},{"id":"B","text":"Bende çay istiyorum."},{"id":"C","text":"Beni çay istiyorum."},{"id":"D","text":"Benden çay istiyorum."}],"correct_option_id":"A","explanation":"The additive particle de (“also”) is written separately."},{"id":"YH1-V11-Q015","section":"6.3","skill_id":"YH1-06-04-S03","type":"single_select","prompt":"Which sentence means simply “I am at home,” without adding “also/too”?","options":[{"id":"A","text":"Ben de geliyorum."},{"id":"B","text":"Ben evdeyim."},{"id":"C","text":"Ben de istiyorum."},{"id":"D","text":"Ben de evdeyim."}],"correct_option_id":"B","explanation":"The locative -de is attached to the noun, unlike additive de."},{"id":"YH1-V11-Q016","section":"7.1","skill_id":"YH1-07-01-S02","type":"single_select","prompt":"Complete with the negative future suffix -(y)AcAk: Yarın ___ . (gitmek, ben; “I will not go tomorrow.”)","options":[{"id":"A","text":"gitmiyorum"},{"id":"B","text":"gitmedim"},{"id":"C","text":"gideceğim"},{"id":"D","text":"gitmeyeceğim"}],"correct_option_id":"D","explanation":"Future negation uses -mA + -(y)AcAk with appropriate sound changes."},{"id":"YH1-V11-Q017","section":"7.1","skill_id":"YH1-07-01-S03","type":"single_select","prompt":"Choose the question formed with the future-tense suffix -(y)AcAk: “Will you come tomorrow?”","options":[{"id":"A","text":"Yarın gelmiş misin?"},{"id":"B","text":"Yarın geliyor musun?"},{"id":"C","text":"Yarın geldin mi?"},{"id":"D","text":"Yarın gelecek misin?"}],"correct_option_id":"D","explanation":"Future questions use the separate question particle after the future form."},{"id":"YH1-V11-Q018","section":"7.3","skill_id":"YH1-07-03-S01","type":"single_select","prompt":"Choose the form meaning “in Turkish / Turkish-style” in “Türkçe konuşuyorum.”","options":[{"id":"A","text":"Türkçe"},{"id":"B","text":"Türkten"},{"id":"C","text":"Türkli"},{"id":"D","text":"Türkde"}],"correct_option_id":"A","explanation":"The equative -CA/-CE appears in language names such as Türkçe."},{"id":"YH1-V11-Q019","section":"7.3","skill_id":"YH1-07-04-S01","type":"single_select","prompt":"Complete: “According to me, this is good.” ___ göre bu iyi.","options":[{"id":"A","text":"Bende"},{"id":"B","text":"Benden"},{"id":"C","text":"Beni"},{"id":"D","text":"Bana"}],"correct_option_id":"D","explanation":"Göre (“according to”) requires a dative pronoun: ben → bana, so bana göre means “in my opinion.”"},{"id":"YH1-V11-Q020","section":"7.3","skill_id":"YH1-07-05-S01","type":"single_select","prompt":"Translate “like a child.”","options":[{"id":"A","text":"çocuğa"},{"id":"B","text":"çocuk için"},{"id":"C","text":"çocuktan"},{"id":"D","text":"çocuk gibi"}],"correct_option_id":"D","explanation":"Gibi follows a noun to express similarity: çocuk gibi = “like a child.” Çocuk için means “for a child,” while çocuğa marks the dative “to a child.”"},{"id":"YH1-V11-Q021","section":"8.1","skill_id":"YH1-08-01-S02","type":"single_select","prompt":"Choose “Apparently she did not come.”","options":[{"id":"A","text":"Gelmemiş."},{"id":"B","text":"Gelmiyor."},{"id":"C","text":"Gelmeyecek."},{"id":"D","text":"Gelmedi."}],"correct_option_id":"A","explanation":"Gelmemiş is gel- + -me- (negative) + -miş (reported/inferred past): “apparently did not come.” Gelmedi instead asserts the simple definite past."},{"id":"YH1-V11-Q022","section":"8.1","skill_id":"YH1-08-01-S03","type":"single_select","prompt":"Choose the question meaning “Did he apparently go?” (reported/inferred past).","options":[{"id":"A","text":"Gidecek mi?"},{"id":"B","text":"Gidiyor mu?"},{"id":"C","text":"Gitmiş mi?"},{"id":"D","text":"Gitti mi?"}],"correct_option_id":"C","explanation":"Gitmiş mi? combines the reported/inferred past gitmiş with the separate question particle mi. Gitti mi? asks about the definite past without that evidential nuance."},{"id":"YH1-V11-Q023","section":"8.1","skill_id":"YH1-08-02-S01","type":"single_select","prompt":"Choose “Apparently he is a teacher.”","options":[{"id":"A","text":"Öğretmenmiş."},{"id":"B","text":"Öğretmendi."},{"id":"C","text":"Öğretmen olacak."},{"id":"D","text":"Öğretmendir."}],"correct_option_id":"A","explanation":"Öğretmenmiş adds reported/inferred -miş directly to the noun predicate: “apparently (he/she) is a teacher.” Öğretmendi refers to being a teacher in the past."},{"id":"YH1-V11-Q024","section":"8.2","skill_id":"YH1-08-03-S01","type":"single_select","prompt":"Choose “Apparently she is sleeping.”","options":[{"id":"A","text":"Uyurdu."},{"id":"B","text":"Uyuyacakmış."},{"id":"C","text":"Uyudu."},{"id":"D","text":"Uyuyormuş."}],"correct_option_id":"D","explanation":"Uyuyormuş combines present continuous uyuyor with reported/inferred -muş: “apparently she is sleeping.” Uyuyacakmış refers instead to a reported future event."},{"id":"YH1-V11-Q025","section":"8.2","skill_id":"YH1-08-04-S02","type":"single_select","prompt":"Choose “Apparently he will not come.”","options":[{"id":"A","text":"Gelmemiş."},{"id":"B","text":"Gelmeyecek."},{"id":"C","text":"Gelmiyormuş."},{"id":"D","text":"Gelmeyecekmiş."}],"correct_option_id":"D","explanation":"Gelmeyecekmiş combines negative future gelmeyecek (“will not come”) with reported-information -miş: “apparently he will not come.” Gelmemiş is a reported past."},{"id":"YH1-V11-Q026","section":"9.1","skill_id":"YH1-09-01-S03","type":"single_select","prompt":"Use the negative aorist (geniş zamanın olumsuzu): “I do not drink coffee.” Kahve ___ .","options":[{"id":"A","text":"içmem"},{"id":"B","text":"içmiyorum"},{"id":"C","text":"içmeyeceğim"},{"id":"D","text":"içmedim"}],"correct_option_id":"A","explanation":"İçmem is the first-person singular negative aorist, expressing a general habit: “I do not drink.” İçmiyorum is negative present continuous and can describe the current situation."},{"id":"YH1-V11-Q027","section":"9.1","skill_id":"YH1-09-01-S04","type":"single_select","prompt":"Choose the question in the aorist (geniş zaman) meaning “Do you read books generally?”","options":[{"id":"A","text":"Kitap okuyacak mısın?"},{"id":"B","text":"Kitap okuyor musun?"},{"id":"C","text":"Kitap okudun mu?"},{"id":"D","text":"Kitap okur musun?"}],"correct_option_id":"D","explanation":"Okur musun? uses the aorist okur plus separate question particle mu and second-person ending -sun. It asks about reading generally, unlike okuyor musun? (“are you reading?”)."},{"id":"YH1-V11-Q028","section":"9.2","skill_id":"YH1-09-02-S02","type":"single_select","prompt":"Choose the sentence using the negative ability suffix -(y)AmA- to say “I cannot swim.”","options":[{"id":"A","text":"Yüzebilirim."},{"id":"B","text":"Yüzemem."},{"id":"C","text":"Yüzmüyorum."},{"id":"D","text":"Yüzmeyeceğim."}],"correct_option_id":"B","explanation":"Yüzemem expresses inability using the negative ability construction: yüz- + -e-me- + -m. Yüzmüyorum means “I am not swimming,” which does not necessarily mean inability."},{"id":"YH1-V11-Q029","section":"9.3","skill_id":"YH1-09-03-S02","type":"single_select","prompt":"Choose “I used to live here.”","options":[{"id":"A","text":"Şimdi burada yaşıyorum."},{"id":"B","text":"Eskiden burada yaşardım."},{"id":"C","text":"Dün burada yaşadım."},{"id":"D","text":"Yarın burada yaşayacağım."}],"correct_option_id":"B","explanation":"Eskiden (“formerly”) with yaşardım, the past aorist of yaşamak, conveys “I used to live here.” Yaşıyorum is present and yaşayacağım is future."},{"id":"YH1-V11-Q030","section":"10.1","skill_id":"YH1-10-01-S02","type":"single_select","prompt":"Choose the connector meaning “therefore / for this reason.”","options":[{"id":"A","text":"çünkü"},{"id":"B","text":"ama"},{"id":"C","text":"bu yüzden"},{"id":"D","text":"ve"}],"correct_option_id":"C","explanation":"Bu yüzden introduces a result; çünkü introduces a reason."},{"id":"YH1-V11-Q031","section":"10.2","skill_id":"YH1-10-04-S01","type":"single_select","prompt":"Complete with -mAk üzere to express purpose: Seni görmek ___ geldim.","options":[{"id":"A","text":"üzere"},{"id":"B","text":"önce"},{"id":"C","text":"kadar"},{"id":"D","text":"sonra"}],"correct_option_id":"A","explanation":"The pattern verb + -mAk üzere can express purpose: seni görmek üzere geldim = “I came in order to see you.” Önce and sonra mark temporal relationships instead."},{"id":"YH1-V11-Q032","section":"10.3","skill_id":"YH1-10-05-S02","type":"single_select","prompt":"Choose “after eating” as a verb-based temporal phrase.","options":[{"id":"A","text":"yemek yerken"},{"id":"B","text":"yemek yedikten sonra"},{"id":"C","text":"yemek yemek için"},{"id":"D","text":"yemek yemeden önce"}],"correct_option_id":"B","explanation":"The pattern verb + -DIktAn sonra means “after doing”: yedikten sonra = “after eating.” The suffixes attach to the verb stem."},{"id":"YH1-V11-Q033","section":"10.3","skill_id":"YH1-10-06-S01","type":"single_select","prompt":"Choose “before going home.”","options":[{"id":"A","text":"eve gitmek üzere"},{"id":"B","text":"eve giderek"},{"id":"C","text":"eve gittikten sonra"},{"id":"D","text":"eve gitmeden önce"}],"correct_option_id":"D","explanation":"Before an action, Turkish uses the negative converb -mAdAn followed by önce: eve gitmeden önce = “before going home.”"},{"id":"YH1-V11-Q034","section":"11.1","skill_id":"YH1-11-01-S02","type":"single_select","prompt":"Choose “He entered and sat down” using -(y)Ip.","options":[{"id":"A","text":"İçeri girip oturdu."},{"id":"B","text":"İçeri girerken oturdu."},{"id":"C","text":"İçeri girmek için oturdu."},{"id":"D","text":"İçeri girmeden oturdu."}],"correct_option_id":"A","explanation":"Girip joins gir- (“enter”) to oturdu (“sat down”) with the converb -(y)Ip, linking successive actions by the same subject. Girerken means “while entering.”"},{"id":"YH1-V11-Q035","section":"11.1","skill_id":"YH1-11-02-S01","type":"single_select","prompt":"Choose “He left without saying anything.”","options":[{"id":"A","text":"Hiçbir şey söyleyip gitti."},{"id":"B","text":"Hiçbir şey söylemek için gitti."},{"id":"C","text":"Hiçbir şey söyledikten sonra gitti."},{"id":"D","text":"Hiçbir şey söylemeden gitti."}],"correct_option_id":"D","explanation":"The converb -mAdAn means “without doing”: hiçbir şey söylemeden means “without saying anything.” It marks an action not performed."},{"id":"YH1-V11-Q036","section":"11.2","skill_id":"YH1-11-03-S02","type":"single_select","prompt":"Choose “She entered laughing,” using the -(y)ArAk converb.","options":[{"id":"A","text":"Güldükten sonra içeri girdi."},{"id":"B","text":"Gülmek için içeri girdi."},{"id":"C","text":"Gülmeden içeri girdi."},{"id":"D","text":"Gülerek içeri girdi."}],"correct_option_id":"D","explanation":"Gülerek uses the converb -(y)ArAk to describe how she entered: “laughing / with a laugh.” Gülmeden means “without laughing”; güldükten sonra means “after laughing.”"},{"id":"YH1-V11-Q037","section":"11.2","skill_id":"YH1-11-04-S01","type":"single_select","prompt":"Complete: “He works as a teacher.” Öğretmen ___ çalışıyor.","options":[{"id":"A","text":"sonra"},{"id":"B","text":"olarak"},{"id":"C","text":"gibi"},{"id":"D","text":"kadar"}],"correct_option_id":"B","explanation":"Olarak means “as / in the capacity of,” so öğretmen olarak çalışıyor means “works as a teacher.” Gibi means “like” and does not specify the actual job role."},{"id":"YH1-V11-Q038","section":"12.1","skill_id":"YH1-12-01-S02","type":"single_select","prompt":"Choose the verbal noun meaning “swimming” in “Swimming is good.”","options":[{"id":"A","text":"Yüzmek"},{"id":"B","text":"Yüzüyorum"},{"id":"C","text":"Yüzecek"},{"id":"D","text":"Yüzdüm"}],"correct_option_id":"A","explanation":"Yüzmek is the infinitive formed with -mAk and can function as the subject of a sentence: “Swimming is good.” Yüzüyorum is a finite verb meaning “I am swimming.”"},{"id":"YH1-V11-Q039","section":"12.2","skill_id":"YH1-12-02-S02","type":"single_select","prompt":"Choose the sentence with the dative-marked verbal noun meaning “I am glad you came.”","options":[{"id":"A","text":"Gelmenle sevindim."},{"id":"B","text":"Gelmenden sevindim."},{"id":"C","text":"Gelmene sevindim."},{"id":"D","text":"Gelmeni sevindim."}],"correct_option_id":"C","explanation":"Sevinmek (“be glad”) selects a dative complement: gel-me-n-e → gelmene (“at your coming”). Gelmeni is accusative and fits other verbs, such as istemek, not this construction."},{"id":"YH1-V12-Q001","section":"0","skill_id":"YH1-00-01-S01","type":"single_select","prompt":"Which letter is part of the Turkish alphabet?","options":[{"id":"A","text":"q"},{"id":"B","text":"ğ"},{"id":"C","text":"x"},{"id":"D","text":"w"}],"correct_option_id":"B","explanation":"Turkish has ğ but not q, w, or x in its standard alphabet."},{"id":"YH1-V12-Q002","section":"0","skill_id":"YH1-00-01-S03","type":"single_select","prompt":"Which word contains the Turkish dotless vowel ı?","options":[{"id":"A","text":"gül"},{"id":"B","text":"kitap"},{"id":"C","text":"kız"},{"id":"D","text":"ev"}],"correct_option_id":"C","explanation":"Kız contains the dotless vowel ı. Turkish distinguishes ı from dotted i as separate vowels; kitap has dotted i, while gül has ü and ev has e."},{"id":"YH1-V12-Q003","section":"0","skill_id":"YH1-00-02-S01","type":"single_select","prompt":"How do you write 47 in Turkish?","options":[{"id":"A","text":"kırk yedi yüz"},{"id":"B","text":"kırk yedi"},{"id":"C","text":"yetmiş dört"},{"id":"D","text":"dört yedi"}],"correct_option_id":"B","explanation":"Forty is kırk and seven is yedi. Turkish writes 47 as kırk yedi, with the tens before the units."},{"id":"YH1-V12-Q004","section":"0","skill_id":"YH1-00-02-S03","type":"single_select","prompt":"How do you write 125 in Turkish?","options":[{"id":"A","text":"yirmi beş yüz"},{"id":"B","text":"yüz iki beş"},{"id":"C","text":"bir yüz yirmi beşler"},{"id":"D","text":"yüz yirmi beş"}],"correct_option_id":"D","explanation":"Turkish forms 125 as yüz (one hundred) + yirmi (twenty) + beş (five): yüz yirmi beş. The units follow the tens."},{"id":"YH1-V12-Q005","section":"0","skill_id":"YH1-00-03-S01","type":"single_select","prompt":"Choose the correct plural of okul.","options":[{"id":"A","text":"okulnar"},{"id":"B","text":"okulir"},{"id":"C","text":"okullar"},{"id":"D","text":"okuller"}],"correct_option_id":"C","explanation":"Okul has the back vowel u, so its plural suffix is -lar, not -ler: okul + lar → okullar. The suffix follows two-way vowel harmony."},{"id":"YH1-V12-Q006","section":"1.2","skill_id":"YH1-01-01-S01","type":"single_select","prompt":"Complete: Ben öğretmen___.","options":[{"id":"A","text":"im"},{"id":"B","text":"iz"},{"id":"C","text":"ler"},{"id":"D","text":"sin"}],"correct_option_id":"A","explanation":"First-person singular nominal predicate after a consonant takes -im."},{"id":"YH1-V12-Q007","section":"1.2","skill_id":"YH1-01-02-S02","type":"single_select","prompt":"Complete: Biz Türk___.","options":[{"id":"A","text":"ız"},{"id":"B","text":"üz"},{"id":"C","text":"uz"},{"id":"D","text":"iz"}],"correct_option_id":"B","explanation":"Türk has front rounded ü, so first-person plural is Türküz."},{"id":"YH1-V12-Q008","section":"1.2","skill_id":"YH1-01-02-S03","type":"single_select","prompt":"Complete: Ben hasta___.","options":[{"id":"A","text":"sın"},{"id":"B","text":"ım"},{"id":"C","text":"lar"},{"id":"D","text":"yım"}],"correct_option_id":"D","explanation":"After a vowel, first-person singular nominal predicate uses buffer y: hastayım."},{"id":"YH1-V12-Q009","section":"1.3","skill_id":"YH1-01-03-S02","type":"single_select","prompt":"Complete for absence at the present time: Buzdolabında süt ___. (There is no milk in the fridge now.)","options":[{"id":"A","text":"var"},{"id":"B","text":"yok"},{"id":"C","text":"vardı"},{"id":"D","text":"yoktu"}],"correct_option_id":"B","explanation":"Yok means “there is not / there are not” in the present: buzdolabında süt yok. Vardı means “there was,” while yoktu means “there was not.”"},{"id":"YH1-V12-Q010","section":"1.3","skill_id":"YH1-01-03-S03","type":"single_select","prompt":"Ask whether there is water: Su ___?","options":[{"id":"A","text":"var mı"},{"id":"B","text":"var mi"},{"id":"C","text":"var mu"},{"id":"D","text":"var mü"}],"correct_option_id":"A","explanation":"The question particle is written separately and follows vowel harmony. Because var has back unrounded a, the correct form is var mı?, not mi, mu, or mü."},{"id":"YH1-V12-Q011","section":"1.3","skill_id":"YH1-01-04-S02","type":"single_select","prompt":"Complete: beş → ___. (fifth)","options":[{"id":"A","text":"beşuncu"},{"id":"B","text":"beşüncü"},{"id":"C","text":"beşinci"},{"id":"D","text":"beşıncı"}],"correct_option_id":"C","explanation":"The ordinal suffix follows four-way vowel harmony: beş ends with front unrounded e, so -inci yields beşinci (“fifth”), not -ıncı, -uncu, or -üncü."},{"id":"YH1-V12-Q012","section":"2.1","skill_id":"YH1-02-01-S03","type":"single_select","prompt":"Complete: Sen şimdi çalışıyor ___?","options":[{"id":"A","text":"müsün"},{"id":"B","text":"misin"},{"id":"C","text":"mısın"},{"id":"D","text":"musun"}],"correct_option_id":"D","explanation":"The question particle follows the final vowel of çalışıyor: musun."},{"id":"YH1-V12-Q013","section":"2.2","skill_id":"YH1-02-02-S02","type":"single_select","prompt":"Complete: Öğretmen öğrenciler___ bir soru sordu. (to the students)","options":[{"id":"A","text":"de"},{"id":"B","text":"i"},{"id":"C","text":"e"},{"id":"D","text":"den"}],"correct_option_id":"C","explanation":"The recipient of sormak (“ask”) takes the dative: öğrenci + -ler + -e → öğrencilere (“to the students”). -de marks location and -den marks source."},{"id":"YH1-V12-Q014","section":"2.2","skill_id":"YH1-02-02-S03","type":"single_select","prompt":"Complete the dative suffix, including any buffer consonant: Ankara’___ gidiyorum.","options":[{"id":"A","text":"ya"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"a"}],"correct_option_id":"A","explanation":"Ankara ends in vowel a, so the dative suffix needs buffer y: Ankara + -ya → Ankara’ya (“to Ankara”). The plain -a option omits the required buffer consonant."},{"id":"YH1-V12-Q015","section":"2.2","skill_id":"YH1-02-03-S01","type":"single_select","prompt":"Complete: Anahtar masa___ . (The key is on the table.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"ya"},{"id":"C","text":"ta"},{"id":"D","text":"da"}],"correct_option_id":"D","explanation":"Masa takes locative -da: masada."},{"id":"YH1-V12-Q016","section":"2.2","skill_id":"YH1-02-03-S02","type":"single_select","prompt":"Complete: Ev___ kalıyorum.","options":[{"id":"A","text":"te"},{"id":"B","text":"da"},{"id":"C","text":"ta"},{"id":"D","text":"de"}],"correct_option_id":"D","explanation":"Ev has the front vowel e, so the locative suffix is -de: ev + de → evde (“at home”). The locative answers “where?”"},{"id":"YH1-V12-Q017","section":"2.2","skill_id":"YH1-02-04-S02","type":"single_select","prompt":"Complete: Çocuk okul___ geliyor. (from school)","options":[{"id":"A","text":"a"},{"id":"B","text":"da"},{"id":"C","text":"u"},{"id":"D","text":"dan"}],"correct_option_id":"D","explanation":"Ablative marks the point of departure: okuldan."},{"id":"YH1-V12-Q018","section":"2.2","skill_id":"YH1-02-04-S04","type":"single_select","prompt":"Complete: Park___ çıktık. (We left the park.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"a"},{"id":"C","text":"ta"},{"id":"D","text":"tan"}],"correct_option_id":"D","explanation":"After voiceless k, ablative uses t: parktan."},{"id":"YH1-V12-Q019","section":"2.3","skill_id":"YH1-02-05-S01","type":"single_select","prompt":"Complete: Akşam___ kadar çalışacağım. (until evening)","options":[{"id":"A","text":"ı"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"a"}],"correct_option_id":"D","explanation":"Kadar meaning until takes dative: akşama kadar."},{"id":"YH1-V12-Q020","section":"2.3","skill_id":"YH1-02-05-S03","type":"single_select","prompt":"Complete: Dersten ___ eve gidiyorum.","options":[{"id":"A","text":"kadar"},{"id":"B","text":"sonra"},{"id":"C","text":"önce"},{"id":"D","text":"gibi"}],"correct_option_id":"B","explanation":"-DEn sonra means after; dersten sonra is after class."},{"id":"YH1-V12-Q021","section":"3.1","skill_id":"YH1-03-01-S02","type":"single_select","prompt":"Complete: Bu benim göz___ . (my eye)","options":[{"id":"A","text":"um"},{"id":"B","text":"im"},{"id":"C","text":"üm"},{"id":"D","text":"ım"}],"correct_option_id":"C","explanation":"Göz takes first-person possessive -üm: gözüm."},{"id":"YH1-V12-Q022","section":"3.1","skill_id":"YH1-03-01-S04","type":"single_select","prompt":"Complete: Bu sizin ev___ . (your [plural/polite] house)","options":[{"id":"A","text":"iniz"},{"id":"B","text":"im"},{"id":"C","text":"imiz"},{"id":"D","text":"leri"}],"correct_option_id":"A","explanation":"Second-person plural possessive: eviniz."},{"id":"YH1-V12-Q023","section":"3.2","skill_id":"YH1-03-02-S02","type":"single_select","prompt":"Complete: Ayşe’nin araba___ kırmızı.","options":[{"id":"A","text":"sı"},{"id":"B","text":"ı"},{"id":"C","text":"si"},{"id":"D","text":"nı"}],"correct_option_id":"A","explanation":"Third-person possessive after vowel-final araba uses s: arabası."},{"id":"YH1-V12-Q024","section":"3.3","skill_id":"YH1-03-03-S02","type":"single_select","prompt":"Choose the genitive–possessive construction for “the door of a particular school” (not the general compound “school door”).","options":[{"id":"A","text":"okula kapı"},{"id":"B","text":"okulun kapısı"},{"id":"C","text":"okul kapı"},{"id":"D","text":"okul kapısı"}],"correct_option_id":"B","explanation":"Specific possession takes genitive okulun + possessive kapısı."},{"id":"YH1-V12-Q025","section":"3.3","skill_id":"YH1-03-04-S02","type":"single_select","prompt":"Choose the grammatically correct bare noun phrase meaning “beautiful houses” (no case or possessive suffix).","options":[{"id":"A","text":"güzeller evler"},{"id":"B","text":"güzeller ev"},{"id":"C","text":"güzel evler"},{"id":"D","text":"güzelin evler"}],"correct_option_id":"C","explanation":"Adjectives do not agree in number with nouns in Turkish."},{"id":"YH1-V12-Q026","section":"4.3","skill_id":"YH1-04-04-S02","type":"single_select","prompt":"Complete: Ben çocuk___ burada yaşıyordum. (when I was a child)","options":[{"id":"A","text":"ken"},{"id":"B","text":"lar"},{"id":"C","text":"dan"},{"id":"D","text":"a"}],"correct_option_id":"A","explanation":"Çocukken means “when [someone] was a child”: çocuk + -ken. In Ben çocukken, ben makes the subject “I.”"},{"id":"YH1-V12-Q027","section":"5.2","skill_id":"YH1-05-02-S03","type":"single_select","prompt":"Complete: şeker + -siz → ___.","options":[{"id":"A","text":"şekersüz"},{"id":"B","text":"şekersuz"},{"id":"C","text":"şekersiz"},{"id":"D","text":"şekersız"}],"correct_option_id":"C","explanation":"The suffix -sIz follows four-way vowel harmony: şekersiz."},{"id":"YH1-V12-Q028","section":"6.2","skill_id":"YH1-06-02-S02","type":"single_select","prompt":"Complete: Dün ___ okudum. (I read the specific book.)","options":[{"id":"A","text":"kitap"},{"id":"B","text":"kitapta"},{"id":"C","text":"kitaba"},{"id":"D","text":"kitabı"}],"correct_option_id":"D","explanation":"A specific direct object takes accusative: kitabı."},{"id":"YH1-V12-Q029","section":"6.3","skill_id":"YH1-06-03-S02","type":"single_select","prompt":"Complete the time adjective: Dün___ toplantı uzundu. (“Yesterday’s meeting was long.”)","options":[{"id":"A","text":"kı"},{"id":"B","text":"ki"},{"id":"C","text":"kü"},{"id":"D","text":"ku"}],"correct_option_id":"C","explanation":"The temporal modifier is dünkü (with rounded vowel ü)."},{"id":"YH1-V12-Q030","section":"7.1","skill_id":"YH1-07-01-S04","type":"single_select","prompt":"Choose the correct future tense of gitmek (ben).","options":[{"id":"A","text":"gitacağım"},{"id":"B","text":"gideceğim"},{"id":"C","text":"gidicemdir"},{"id":"D","text":"giteceğim"}],"correct_option_id":"B","explanation":"The stem t softens to d before the future suffix: gideceğim."},{"id":"YH1-V12-Q031","section":"9.1","skill_id":"YH1-09-01-S01","type":"single_select","prompt":"Use the aorist (geniş zaman): Ben her sabah kahve ___ . (I drink coffee every morning.)","options":[{"id":"A","text":"içtim"},{"id":"B","text":"içerim"},{"id":"C","text":"içecektim"},{"id":"D","text":"içiyordum"}],"correct_option_id":"B","explanation":"The aorist içerim expresses a habitual action."},{"id":"YH1-V12-Q032","section":"9.2","skill_id":"YH1-09-02-S04","type":"single_select","prompt":"Complete: Sen yüzebilir ___?","options":[{"id":"A","text":"müsün"},{"id":"B","text":"mısın"},{"id":"C","text":"misin"},{"id":"D","text":"musun"}],"correct_option_id":"C","explanation":"The ability verb yüzebilir takes question particle misin."},{"id":"YH1-V12-Q033","section":"10.1","skill_id":"YH1-10-01-S03","type":"single_select","prompt":"Choose the best connector: Yağmur yağıyor, ___ dışarı çıkmıyorum.","options":[{"id":"A","text":"çünkü"},{"id":"B","text":"veya"},{"id":"C","text":"ama"},{"id":"D","text":"bu yüzden"}],"correct_option_id":"D","explanation":"Bu yüzden introduces a result: it is raining, so I am not going out."},{"id":"YH1-V12-Q034","section":"11.2","skill_id":"YH1-11-04-S02","type":"single_select","prompt":"Complete: O, öğretmen ___ çalışıyor.","options":[{"id":"A","text":"olarak"},{"id":"B","text":"olsa"},{"id":"C","text":"oldu"},{"id":"D","text":"olmak"}],"correct_option_id":"A","explanation":"Öğretmen olarak means working as a teacher."},{"id":"YH1-V12-Q035","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S01","type":"single_select","prompt":"Which pair contains only back vowels?","options":[{"id":"A","text":"e, i"},{"id":"B","text":"a, e"},{"id":"C","text":"ö, ü"},{"id":"D","text":"a, ı"}],"correct_option_id":"D","explanation":"The Turkish back vowels are a, ı, o, u. Both a and ı belong to that set; e, i, ö, and ü are front vowels."},{"id":"YH1-V12-Q036","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S02","type":"single_select","prompt":"Complete: kitap + -da → ___.","options":[{"id":"A","text":"kitapte"},{"id":"B","text":"kitapde"},{"id":"C","text":"kitapda"},{"id":"D","text":"kitapta"}],"correct_option_id":"D","explanation":"After voiceless p, locative d becomes t."},{"id":"YH1-V12-Q037","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S01","type":"single_select","prompt":"Complete: kitap + -(y)I → ___.","options":[{"id":"A","text":"kitapı"},{"id":"B","text":"kitapi"},{"id":"C","text":"kitabı"},{"id":"D","text":"kitaba"}],"correct_option_id":"C","explanation":"Final p softens to b before the vowel-initial accusative ending."},{"id":"YH1-V12-Q038","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S01","type":"single_select","prompt":"Complete: araba + third-person possessive → ___.","options":[{"id":"A","text":"arabasın"},{"id":"B","text":"arabası"},{"id":"C","text":"arabayı"},{"id":"D","text":"arabaı"}],"correct_option_id":"B","explanation":"The buffer consonant s appears before third-person possessive -ı."},{"id":"YH1-V12-Q039","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S02","type":"single_select","prompt":"Choose the neutral subject–object–verb (SOV) word order for “Ali is reading a book.”","options":[{"id":"A","text":"Ali okuyor kitap."},{"id":"B","text":"Okuyor Ali kitap."},{"id":"C","text":"Ali kitap okuyor."},{"id":"D","text":"Kitap Ali okuyor."}],"correct_option_id":"C","explanation":"Neutral Turkish word order is subject–object–verb."},{"id":"YH1-V13-Q001","section":"0","skill_id":"YH1-00-02-S02","type":"single_select","prompt":"Which is the correct Turkish way to say “October 18, 2026” as a written date?","options":[{"id":"A","text":"2026 Ekim 18"},{"id":"B","text":"Ekim 18 2026"},{"id":"C","text":"18 October 2026"},{"id":"D","text":"18 Ekim 2026"}],"correct_option_id":"D","explanation":"In Turkish written dates, the day precedes the month."},{"id":"YH1-V13-Q002","section":"1.2","skill_id":"YH1-01-02-S04","type":"single_select","prompt":"Complete the negative nominal sentence: Ben doktor ___.","options":[{"id":"A","text":"değil"},{"id":"B","text":"değilsin"},{"id":"C","text":"değilim"},{"id":"D","text":"değiliz"}],"correct_option_id":"C","explanation":"Ben doktor değilim means I am not a doctor."},{"id":"YH1-V13-Q003","section":"2.1","skill_id":"YH1-02-01-S04","type":"single_select","prompt":"Complete the present continuous: başlamak → Ben şimdi ___.","options":[{"id":"A","text":"başlayıyorum"},{"id":"B","text":"başlarım"},{"id":"C","text":"başlıyorum"},{"id":"D","text":"başlayorum"}],"correct_option_id":"C","explanation":"Başla- loses its final a before -(I)yor: başlıyorum."},{"id":"YH1-V13-Q004","section":"2.2","skill_id":"YH1-02-02-S04","type":"single_select","prompt":"Complete the dative: kitap → kitab___.","options":[{"id":"A","text":"e"},{"id":"B","text":"ı"},{"id":"C","text":"a"},{"id":"D","text":"da"}],"correct_option_id":"C","explanation":"Kitap becomes kitaba with p → b before vowel-initial dative -a."},{"id":"YH1-V13-Q005","section":"2.2","skill_id":"YH1-02-04-S03","type":"single_select","prompt":"Complete the ablative: şehir → şehir___.","options":[{"id":"A","text":"den"},{"id":"B","text":"tan"},{"id":"C","text":"dan"},{"id":"D","text":"ten"}],"correct_option_id":"A","explanation":"The last vowel i is front, so şehirden takes -den."},{"id":"YH1-V13-Q006","section":"2.3","skill_id":"YH1-02-05-S04","type":"single_select","prompt":"Which phrase correctly means “after class”?","options":[{"id":"A","text":"dersten sonra"},{"id":"B","text":"derste sonra"},{"id":"C","text":"derse sonra"},{"id":"D","text":"dersi sonra"}],"correct_option_id":"A","explanation":"Sonra follows the ablative: dersten sonra."},{"id":"YH1-V13-Q007","section":"3.2","skill_id":"YH1-03-02-S03","type":"single_select","prompt":"Which correctly means “Ayşe’s bag”?","options":[{"id":"A","text":"Ayşe’ye çantası"},{"id":"B","text":"Ayşe çanta"},{"id":"C","text":"Ayşe’nin çanta"},{"id":"D","text":"Ayşe’nin çantası"}],"correct_option_id":"D","explanation":"A definite possessive compound marks the possessor with genitive and the possessed noun with possessive."},{"id":"YH1-V13-Q008","section":"3.3","skill_id":"YH1-03-04-S03","type":"single_select","prompt":"Which is an adjective + noun phrase, rather than a noun compound?","options":[{"id":"A","text":"okul kapısı"},{"id":"B","text":"büyük ev"},{"id":"C","text":"araba anahtarı"},{"id":"D","text":"mutfak masası"}],"correct_option_id":"B","explanation":"Büyük modifies ev as an adjective; the other phrases are noun compounds."},{"id":"YH1-V13-Q009","section":"4.3","skill_id":"YH1-04-03-S04","type":"single_select","prompt":"Complete: Biz dün saat sekizde çalışıyor___.","options":[{"id":"A","text":"dum"},{"id":"B","text":"duk"},{"id":"C","text":"dun"},{"id":"D","text":"du"}],"correct_option_id":"B","explanation":"Biz çalışıyorduk is first-person plural past continuous."},{"id":"YH1-V13-Q010","section":"4.3","skill_id":"YH1-04-05-S02","type":"single_select","prompt":"Choose the natural translation of “Ali and Ayşe.”","options":[{"id":"A","text":"Ali için Ayşe"},{"id":"B","text":"Ali göre Ayşe"},{"id":"C","text":"Ali kadar Ayşe"},{"id":"D","text":"Ali ile Ayşe"}],"correct_option_id":"D","explanation":"İle can join two nouns and mean and/with."},{"id":"YH1-V13-Q011","section":"6.3","skill_id":"YH1-06-03-S03","type":"single_select","prompt":"Which means “the one in the room”?","options":[{"id":"A","text":"odaya"},{"id":"B","text":"odadaki"},{"id":"C","text":"odada"},{"id":"D","text":"odadan"}],"correct_option_id":"B","explanation":"Odada + ki forms odadaki, a modifier/pronoun meaning the one in the room."},{"id":"YH1-V13-Q012","section":"7.2","skill_id":"YH1-07-02-S02","type":"single_select","prompt":"Complete the past future-intention form: Ben bugün gidecek___ ama planım değişti. (I was going to go today, but my plans changed.)","options":[{"id":"A","text":"tik"},{"id":"B","text":"tim"},{"id":"C","text":"ti"},{"id":"D","text":"tin"}],"correct_option_id":"B","explanation":"Gidecektim is first-person singular future-in-the-past."},{"id":"YH1-V13-Q013","section":"7.2","skill_id":"YH1-07-02-S03","type":"single_select","prompt":"Complete using the negative future-in-the-past: O gel___ti. (He/she was not going to come.)","options":[{"id":"A","text":"meyeceğim"},{"id":"B","text":"meyeceğ"},{"id":"C","text":"meyecek"},{"id":"D","text":"mayacak"}],"correct_option_id":"C","explanation":"Gel- takes the negative future form gelmeyecekti."},{"id":"YH1-V13-Q014","section":"7.3","skill_id":"YH1-07-04-S03","type":"single_select","prompt":"Complete the expression meaning “in my opinion”: Bana ___ bu kolay.","options":[{"id":"A","text":"önce"},{"id":"B","text":"göre"},{"id":"C","text":"kadar"},{"id":"D","text":"gibi"}],"correct_option_id":"B","explanation":"Bana göre is “in my opinion.” The postposition göre follows the dative pronoun bana, not the nominative ben."},{"id":"YH1-V13-Q015","section":"7.3","skill_id":"YH1-07-05-S02","type":"single_select","prompt":"Complete the equal-degree comparison: Senin ___ hızlı koşuyorum. (I run as fast as you do.)","options":[{"id":"A","text":"gibi"},{"id":"B","text":"göre"},{"id":"C","text":"kadar"},{"id":"D","text":"sonra"}],"correct_option_id":"C","explanation":"Kadar can mark equality of degree: senin kadar hızlı."},{"id":"YH1-V13-Q016","section":"8.1","skill_id":"YH1-08-02-S02","type":"single_select","prompt":"Complete: Meğer o doktor ___. (Apparently he/she was not a doctor.)","options":[{"id":"A","text":"değil"},{"id":"B","text":"değilmiş"},{"id":"C","text":"değildi"},{"id":"D","text":"değilsin"}],"correct_option_id":"B","explanation":"Değilmiş expresses an inferred or reported negative nominal predicate."},{"id":"YH1-V13-Q017","section":"8.1","skill_id":"YH1-08-02-S03","type":"single_select","prompt":"Complete the reported nominal question: O öğrenci ___?","options":[{"id":"A","text":"miymiş"},{"id":"B","text":"miyiz"},{"id":"C","text":"miydi"},{"id":"D","text":"midir"}],"correct_option_id":"A","explanation":"Öğrenci miymiş? asks whether someone was apparently a student."},{"id":"YH1-V13-Q018","section":"8.2","skill_id":"YH1-08-03-S02","type":"single_select","prompt":"Complete: Ali çalış___muş. (Apparently Ali was not working.)","options":[{"id":"A","text":"muyor"},{"id":"B","text":"müyor"},{"id":"C","text":"mıyor"},{"id":"D","text":"miyor"}],"correct_option_id":"C","explanation":"Çalışmıyormuş is the negative reported present continuous."},{"id":"YH1-V13-Q019","section":"8.2","skill_id":"YH1-08-03-S03","type":"single_select","prompt":"Which question uses the reported past form of the present continuous to ask “Was she apparently sleeping?”","options":[{"id":"A","text":"Uyuyor muydu?"},{"id":"B","text":"Uyuyor muymuş?"},{"id":"C","text":"Uyuyacak mı?"},{"id":"D","text":"Uyumuş mu?"}],"correct_option_id":"B","explanation":"Uyuyor muymuş asks a reported/inferred present-continuous question."},{"id":"YH1-V13-Q020","section":"8.2","skill_id":"YH1-08-04-S03","type":"single_select","prompt":"Which question uses the reported form of the future tense to ask “Was he apparently going to come?”","options":[{"id":"A","text":"Gelecek miymiş?"},{"id":"B","text":"Geliyor mu?"},{"id":"C","text":"Gelecek miydi?"},{"id":"D","text":"Gelmiş mi?"}],"correct_option_id":"A","explanation":"Gelecek miymiş is a reported future question."},{"id":"YH1-V13-Q021","section":"9.1","skill_id":"YH1-09-01-S05","type":"single_select","prompt":"Use the aorist (geniş zaman): Ben her gün kitap ___ . (I read every day.)","options":[{"id":"A","text":"okurum"},{"id":"B","text":"okirim"},{"id":"C","text":"okuyordum"},{"id":"D","text":"okarım"}],"correct_option_id":"A","explanation":"Oku- takes -r in the aorist: okurum."},{"id":"YH1-V13-Q022","section":"9.2","skill_id":"YH1-09-02-S03","type":"single_select","prompt":"Complete: Biz Türkçe konuşabil___. (We can speak Turkish.)","options":[{"id":"A","text":"irler"},{"id":"B","text":"irsin"},{"id":"C","text":"irim"},{"id":"D","text":"iriz"}],"correct_option_id":"D","explanation":"Konuşabiliriz is first-person plural ability in the aorist."},{"id":"YH1-V13-Q023","section":"9.3","skill_id":"YH1-09-03-S03","type":"single_select","prompt":"Complete: Eskiden et ye___. (I did not use to eat meat.)","options":[{"id":"A","text":"mezdim"},{"id":"B","text":"meyeceğim"},{"id":"C","text":"miyorum"},{"id":"D","text":"medim"}],"correct_option_id":"A","explanation":"Yemezdim is the negative habitual past."},{"id":"YH1-V13-Q024","section":"9.3","skill_id":"YH1-09-04-S01","type":"single_select","prompt":"A friend told you that someone used to live here. Complete with the reported habitual form: Eskiden burada yaşar___.","options":[{"id":"A","text":"ıyor"},{"id":"B","text":"dı"},{"id":"C","text":"mış"},{"id":"D","text":"acak"}],"correct_option_id":"C","explanation":"Yaşarmış expresses a reported past habit."},{"id":"YH1-V13-Q025","section":"9.3","skill_id":"YH1-09-04-S03","type":"single_select","prompt":"Complete: O eskiden kahve iç___miş. (Apparently he/she did not use to drink coffee.)","options":[{"id":"A","text":"me"},{"id":"B","text":"medi"},{"id":"C","text":"miyor"},{"id":"D","text":"mez"}],"correct_option_id":"D","explanation":"İçmezmiş is the negative reported aorist."},{"id":"YH1-V13-Q026","section":"10.1","skill_id":"YH1-10-02-S01","type":"single_select","prompt":"Choose the complete nested genitive–possessive phrase meaning “the door of the school’s library”.","options":[{"id":"A","text":"okulun kütüphane kapı"},{"id":"B","text":"okul kütüphane kapı"},{"id":"C","text":"okulun kütüphanesinin kapısı"},{"id":"D","text":"okula kütüphanenin kapısı"}],"correct_option_id":"C","explanation":"Chained possessives mark both school → library and library → door."},{"id":"YH1-V13-Q027","section":"10.2","skill_id":"YH1-10-03-S03","type":"single_select","prompt":"Complete the second-person possessive verbal noun: Senin erken gel___ için taksi çağırdım. (I called a taxi so that you could arrive early.)","options":[{"id":"A","text":"mem"},{"id":"B","text":"men"},{"id":"C","text":"mesi"},{"id":"D","text":"mek"}],"correct_option_id":"B","explanation":"Gel-me-n forms the second-person singular possessive verbal noun gelmen; senin agrees with the possessive marking."},{"id":"YH1-V13-Q028","section":"10.2","skill_id":"YH1-10-04-S02","type":"single_select","prompt":"Complete using the -mek üzere purpose construction: Sizinle görüşmek ___ geldim. (I came to meet you.)","options":[{"id":"A","text":"üzere"},{"id":"B","text":"önce"},{"id":"C","text":"sonra"},{"id":"D","text":"kadar"}],"correct_option_id":"A","explanation":"-mek üzere expresses purpose or intention."},{"id":"YH1-V13-Q029","section":"10.3","skill_id":"YH1-10-05-S03","type":"single_select","prompt":"Complete: Yemek ye___ sonra çıktık. (After eating, we left.)","options":[{"id":"A","text":"diğimiz"},{"id":"B","text":"mek"},{"id":"C","text":"meden"},{"id":"D","text":"dikten"}],"correct_option_id":"D","explanation":"Yedikten sonra uses -DIK + ablative -tAn."},{"id":"YH1-V13-Q030","section":"10.3","skill_id":"YH1-10-06-S02","type":"single_select","prompt":"Complete: Evden çık___ önce anahtarı aldım. (Before leaving home...)","options":[{"id":"A","text":"madan"},{"id":"B","text":"ıyor"},{"id":"C","text":"dıktan"},{"id":"D","text":"acak"}],"correct_option_id":"A","explanation":"Çıkmadan önce means before leaving; the -mAdAn form is required."},{"id":"YH1-V13-Q031","section":"11.1","skill_id":"YH1-11-01-S03","type":"single_select","prompt":"Complete: Kahvaltı yap___ işe gittim. (I had breakfast and went to work.)","options":[{"id":"A","text":"ip"},{"id":"B","text":"üp"},{"id":"C","text":"ıp"},{"id":"D","text":"up"}],"correct_option_id":"C","explanation":"Yap- takes the converb -ıp after back unrounded a."},{"id":"YH1-V13-Q032","section":"11.1","skill_id":"YH1-11-02-S02","type":"single_select","prompt":"Complete: Kahve iç___ çıktım. (I left without drinking coffee.)","options":[{"id":"A","text":"meden"},{"id":"B","text":"erek"},{"id":"C","text":"ip"},{"id":"D","text":"dikten"}],"correct_option_id":"A","explanation":"İçmeden is iç- (drink) + -meden (“without doing”); kahve içmeden çıktım means “I left without drinking coffee.”"},{"id":"YH1-V13-Q033","section":"11.2","skill_id":"YH1-11-03-S03","type":"single_select","prompt":"Complete: Eve koş___ geldim. (I came home running.)","options":[{"id":"A","text":"erek"},{"id":"B","text":"arak"},{"id":"C","text":"ıp"},{"id":"D","text":"madan"}],"correct_option_id":"B","explanation":"Koşarak expresses manner, with -arak after the back vowel o."},{"id":"YH1-V13-Q034","section":"12.1","skill_id":"YH1-12-01-S03","type":"single_select","prompt":"Which sentence naturally means “Swimming is good”?","options":[{"id":"A","text":"Yüzecek iyidir."},{"id":"B","text":"Yüzüyor iyidir."},{"id":"C","text":"Yüzdü iyidir."},{"id":"D","text":"Yüzmek iyidir."}],"correct_option_id":"D","explanation":"The infinitive -mek can function as a nominal subject."},{"id":"YH1-V13-Q035","section":"12.2","skill_id":"YH1-12-02-S01","type":"single_select","prompt":"Complete: Senin gel___ beni mutlu etti. (Your coming made me happy.)","options":[{"id":"A","text":"mem"},{"id":"B","text":"mesi"},{"id":"C","text":"men"},{"id":"D","text":"mek"}],"correct_option_id":"C","explanation":"Gelmen is gel-me + second-person possessive -n."},{"id":"YH1-V13-Q036","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S02","type":"single_select","prompt":"Choose the correct suffix for göz + plural.","options":[{"id":"A","text":"-ler"},{"id":"B","text":"-lir"},{"id":"C","text":"-lur"},{"id":"D","text":"-lar"}],"correct_option_id":"A","explanation":"The final vowel ö is front, selecting -ler."},{"id":"YH1-V13-Q037","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S01","type":"single_select","prompt":"Which pair contains two voiceless Turkish consonants?","options":[{"id":"A","text":"d, t"},{"id":"B","text":"ç, p"},{"id":"C","text":"g, k"},{"id":"D","text":"b, f"}],"correct_option_id":"B","explanation":"Both ç and p are voiceless. In the other pairs, d, g, and b are voiced, although t, k, and f are voiceless."},{"id":"YH1-V13-Q038","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S01","type":"single_select","prompt":"Complete: burun + my → ___.","options":[{"id":"A","text":"burunum"},{"id":"B","text":"burnım"},{"id":"C","text":"burnum"},{"id":"D","text":"burunım"}],"correct_option_id":"C","explanation":"Burun loses its second vowel before the first-person possessive: burnum."},{"id":"YH1-V13-Q039","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S03","type":"single_select","prompt":"Complete: ağız + accusative → ___.","options":[{"id":"A","text":"ağzı"},{"id":"B","text":"ağızı"},{"id":"C","text":"ağıza"},{"id":"D","text":"ağzıı"}],"correct_option_id":"A","explanation":"Ağız loses its second vowel before the accusative: ağzı."},{"id":"YH1-V13-Q040","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S02","type":"single_select","prompt":"Complete: bu + dative → ___.","options":[{"id":"A","text":"bunda"},{"id":"B","text":"buna"},{"id":"C","text":"bua"},{"id":"D","text":"buya"}],"correct_option_id":"B","explanation":"Demonstrative bu uses pronominal n before the dative: buna."},{"id":"YH1-V13-Q041","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S01","type":"single_select","prompt":"Choose the correct bare adjective–noun phrase meaning “a new car” (not a complete sentence).","options":[{"id":"A","text":"yeniyi araba"},{"id":"B","text":"yeni araba"},{"id":"C","text":"arabayı yeni"},{"id":"D","text":"araba yeni"}],"correct_option_id":"B","explanation":"An adjective ordinarily precedes its noun."},{"id":"YH1-V13-Q042","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S03","type":"single_select","prompt":"In “çok güzel ev”, which word is the head noun?","options":[{"id":"A","text":"çok güzel"},{"id":"B","text":"çok"},{"id":"C","text":"güzel"},{"id":"D","text":"ev"}],"correct_option_id":"D","explanation":"Ev is the head noun; çok güzel modifies it."},{"id":"YH1-V13-Q043","section":"2.3","skill_id":"YH1-02-TIME-S03","type":"single_select","prompt":"Which means “It is half past four”?","options":[{"id":"A","text":"Saat beşe çeyrek var."},{"id":"B","text":"Saat dört buçuk."},{"id":"C","text":"Saat beş buçuk."},{"id":"D","text":"Saat dördü çeyrek geçiyor."}],"correct_option_id":"B","explanation":"Saat dört buçuk means 4:30: buçuk means “half” after the hour. Saat beşe çeyrek var is 4:45, and dördü çeyrek geçiyor is 4:15."},{"id":"YH1-V14-Q001","section":"5.2","skill_id":"YH1-05-03-S02","type":"single_select","prompt":"Complete the suggestion: Yarın sahilde yürüyüş yap___! (Let’s take a walk.)","options":[{"id":"A","text":"ayım"},{"id":"B","text":"asın"},{"id":"C","text":"alım"},{"id":"D","text":"acak"}],"correct_option_id":"C","explanation":"Yapalım is the first-person plural optative form."},{"id":"YH1-V14-Q002","section":"5.2","skill_id":"YH1-05-03-S03","type":"single_select","prompt":"Choose the negative first-person plural suggestion: “Let’s not go.”","options":[{"id":"A","text":"Gitmeyiz."},{"id":"B","text":"Gitmiyoruz."},{"id":"C","text":"Gitmedik."},{"id":"D","text":"Gitmeyelim."}],"correct_option_id":"D","explanation":"Gitmeyelim uses -mA plus the first-person plural optative ending."},{"id":"YH1-V14-Q003","section":"7.3","skill_id":"YH1-07-03-S02","type":"single_select","prompt":"Which word means “in Turkish” (as a language)?","options":[{"id":"A","text":"Türkten"},{"id":"B","text":"Türkçe"},{"id":"C","text":"Türklü"},{"id":"D","text":"Türksüz"}],"correct_option_id":"B","explanation":"The equative suffix -CA forms language names, as in Türkçe."},{"id":"YH1-V14-Q004","section":"7.3","skill_id":"YH1-07-05-S03","type":"single_select","prompt":"Choose the sentence meaning “This room is as big as that room.”","options":[{"id":"A","text":"Bu oda o odadan büyük."},{"id":"B","text":"Bu oda o odada büyük."},{"id":"C","text":"Bu oda o odaya büyük."},{"id":"D","text":"Bu oda o oda kadar büyük."}],"correct_option_id":"D","explanation":"Kadar expresses equality of degree; -DAn alone can mark a comparison."},{"id":"YH1-V14-Q005","section":"8.3","skill_id":"YH1-08-05-S01","type":"single_select","prompt":"Which sentence contains the present-time third-person predicate ending -DIr (which can convey inference in context)?","options":[{"id":"A","text":"Ali dün evdeydi."},{"id":"B","text":"Ali evde değil."},{"id":"C","text":"Ali şimdi evdedir."},{"id":"D","text":"Ali eve gidiyor mu?"}],"correct_option_id":"C","explanation":"Ali şimdi evdedir contains the third-person predicate ending -dir. Depending on context, -DIr may convey a supposition or a formal assertion; the suffix alone does not force an inferential reading."},{"id":"YH1-V14-Q006","section":"8.3","skill_id":"YH1-08-05-S03","type":"single_select","prompt":"Complete the formal inference: Ayşe şu anda okulda___ .","options":[{"id":"A","text":"dır"},{"id":"B","text":"yız"},{"id":"C","text":"sınız"},{"id":"D","text":"dırlar"}],"correct_option_id":"A","explanation":"The third-person -DIr follows the locative predicate: okuldadır."},{"id":"YH1-V14-Q007","section":"9.3","skill_id":"YH1-09-04-S02","type":"single_select","prompt":"Someone tells you about a former habit you did not witness. Choose the reported form.","options":[{"id":"A","text":"Her sabah erkenden kalkacak."},{"id":"B","text":"Her sabah erkenden kalkardı."},{"id":"C","text":"Her sabah erkenden kalkıyor."},{"id":"D","text":"Her sabah erkenden kalkarmış."}],"correct_option_id":"D","explanation":"-ArmIş marks a reported or inferred habitual situation."},{"id":"YH1-V14-Q008","section":"10.1","skill_id":"YH1-10-02-S02","type":"single_select","prompt":"Which is the correct nested possessive phrase for “the door of my friend’s house”?","options":[{"id":"A","text":"arkadaşımın evine kapısı"},{"id":"B","text":"arkadaşımın evinin kapısı"},{"id":"C","text":"arkadaşımın ev kapı"},{"id":"D","text":"arkadaşımın evin kapısı"}],"correct_option_id":"B","explanation":"Nested genitive and possessive marking gives arkadaşımın evinin kapısı."},{"id":"YH1-V14-Q009","section":"10.2","skill_id":"YH1-10-03-S02","type":"single_select","prompt":"Which Turkish sentence explicitly identifies YOU as the person who should arrive early: “What can I do so that you arrive early?”","options":[{"id":"A","text":"Erken gelmek için ne yapabilirim?"},{"id":"B","text":"Senin erken gelmen için ne yapabilirim?"},{"id":"C","text":"Benim erken gelmem için ne yapabilirim?"},{"id":"D","text":"Onun erken gelmesi için ne yapabilirim?"}],"correct_option_id":"B","explanation":"Senin erken gelmen için explicitly makes sen the subject of the nominalized action; the other options change or omit that subject."},{"id":"YH1-V14-Q010","section":"10.2","skill_id":"YH1-10-04-S03","type":"single_select","prompt":"It is 8:59 and the meeting starts at 9:00. Complete with the construction meaning “about to”: Toplantı başla___ .","options":[{"id":"A","text":"mak üzere"},{"id":"B","text":"mış gibi"},{"id":"C","text":"madan önce"},{"id":"D","text":"dıktan sonra"}],"correct_option_id":"A","explanation":"Başlamak üzere expresses an imminent or intended action."},{"id":"YH1-V14-Q011","section":"10.3","skill_id":"YH1-10-06-S03","type":"single_select","prompt":"Complete: Dışarı çık___ önce anahtarını al. (Before going out, take your key.)","options":[{"id":"A","text":"dıktan"},{"id":"B","text":"ınca"},{"id":"C","text":"arak"},{"id":"D","text":"madan"}],"correct_option_id":"D","explanation":"Çıkmadan önce means before going out."},{"id":"YH1-V14-Q012","section":"11.3","skill_id":"YH1-11-05-S01","type":"single_select","prompt":"Which sentence uses the reduplicated -A converb koşa koşa (running repeatedly/continuously), not the single -ArAk converb koşarak?","options":[{"id":"A","text":"Çocuklar bahçede koşmadan yoruldu."},{"id":"B","text":"Çocuklar bahçede koşarak yoruldu."},{"id":"C","text":"Çocuklar bahçede koşa koşa yoruldu."},{"id":"D","text":"Çocuklar bahçede koşacak yoruldu."}],"correct_option_id":"C","explanation":"Koşa koşa expresses repeated or sustained running."},{"id":"YH1-V14-Q013","section":"11.3","skill_id":"YH1-11-05-S02","type":"single_select","prompt":"Complete the paired -A converb: Çocuklar parkta ___ vakit geçirdi. (The children spent time cheerfully, laughing and playing.)","options":[{"id":"A","text":"gülerek oynaya"},{"id":"B","text":"güle oynaya"},{"id":"C","text":"güle oynarken"},{"id":"D","text":"gülmeden oynaya"}],"correct_option_id":"B","explanation":"Güle oynaya is a natural paired -A converb expression meaning cheerfully or joyfully."},{"id":"YH1-V14-Q014","section":"11.3","skill_id":"YH1-11-05-S03","type":"single_select","prompt":"Which sentence contains the reduplicated converb ağlaya ağlaya (crying repeatedly or continuously)?","options":[{"id":"A","text":"Çocuk eve ağlamış geldi."},{"id":"B","text":"Çocuk eve ağlaya ağlaya geldi."},{"id":"C","text":"Çocuk eve ağlamadan geldi."},{"id":"D","text":"Çocuk eve ağlayarak geldi."}],"correct_option_id":"B","explanation":"Ağlaya ağlaya is a reduplicated converb expressing prolonged crying."},{"id":"YH1-V14-Q015","section":"12.2","skill_id":"YH1-12-02-S03","type":"single_select","prompt":"Choose the sentence meaning “I know that Ayşe came.”","options":[{"id":"A","text":"Ayşe’nin geldiğini biliyorum."},{"id":"B","text":"Ayşe’nin gelmesini biliyorum."},{"id":"C","text":"Ayşe’nin geldiğinde biliyorum."},{"id":"D","text":"Ayşe’nin gelecekte biliyorum."}],"correct_option_id":"A","explanation":"The embedded clause uses a verbal noun with possessive and accusative marking: geldiğini."},{"id":"YH1-V14-Q016","section":"12.3","skill_id":"YH1-12-03-S02","type":"single_select","prompt":"Which correctly reports “The teacher told me to sit down”?","options":[{"id":"A","text":"Öğretmen bana oturdum söyledi."},{"id":"B","text":"Öğretmen bana oturmak söyledi."},{"id":"C","text":"Öğretmen bana oturuyorum söyledi."},{"id":"D","text":"Öğretmen bana oturmamı söyledi."}],"correct_option_id":"D","explanation":"The reported instruction can be expressed with a nominalized verb and possessive/accusative marking."},{"id":"YH1-V14-Q017","section":"12.3","skill_id":"YH1-12-03-S03","type":"single_select","prompt":"Choose “The teacher told us to wait.”","options":[{"id":"A","text"
