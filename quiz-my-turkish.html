2-S03","type":"single_select","prompt":"Choose the Turkish spelling of 318.","options":[{"id":"A","text":"üç yüz on sekiz"},{"id":"B","text":"üç yüz seksen bir"},{"id":"C","text":"otuz yüz on sekiz"},{"id":"D","text":"üç bin on sekiz"}],"correct_option_id":"A","explanation":"318 is üç yüz (300) + on (10) + sekiz (8)."},{"id":"YH1-V54-Q003","section":"0","skill_id":"YH1-00-03-S01","type":"single_select","prompt":"Choose the plain plural of kitap (without any possessive suffix).","options":[{"id":"A","text":"kitaplar"},{"id":"B","text":"kitapler"},{"id":"C","text":"kitaplarım"},{"id":"D","text":"kitapı"}],"correct_option_id":"A","explanation":"The plural suffix follows back-vowel harmony: kitap + -lar = kitaplar."},{"id":"YH1-V54-Q004","section":"0","skill_id":"YH1-00-03-S01","type":"single_select","prompt":"Choose the correct plural of şehir.","options":[{"id":"A","text":"şehirler"},{"id":"B","text":"şehirlar"},{"id":"C","text":"şehiri"},{"id":"D","text":"şehirde"}],"correct_option_id":"A","explanation":"The plural suffix follows front-vowel harmony: şehir + -ler = şehirler."},{"id":"YH1-V54-Q005","section":"1.2","skill_id":"YH1-01-01-S01","type":"single_select","prompt":"Complete the nominal predicate: Ben doktor___. (I am a doctor.)","options":[{"id":"A","text":"um"},{"id":"B","text":"üm"},{"id":"C","text":"ım"},{"id":"D","text":"sun"}],"correct_option_id":"A","explanation":"Doktor has o as its last vowel, so the first-person singular ending is -um: doktorum."},{"id":"YH1-V54-Q006","section":"1.2","skill_id":"YH1-01-01-S01","type":"single_select","prompt":"Complete the nominal predicate: Ben mühendis___. (I am an engineer.)","options":[{"id":"A","text":"im"},{"id":"B","text":"ım"},{"id":"C","text":"um"},{"id":"D","text":"sin"}],"correct_option_id":"A","explanation":"Mühendis has i as its last vowel, so the first-person singular ending is -im: mühendisim."},{"id":"YH1-V54-Q007","section":"1.2","skill_id":"YH1-01-02-S02","type":"single_select","prompt":"Complete: Biz doktor___. (We are doctors.)","options":[{"id":"A","text":"uz"},{"id":"B","text":"üz"},{"id":"C","text":"ız"},{"id":"D","text":"sunuz"}],"correct_option_id":"A","explanation":"Doktor has o as its last vowel: doktoruz (we are doctors)."},{"id":"YH1-V54-Q008","section":"1.2","skill_id":"YH1-01-02-S02","type":"single_select","prompt":"Complete: Biz mühendis___. (We are engineers.)","options":[{"id":"A","text":"iz"},{"id":"B","text":"ız"},{"id":"C","text":"uz"},{"id":"D","text":"siniz"}],"correct_option_id":"A","explanation":"Mühendis has i as its last vowel: mühendisiz (we are engineers)."},{"id":"YH1-V54-Q009","section":"1.2","skill_id":"YH1-01-02-S03","type":"single_select","prompt":"Complete: Ben yorgun___. (I am tired.)","options":[{"id":"A","text":"um"},{"id":"B","text":"üm"},{"id":"C","text":"ım"},{"id":"D","text":"sun"}],"correct_option_id":"A","explanation":"Yorgun has u as its last vowel, so the first-person singular ending is -um: yorgunum."},{"id":"YH1-V54-Q010","section":"1.2","skill_id":"YH1-01-02-S03","type":"single_select","prompt":"Complete: Ben üzgün___. (I am sad.)","options":[{"id":"A","text":"üm"},{"id":"B","text":"um"},{"id":"C","text":"ım"},{"id":"D","text":"sün"}],"correct_option_id":"A","explanation":"Üzgün has ü as its last vowel, so the first-person singular ending is -üm: üzgünüm."},{"id":"YH1-V54-Q011","section":"1.3","skill_id":"YH1-01-03-S02","type":"single_select","prompt":"Complete for absence right now: Masada hiç ekmek ___. (There is no bread at all on the table now.)","options":[{"id":"A","text":"yok"},{"id":"B","text":"var"},{"id":"C","text":"yoktu"},{"id":"D","text":"varmış"}],"correct_option_id":"A","explanation":"Yok expresses nonexistence or absence: Masada hiç ekmek yok."},{"id":"YH1-V54-Q012","section":"1.3","skill_id":"YH1-01-03-S02","type":"single_select","prompt":"Choose the sentence meaning “There is no coffee in the cup.”","options":[{"id":"A","text":"Fincanda kahve yok."},{"id":"B","text":"Fincanda kahve var."},{"id":"C","text":"Fincanda kahve de var."},{"id":"D","text":"Fincandaki kahve sıcak."}],"correct_option_id":"A","explanation":"Yok indicates absence; the other sentences affirm coffee exists or describe it."},{"id":"YH1-V54-Q013","section":"1.3","skill_id":"YH1-01-03-S03","type":"single_select","prompt":"Complete the yes/no question asking whether there is bread: Ekmek ___?","options":[{"id":"A","text":"var mı"},{"id":"B","text":"var mi"},{"id":"C","text":"yoktur"},{"id":"D","text":"varım"}],"correct_option_id":"A","explanation":"The separate question particle harmonizes with var: Ekmek var mı?"},{"id":"YH1-V54-Q014","section":"1.3","skill_id":"YH1-01-03-S03","type":"single_select","prompt":"Choose the present-time question meaning “Is there a bus?”","options":[{"id":"A","text":"Otobüs var mı?"},{"id":"B","text":"Otobüs var mi?"},{"id":"C","text":"Otobüs varım?"},{"id":"D","text":"Otobüs var mıydı?"}],"correct_option_id":"A","explanation":"Existence questions use var plus separate mı: Otobüs var mı?"},{"id":"YH1-V54-Q015","section":"1.3","skill_id":"YH1-01-04-S02","type":"single_select","prompt":"What is the singular ordinal form of altı (six)?","options":[{"id":"A","text":"altıncı"},{"id":"B","text":"altıcı"},{"id":"C","text":"altıncılar"},{"id":"D","text":"altmış"}],"correct_option_id":"A","explanation":"The ordinal of altı is altıncı (sixth)."},{"id":"YH1-V54-Q016","section":"1.3","skill_id":"YH1-01-04-S02","type":"single_select","prompt":"What is the ordinal form of dört (four)?","options":[{"id":"A","text":"dördüncü"},{"id":"B","text":"dörtüncü"},{"id":"C","text":"dörtlü"},{"id":"D","text":"dördü"}],"correct_option_id":"A","explanation":"The ordinal of dört is dördüncü (fourth): the final t softens to d before the vowel-initial ordinal suffix -üncü."},{"id":"YH1-V54-Q017","section":"2.1","skill_id":"YH1-02-01-S03","type":"single_select","prompt":"Complete the present progressive yes/no question: Sen kitap okuyor ___?","options":[{"id":"A","text":"musun"},{"id":"B","text":"müsün"},{"id":"C","text":"mısın"},{"id":"D","text":"muyum"}],"correct_option_id":"A","explanation":"Okuyor has o as its last vowel, so the separate question particle is mu: okuyor musun?"},{"id":"YH1-V54-Q018","section":"2.1","skill_id":"YH1-02-01-S03","type":"single_select","prompt":"Complete the present progressive yes/no question: Sen bizi dinliyor ___?","options":[{"id":"A","text":"musun"},{"id":"B","text":"müsün"},{"id":"C","text":"misin"},{"id":"D","text":"muyuz"}],"correct_option_id":"A","explanation":"Dinliyor has o as its last vowel; the correct form is dinliyor musun?"},{"id":"YH1-V54-Q019","section":"2.2","skill_id":"YH1-02-02-S02","type":"single_select","prompt":"Complete the dative suffix: Çocuklar öğretmen___ soru soruyor. (The children ask the teacher a question.)","options":[{"id":"A","text":"e"},{"id":"B","text":"a"},{"id":"C","text":"i"},{"id":"D","text":"de"}],"correct_option_id":"A","explanation":"Öğretmen ends in a consonant and has a front vowel, so the dative is öğretmene."},{"id":"YH1-V54-Q020","section":"2.2","skill_id":"YH1-02-02-S02","type":"single_select","prompt":"Complete the dative suffix: Babam doktor___ telefon ediyor. (My father phones the doctor.)","options":[{"id":"A","text":"a"},{"id":"B","text":"e"},{"id":"C","text":"u"},{"id":"D","text":"da"}],"correct_option_id":"A","explanation":"Doktor has a back vowel and ends in a consonant, so the dative is doktora."},{"id":"YH1-V54-Q021","section":"2.2","skill_id":"YH1-02-02-S03","type":"single_select","prompt":"Supply the full dative suffix after the apostrophe, including a buffer consonant if needed: Yarın Bursa’___ gidiyoruz. (We are going to Bursa tomorrow.)","options":[{"id":"A","text":"ya"},{"id":"B","text":"ye"},{"id":"C","text":"a"},{"id":"D","text":"da"}],"correct_option_id":"A","explanation":"Bursa ends in a vowel and has a back vowel; the dative is Bursa’ya with buffer y."},{"id":"YH1-V54-Q022","section":"2.2","skill_id":"YH1-02-02-S03","type":"single_select","prompt":"Supply the full dative suffix after the apostrophe: Yarın İzmir’___ gidiyoruz. (We are going to İzmir tomorrow.)","options":[{"id":"A","text":"e"},{"id":"B","text":"a"},{"id":"C","text":"ye"},{"id":"D","text":"de"}],"correct_option_id":"A","explanation":"İzmir ends in a consonant and has a front vowel, so the dative is İzmir’e."},{"id":"YH1-V54-Q023","section":"2.2","skill_id":"YH1-02-03-S01","type":"single_select","prompt":"Complete the locative suffix: Telefon çanta___. (The phone is in the bag.)","options":[{"id":"A","text":"da"},{"id":"B","text":"de"},{"id":"C","text":"ta"},{"id":"D","text":"dan"}],"correct_option_id":"A","explanation":"Çanta ends in a vowel and has a back vowel, so the locative is çantada."},{"id":"YH1-V54-Q024","section":"2.2","skill_id":"YH1-02-03-S01","type":"single_select","prompt":"Complete the locative suffix: Kitap raf___. (The book is on the shelf.)","options":[{"id":"A","text":"ta"},{"id":"B","text":"da"},{"id":"C","text":"te"},{"id":"D","text":"tan"}],"correct_option_id":"A","explanation":"Raf ends in voiceless f and has a back vowel, so the locative is rafta."},{"id":"YH1-V56-Q001","section":"2.2","skill_id":"YH1-02-03-S02","type":"single_select","prompt":"Complete: Anahtar ev___ kaldı. (The key remained at home.)","options":[{"id":"A","text":"de"},{"id":"B","text":"da"},{"id":"C","text":"te"},{"id":"D","text":"den"}],"correct_option_id":"A","explanation":"Ev has a front vowel and ends in a voiced consonant: evde."},{"id":"YH1-V56-Q002","section":"2.2","skill_id":"YH1-02-03-S02","type":"single_select","prompt":"Complete: Biz ev___ oturuyoruz. (We are sitting at home.)","options":[{"id":"A","text":"ta"},{"id":"B","text":"den"},{"id":"C","text":"de"},{"id":"D","text":"e"}],"correct_option_id":"C","explanation":"Ev takes the locative ending -de because e is a front vowel and v is voiced: ev + de → evde (“at home”). -den means “from home,” and -e means “to home.”"},{"id":"YH1-V56-Q003","section":"2.2","skill_id":"YH1-02-04-S02","type":"single_select","prompt":"Complete: Öğrenci okul___ çıktı. (The student came out of school.)","options":[{"id":"A","text":"a"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"u"}],"correct_option_id":"B","explanation":"Okuldan marks movement from school with the ablative -dan."},{"id":"YH1-V56-Q004","section":"2.2","skill_id":"YH1-02-04-S02","type":"single_select","prompt":"Complete: Sabah okul___ eve geldim. (I came home from school.)","options":[{"id":"A","text":"da"},{"id":"B","text":"a"},{"id":"C","text":"dan"},{"id":"D","text":"un"}],"correct_option_id":"C","explanation":"Okuldan means from school; -dan is the ablative ending."},{"id":"YH1-V56-Q005","section":"2.2","skill_id":"YH1-02-04-S04","type":"single_select","prompt":"Complete: Çocuk park___ koşarak çıktı. (The child ran out of the park.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"tan"},{"id":"C","text":"ta"},{"id":"D","text":"a"}],"correct_option_id":"B","explanation":"Park ends in voiceless k, so the ablative is parktan."},{"id":"YH1-V56-Q006","section":"2.2","skill_id":"YH1-02-04-S04","type":"single_select","prompt":"Complete: Park___ eve yürüdük. (We walked home from the park.)","options":[{"id":"A","text":"a"},{"id":"B","text":"ta"},{"id":"C","text":"tan"},{"id":"D","text":"dan"}],"correct_option_id":"C","explanation":"The ablative suffix after park begins with t: parktan."},{"id":"YH1-V56-Q007","section":"2.3","skill_id":"YH1-02-05-S01","type":"single_select","prompt":"Complete: Sabah___ kadar uyudum. (I slept until morning.)","options":[{"id":"A","text":"a"},{"id":"B","text":"da"},{"id":"C","text":"dan"},{"id":"D","text":"ı"}],"correct_option_id":"A","explanation":"Kadar in the sense of until takes the dative: sabaha kadar."},{"id":"YH1-V56-Q008","section":"2.3","skill_id":"YH1-02-05-S01","type":"single_select","prompt":"Complete: Gece___ kadar çalıştık. (We worked until night.)","options":[{"id":"A","text":"yi"},{"id":"B","text":"den"},{"id":"C","text":"ye"},{"id":"D","text":"de"}],"correct_option_id":"C","explanation":"Geceye kadar means until night; vowel-final gece takes buffer y before -e."},{"id":"YH1-V56-Q009","section":"2.3","skill_id":"YH1-02-05-S03","type":"single_select","prompt":"Complete: Kahvaltıdan ___ işe gidiyorum. (I go to work after breakfast.)","options":[{"id":"A","text":"önce"},{"id":"B","text":"kadar"},{"id":"C","text":"sonra"},{"id":"D","text":"gibi"}],"correct_option_id":"C","explanation":"The ablative + sonra construction expresses after: kahvaltıdan sonra."},{"id":"YH1-V56-Q010","section":"2.3","skill_id":"YH1-02-05-S03","type":"single_select","prompt":"Complete: Dersten ___ arkadaşımı aradım. (I called my friend after class.)","options":[{"id":"A","text":"sonra"},{"id":"B","text":"önce"},{"id":"C","text":"gibi"},{"id":"D","text":"kadar"}],"correct_option_id":"A","explanation":"Sonra means “after” and commonly follows an ablative-marked noun: ders + ten + sonra → dersten sonra (“after class”)."},{"id":"YH1-V56-Q011","section":"3.1","skill_id":"YH1-03-01-S02","type":"single_select","prompt":"Complete: Bu benim söz___. (This is my word/promise.)","options":[{"id":"A","text":"üm"},{"id":"B","text":"im"},{"id":"C","text":"um"},{"id":"D","text":"ım"}],"correct_option_id":"A","explanation":"Söz takes the first-person singular possessive suffix -üm: sözüm."},{"id":"YH1-V56-Q012","section":"3.1","skill_id":"YH1-03-01-S02","type":"single_select","prompt":"Complete: Benim göz___ ağrıyor. (My eye hurts.)","options":[{"id":"A","text":"im"},{"id":"B","text":"um"},{"id":"C","text":"üm"},{"id":"D","text":"ım"}],"correct_option_id":"C","explanation":"Gözüm is göz + -üm, following four-way vowel harmony."},{"id":"YH1-V56-Q013","section":"3.1","skill_id":"YH1-03-01-S04","type":"single_select","prompt":"Complete: Bu sizin kitab___. (This is your book; plural/polite you.)","options":[{"id":"A","text":"ınız"},{"id":"B","text":"iniz"},{"id":"C","text":"unuz"},{"id":"D","text":"ünüz"}],"correct_option_id":"A","explanation":"The softened stem kitab- takes -ınız: kitabınız."},{"id":"YH1-V56-Q014","section":"3.1","skill_id":"YH1-03-01-S04","type":"single_select","prompt":"Complete: Sizin ev___ büyük. (Your [plural/polite] house is big.)","options":[{"id":"A","text":"imiz"},{"id":"B","text":"iniz"},{"id":"C","text":"leri"},{"id":"D","text":"in"}],"correct_option_id":"B","explanation":"Eviniz uses second-person plural/polite possessive -iniz."},{"id":"YH1-V56-Q015","section":"3.2","skill_id":"YH1-03-02-S02","type":"single_select","prompt":"Complete: Mehmet’in araba___ yeni. (Mehmet’s car is new.)","options":[{"id":"A","text":"ı"},{"id":"B","text":"si"},{"id":"C","text":"sı"},{"id":"D","text":"nı"}],"correct_option_id":"C","explanation":"After vowel-final araba, third-person possessive uses buffer s: arabası."},{"id":"YH1-V56-Q016","section":"3.2","skill_id":"YH1-03-02-S02","type":"single_select","prompt":"Complete: Elif’in oda___ geniş. (Elif’s room is spacious.)","options":[{"id":"A","text":"sı"},{"id":"B","text":"sü"},{"id":"C","text":"su"},{"id":"D","text":"ı"}],"correct_option_id":"A","explanation":"Oda + -sı gives odası, with third-person possessive buffer s."},{"id":"YH1-V56-Q017","section":"3.3","skill_id":"YH1-03-03-S02","type":"single_select","prompt":"Which means ‘the window of a particular house’ (not a general house-window compound)?","options":[{"id":"A","text":"ev pencere"},{"id":"B","text":"evin penceresi"},{"id":"C","text":"ev penceresi"},{"id":"D","text":"eve pencere"}],"correct_option_id":"B","explanation":"Specific possession takes evin (genitive) + penceresi (possessive)."},{"id":"YH1-V56-Q018","section":"3.3","skill_id":"YH1-03-03-S02","type":"single_select","prompt":"Which means ‘the garden of a particular school’ (not a generic school garden)?","options":[{"id":"A","text":"okul bahçesi"},{"id":"B","text":"okula bahçe"},{"id":"C","text":"okulun bahçesi"},{"id":"D","text":"okul bahçe"}],"correct_option_id":"C","explanation":"The genitive–possessive construction is okulun bahçesi."},{"id":"YH1-V56-Q019","section":"3.3","skill_id":"YH1-03-04-S02","type":"single_select","prompt":"Choose the bare noun phrase meaning ‘new books’ (no case or possessive suffix).","options":[{"id":"A","text":"yeniler kitaplar"},{"id":"B","text":"yeni kitaplar"},{"id":"C","text":"yeniler kitap"},{"id":"D","text":"yeninin kitapları"}],"correct_option_id":"B","explanation":"Turkish adjectives do not pluralize to agree with nouns: yeni kitaplar."},{"id":"YH1-V56-Q020","section":"3.3","skill_id":"YH1-03-04-S02","type":"single_select","prompt":"Choose the bare noun phrase meaning ‘small rooms’ (no case or possessive suffix).","options":[{"id":"A","text":"küçük odalar"},{"id":"B","text":"küçükler odalar"},{"id":"C","text":"küçük oda"},{"id":"D","text":"küçüklerin odaları"}],"correct_option_id":"A","explanation":"Plural attaches to the noun, not the adjective: küçük odalar."},{"id":"YH1-V56-Q021","section":"4.3","skill_id":"YH1-04-04-S02","type":"single_select","prompt":"Complete: Ben öğrenci___ her gün kitap okurdum. (When I was a student, I used to read daily.)","options":[{"id":"A","text":"yken"},{"id":"B","text":"ken"},{"id":"C","text":"den"},{"id":"D","text":"ler"}],"correct_option_id":"A","explanation":"The vowel-final noun öğrenci takes -yken: öğrenciyken."},{"id":"YH1-V56-Q022","section":"4.3","skill_id":"YH1-04-04-S02","type":"single_select","prompt":"Complete: Biz küçük___ bu sokakta oynardık. (When we were little, we played on this street.)","options":[{"id":"A","text":"ken"},{"id":"B","text":"ten"},{"id":"C","text":"ler"},{"id":"D","text":"e"}],"correct_option_id":"A","explanation":"Küçükken is küçük (“small/young”) + -ken (“when”); Biz küçükken means “when we were little.”"},{"id":"YH1-V56-Q023","section":"5.2","skill_id":"YH1-05-02-S03","type":"single_select","prompt":"Complete the adjective: tuz + -sIz → ___ (salt-free).","options":[{"id":"A","text":"tuzsız"},{"id":"B","text":"tuzsuz"},{"id":"C","text":"tuzsiz"},{"id":"D","text":"tuzsüz"}],"correct_option_id":"B","explanation":"Tuzsuz follows back rounded vowel harmony with -suz."},{"id":"YH1-V56-Q024","section":"5.2","skill_id":"YH1-05-02-S03","type":"single_select","prompt":"Complete the adjective: yağ + -sIz → ___ (fat-free).","options":[{"id":"A","text":"yağsız"},{"id":"B","text":"yağsiz"},{"id":"C","text":"yağsuz"},{"id":"D","text":"yağsüz"}],"correct_option_id":"A","explanation":"Yağsız follows back unrounded vowel harmony with -sız."},{"id":"YH1-V58-Q001","section":"6.2","skill_id":"YH1-06-02-S02","type":"single_select","prompt":"Choose the sentence meaning “I saw the specific dog.”","options":[{"id":"A","text":"Köpek gördüm."},{"id":"B","text":"Köpeği gördüm."},{"id":"C","text":"Köpeğe gördüm."},{"id":"D","text":"Köpekte gördüm."}],"correct_option_id":"B","explanation":"A specific direct object takes the accusative: köpek → köpeği (k softens to ğ)."},{"id":"YH1-V58-Q002","section":"6.2","skill_id":"YH1-06-02-S02","type":"single_select","prompt":"Complete with the simple past: Bu filmi daha önce ___. (I watched this particular film before.)","options":[{"id":"A","text":"izledim"},{"id":"B","text":"izledim mi"},{"id":"C","text":"izliyorum"},{"id":"D","text":"izlemek"}],"correct_option_id":"A","explanation":"Bu filmi is accusative-marked; izledim gives the stated past-tense meaning."},{"id":"YH1-V58-Q003","section":"6.3","skill_id":"YH1-06-03-S02","type":"single_select","prompt":"Complete the modifier: Yarın___ sınav zor olacak. (“Tomorrow’s exam will be difficult.”)","options":[{"id":"A","text":"ki"},{"id":"B","text":"kü"},{"id":"C","text":"kı"},{"id":"D","text":"ku"}],"correct_option_id":"A","explanation":"Yarınki is the standard temporal adjective meaning tomorrow’s."},{"id":"YH1-V58-Q004","section":"6.3","skill_id":"YH1-06-03-S02","type":"single_select","prompt":"Which expression means “today’s newspaper”?","options":[{"id":"A","text":"bugünde gazete"},{"id":"B","text":"bugünkü gazete"},{"id":"C","text":"bugünlü gazete"},{"id":"D","text":"bugüne gazete"}],"correct_option_id":"B","explanation":"Bugünkü is the adjective derived from bugün with -kü."},{"id":"YH1-V58-Q005","section":"7.1","skill_id":"YH1-07-01-S04","type":"single_select","prompt":"Choose the standard future tense of gitmek for “we will go.”","options":[{"id":"A","text":"gitaceğiz"},{"id":"B","text":"gideceğiz"},{"id":"C","text":"giteceğiz"},{"id":"D","text":"gidiyoruz"}],"correct_option_id":"B","explanation":"Git- softens t → d before -ecek: gideceğiz."},{"id":"YH1-V58-Q006","section":"7.1","skill_id":"YH1-07-01-S04","type":"single_select","prompt":"Complete with the future tense: Ben yarın eve ___ . (I will go home tomorrow.)","options":[{"id":"A","text":"gideceğim"},{"id":"B","text":"gittim"},{"id":"C","text":"gidiyordum"},{"id":"D","text":"giderdim"}],"correct_option_id":"A","explanation":"Gideceğim is the first-person singular future form of gitmek."},{"id":"YH1-V58-Q007","section":"9.1","skill_id":"YH1-09-01-S01","type":"single_select","prompt":"Choose the aorist habitual form: O her hafta sonu kitap ___ . (He/she reads books every weekend.)","options":[{"id":"A","text":"okudu"},{"id":"B","text":"okuyacak"},{"id":"C","text":"okur"},{"id":"D","text":"okuyordu"}],"correct_option_id":"C","explanation":"Okur is the aorist form indicating a habitual action."},{"id":"YH1-V58-Q008","section":"9.1","skill_id":"YH1-09-01-S01","type":"single_select","prompt":"Complete with the aorist: Biz genellikle erken ___ . (We generally get up early.)","options":[{"id":"A","text":"kalktık"},{"id":"B","text":"kalkarız"},{"id":"C","text":"kalkacağız"},{"id":"D","text":"kalkıyorduk"}],"correct_option_id":"B","explanation":"Kalkarız is the first-person plural aorist of kalkmak."},{"id":"YH1-V58-Q009","section":"9.2","skill_id":"YH1-09-02-S04","type":"single_select","prompt":"Complete the ability question: Siz Türkçe konuşabilir ___? (Can you speak Turkish?)","options":[{"id":"A","text":"mısınız"},{"id":"B","text":"musunuz"},{"id":"C","text":"misiniz"},{"id":"D","text":"müsünüz"}],"correct_option_id":"C","explanation":"Konuşabilir takes the question particle mi + second-person plural/polite ending: misiniz."},{"id":"YH1-V58-Q010","section":"9.2","skill_id":"YH1-09-02-S04","type":"single_select","prompt":"Complete: O hızlı koşabilir ___? (Can he/she run fast?)","options":[{"id":"A","text":"mi"},{"id":"B","text":"mı"},{"id":"C","text":"mu"},{"id":"D","text":"mü"}],"correct_option_id":"A","explanation":"The final vowel in koşabilir is i, so the separate question particle is mi."},{"id":"YH1-V58-Q011","section":"10.1","skill_id":"YH1-10-01-S03","type":"single_select","prompt":"Choose the connector that means “therefore”: Çok yorgunum, ___ erken yatacağım.","options":[{"id":"A","text":"çünkü"},{"id":"B","text":"bu yüzden"},{"id":"C","text":"ama"},{"id":"D","text":"veya"}],"correct_option_id":"B","explanation":"Bu yüzden expresses a result: I am tired, therefore I will go to bed early."},{"id":"YH1-V58-Q012","section":"10.1","skill_id":"YH1-10-01-S03","type":"single_select","prompt":"Complete with a cause connector: Evde kaldım ___ hastaydım. (I stayed home because I was ill.)","options":[{"id":"A","text":"bu yüzden"},{"id":"B","text":"ama"},{"id":"C","text":"çünkü"},{"id":"D","text":"ve"}],"correct_option_id":"C","explanation":"Çünkü introduces the reason for staying home."},{"id":"YH1-V58-Q013","section":"11.2","skill_id":"YH1-11-04-S02","type":"single_select","prompt":"Complete: Ayşe doktor ___ çalışıyor. (Ayşe works as a doctor.)","options":[{"id":"A","text":"olarak"},{"id":"B","text":"olmak"},{"id":"C","text":"oldu"},{"id":"D","text":"olunca"}],"correct_option_id":"A","explanation":"Doktor olarak means in the role/capacity of a doctor."},{"id":"YH1-V58-Q014","section":"11.2","skill_id":"YH1-11-04-S02","type":"single_select","prompt":"Which phrase expresses someone’s actual occupation as “a translator,” rather than merely resembling a translator?","options":[{"id":"A","text":"çevirmen gibi"},{"id":"B","text":"çevirmen olarak"},{"id":"C","text":"çevirmen olmak"},{"id":"D","text":"çevirmen oldu"}],"correct_option_id":"B","explanation":"Çevirmen olarak expresses the occupational role; gibi means like/as if."},{"id":"YH1-V58-Q015","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S01","type":"single_select","prompt":"Which group contains only Turkish back vowels?","options":[{"id":"A","text":"a, ı, o, u"},{"id":"B","text":"a, e, o, u"},{"id":"C","text":"e, i, ö, ü"},{"id":"D","text":"ı, i, o, u"}],"correct_option_id":"A","explanation":"The four back vowels are a, ı, o and u."},{"id":"YH1-V58-Q016","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S01","type":"single_select","prompt":"Which vowel is a back unrounded vowel?","options":[{"id":"A","text":"ü"},{"id":"B","text":"ö"},{"id":"C","text":"ı"},{"id":"D","text":"i"}],"correct_option_id":"C","explanation":"The back unrounded vowels are a and ı; ı is the only such choice."},{"id":"YH1-V58-Q017","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S02","type":"single_select","prompt":"Complete with the correct locative: sınıf + -DA → ___.","options":[{"id":"A","text":"sınıfda"},{"id":"B","text":"sınıfte"},{"id":"C","text":"sınıfta"},{"id":"D","text":"sınıfde"}],"correct_option_id":"C","explanation":"After voiceless f, -DA becomes -ta; the final vowel ı is back."},{"id":"YH1-V58-Q018","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S02","type":"single_select","prompt":"Complete with the correct locative: ağaç + -DA → ___.","options":[{"id":"A","text":"ağaçda"},{"id":"B","text":"ağaçta"},{"id":"C","text":"ağaçte"},{"id":"D","text":"ağaçde"}],"correct_option_id":"B","explanation":"After voiceless ç, -DA becomes -ta; the final vowel a is back."},{"id":"YH1-V58-Q019","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S01","type":"single_select","prompt":"Complete with the accusative: ağaç + -(y)I → ___.","options":[{"id":"A","text":"ağaçı"},{"id":"B","text":"ağacı"},{"id":"C","text":"ağaca"},{"id":"D","text":"ağaçta"}],"correct_option_id":"B","explanation":"Ağaç softens final ç to c before accusative -ı: ağacı."},{"id":"YH1-V58-Q020","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S01","type":"single_select","prompt":"Complete with the accusative: renk + -(y)I → ___.","options":[{"id":"A","text":"renki"},{"id":"B","text":"rengi"},{"id":"C","text":"renke"},{"id":"D","text":"renkte"}],"correct_option_id":"B","explanation":"Renk takes the accusative as rengi, with final k → g."},{"id":"YH1-V58-Q021","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S01","type":"single_select","prompt":"Complete: anne + third-person singular possessive → ___. (his/her mother)","options":[{"id":"A","text":"annei"},{"id":"B","text":"anneyi"},{"id":"C","text":"annesi"},{"id":"D","text":"annene"}],"correct_option_id":"C","explanation":"After vowel-final anne, third-person possessive uses buffer s: annesi."},{"id":"YH1-V58-Q022","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S01","type":"single_select","prompt":"Complete: oda + third-person singular possessive → ___. (his/her room)","options":[{"id":"A","text":"odayı"},{"id":"B","text":"odası"},{"id":"C","text":"odaı"},{"id":"D","text":"odaya"}],"correct_option_id":"B","explanation":"Oda takes the third-person possessive suffix with buffer s: odası."},{"id":"YH1-V58-Q023","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S02","type":"single_select","prompt":"Choose the neutral, non-emphatic subject–object–verb (SOV) order for “Zeynep is drinking tea.”","options":[{"id":"A","text":"Zeynep çay içiyor."},{"id":"B","text":"Zeynep içiyor çay."},{"id":"C","text":"Çay içiyor Zeynep."},{"id":"D","text":"İçiyor Zeynep çay."}],"correct_option_id":"A","explanation":"The neutral order is subject Zeynep, object çay, verb içiyor; alternatives may be possible in marked contexts."},{"id":"YH1-V58-Q024","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S02","type":"single_select","prompt":"Choose the neutral, non-emphatic subject–object–verb (SOV) order for “We are watching a film.”","options":[{"id":"A","text":"Film izliyoruz biz."},{"id":"B","text":"İzliyoruz biz film."},{"id":"C","text":"Biz izliyoruz film."},{"id":"D","text":"Biz film izliyoruz."}],"correct_option_id":"D","explanation":"Neutral subject–object–verb order is Biz film izliyoruz; other orders can occur for discourse emphasis."},{"id":"YH1-V60-Q001","section":"0","skill_id":"YH1-00-02-S02","type":"single_select","prompt":"Which is the standard Turkish written date for “5 November 2026”?","options":[{"id":"A","text":"11 Kasım 2026"},{"id":"B","text":"5 Kasım 2026"},{"id":"C","text":"Kasım 5, 2026"},{"id":"D","text":"2026 Kasım 5"}],"correct_option_id":"B","explanation":"In the standard written format, the day comes before the month: 5 Kasım 2026."},{"id":"YH1-V60-Q002","section":"0","skill_id":"YH1-00-02-S02","type":"single_select","prompt":"Choose the written date meaning “1 January 2027.”","options":[{"id":"A","text":"1 Ocak 2027"},{"id":"B","text":"1 Şubat 2027"},{"id":"C","text":"Ocak 1 2027"},{"id":"D","text":"2027 Ocak 1"}],"correct_option_id":"A","explanation":"Ocak means January; Turkish dates commonly place the day first."},{"id":"YH1-V60-Q003","section":"1.2","skill_id":"YH1-01-02-S04","type":"single_select","prompt":"Complete the negative nominal predicate: Biz hazır ___. (We are not ready.)","options":[{"id":"A","text":"değiliz"},{"id":"B","text":"değilim"},{"id":"C","text":"değilsin"},{"id":"D","text":"değillerim"}],"correct_option_id":"A","explanation":"Biz hazır değiliz is the first-person plural negative nominal predicate."},{"id":"YH1-V60-Q004","section":"1.2","skill_id":"YH1-01-02-S04","type":"single_select","prompt":"Complete: O öğrenci ___. (He/she is not a student.)","options":[{"id":"A","text":"değilim"},{"id":"B","text":"değil"},{"id":"C","text":"değilsiniz"},{"id":"D","text":"değiliz"}],"correct_option_id":"B","explanation":"The third-person singular negative nominal predicate is değil without a personal ending."},{"id":"YH1-V60-Q005","section":"2.1","skill_id":"YH1-02-01-S04","type":"single_select","prompt":"Choose the present progressive: Ben şimdi seni ___. (I am waiting for you now.)","options":[{"id":"A","text":"bekledim"},{"id":"B","text":"beklerim"},{"id":"C","text":"bekliyorum"},{"id":"D","text":"bekleyeceğim"}],"correct_option_id":"C","explanation":"Beklemek forms the present progressive as bekliyorum, with e → i before -yor."},{"id":"YH1-V60-Q006","section":"2.1","skill_id":"YH1-02-01-S04","type":"single_select","prompt":"Complete the present progressive: Biz şu anda yemeğe ___. (We are starting the meal now.)","options":[{"id":"A","text":"başladık"},{"id":"B","text":"başlıyoruz"},{"id":"C","text":"başlarız"},{"id":"D","text":"başlayacağız"}],"correct_option_id":"B","explanation":"Başlamak forms başlıyoruz in the first-person plural present progressive; the stem-final a narrows to ı."},{"id":"YH1-V60-Q007","section":"2.2","skill_id":"YH1-02-02-S04","type":"single_select","prompt":"Complete: Kitab___ bakıyorum. (I am looking at the book.)","options":[{"id":"A","text":"ı"},{"id":"B","text":"ta"},{"id":"C","text":"a"},{"id":"D","text":"tan"}],"correct_option_id":"C","explanation":"The dative of kitap is kitaba: p softens to b before the vowel-initial -a. The prompt already supplies kitab-."},{"id":"YH1-V60-Q008","section":"2.2","skill_id":"YH1-02-02-S04","type":"single_select","prompt":"Complete: Dolab___ koyuyorum. (I am putting it in the cupboard.)","options":[{"id":"A","text":"ı"},{"id":"B","text":"a"},{"id":"C","text":"ta"},{"id":"D","text":"ın"}],"correct_option_id":"B","explanation":"Dolap becomes dolaba with p → b before dative -a; dolaba koyuyorum means I am putting it into the cupboard."},{"id":"YH1-V60-Q009","section":"2.2","skill_id":"YH1-02-04-S03","type":"single_select","prompt":"Complete: İstanbul’___ geliyorum. (I am coming from Istanbul.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"den"},{"id":"C","text":"tan"},{"id":"D","text":"ten"}],"correct_option_id":"A","explanation":"İstanbul’dan uses -dan because the last vowel u is back and final l is voiced."},{"id":"YH1-V60-Q010","section":"2.2","skill_id":"YH1-02-04-S03","type":"single_select","prompt":"Complete: Ev___ çıkıyorum. (I am leaving the house.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"den"},{"id":"C","text":"tan"},{"id":"D","text":"ten"}],"correct_option_id":"B","explanation":"Evden uses ablative -den after a front vowel and a voiced consonant."},{"id":"YH1-V60-Q011","section":"2.3","skill_id":"YH1-02-05-S04","type":"single_select","prompt":"Complete: Ders___ sonra eve gideceğim. (After class I will go home.)","options":[{"id":"A","text":"te"},{"id":"B","text":"ten"},{"id":"C","text":"e"},{"id":"D","text":"i"}],"correct_option_id":"B","explanation":"Dersten sonra uses ablative -ten following voiceless s."},{"id":"YH1-V60-Q012","section":"2.3","skill_id":"YH1-02-05-S04","type":"single_select","prompt":"Which phrase means “after the meeting”?","options":[{"id":"A","text":"toplantıya sonra"},{"id":"B","text":"toplantıda sonra"},{"id":"C","text":"toplantıdan sonra"},{"id":"D","text":"toplantıyı sonra"}],"correct_option_id":"C","explanation":"Toplantıdan sonra uses the ablative -dan before sonra."},{"id":"YH1-V60-Q013","section":"3.2","skill_id":"YH1-03-02-S03","type":"single_select","prompt":"Which means “Mehmet’s car”?","options":[{"id":"A","text":"Mehmet araba"},{"id":"B","text":"Mehmet’in arabası"},{"id":"C","text":"Mehmet’i araba"},{"id":"D","text":"Mehmet’e arabası"}],"correct_option_id":"B","explanation":"Mehmet’in marks the possessor with genitive; arabası has third-person possessive -sı."},{"id":"YH1-V60-Q014","section":"3.2","skill_id":"YH1-03-02-S03","type":"single_select","prompt":"Which means “the child’s room”?","options":[{"id":"A","text":"çocuğun odası"},{"id":"B","text":"çocuk odası"},{"id":"C","text":"çocuğa oda"},{"id":"D","text":"çocuğu oda"}],"correct_option_id":"A","explanation":"Çocuğun odası has genitive çocuğun and possessive odası; çocuk softens to çocuğ-."},{"id":"YH1-V60-Q015","section":"3.3","skill_id":"YH1-03-04-S03","type":"single_select","prompt":"Which is an adjective + noun phrase meaning “a quiet street”?","options":[{"id":"A","text":"sokak kapısı"},{"id":"B","text":"sessiz sokak"},{"id":"C","text":"şehir merkezi"},{"id":"D","text":"okul bahçesi"}],"correct_option_id":"B","explanation":"Sessiz is an adjective modifying the noun sokak; the other phrases are noun compounds."},{"id":"YH1-V60-Q016","section":"3.3","skill_id":"YH1-03-04-S03","type":"single_select","prompt":"Choose the adjective + noun phrase meaning “an old house.”","options":[{"id":"A","text":"ev kapısı"},{"id":"B","text":"eski ev"},{"id":"C","text":"evin kapısı"},{"id":"D","text":"ev sahibi"}],"correct_option_id":"B","explanation":"Eski modifies ev as an adjective; the other choices are noun constructions."},{"id":"YH1-V60-Q017","section":"4.3","skill_id":"YH1-04-03-S04","type":"single_select","prompt":"Complete the past progressive: Ben dün saat dokuzda kitap ___. (I was reading a book at nine yesterday.)","options":[{"id":"A","text":"okudum"},{"id":"B","text":"okuyacağım"},{"id":"C","text":"okuyordum"},{"id":"D","text":"okurum"}],"correct_option_id":"C","explanation":"Okuyordum is first-person singular past progressive."},{"id":"YH1-V60-Q018","section":"4.3","skill_id":"YH1-04-03-S04","type":"single_select","prompt":"Complete: Onlar dün akşam televizyon ___. (They were watching TV last night.)","options":[{"id":"A","text":"izliyorlardı"},{"id":"B","text":"izleyecekler"},{"id":"C","text":"izlediler"},{"id":"D","text":"izlerler"}],"correct_option_id":"A","explanation":"İzliyorlardı expresses third-person plural past progressive."},{"id":"YH1-V60-Q019","section":"4.3","skill_id":"YH1-04-05-S02","type":"single_select","prompt":"Choose the phrase meaning “coffee and tea.”","options":[{"id":"A","text":"kahve ile çay"},{"id":"B","text":"kahve için çay"},{"id":"C","text":"kahveden çay"},{"id":"D","text":"kahvede çay"}],"correct_option_id":"A","explanation":"İle can coordinate nouns, meaning and, as in kahve ile çay."},{"id":"YH1-V60-Q020","section":"4.3","skill_id":"YH1-04-05-S02","type":"single_select","prompt":"Which sentence means “I went with Ayşe”?","options":[{"id":"A","text":"Ayşe için gittim."},{"id":"B","text":"Ayşe’den gittim."},{"id":"C","text":"Ayşe ile gittim."},{"id":"D","text":"Ayşe’ye gittim."}],"correct_option_id":"C","explanation":"Ayşe ile gittim means “I went with Ayşe.” İle marks accompaniment; Ayşe için means “for Ayşe,” and Ayşe’ye indicates movement toward Ayşe."},{"id":"YH1-V60-Q021","section":"6.3","skill_id":"YH1-06-03-S03","type":"single_select","prompt":"Complete the locative relative: Masa___ kitap benim. (The book on the table is mine.)","options":[{"id":"A","text":"daki"},{"id":"B","text":"deki"},{"id":"C","text":"dan"},{"id":"D","text":"da"}],"correct_option_id":"A","explanation":"Masadaki modifies kitap: masa + da + ki."},{"id":"YH1-V60-Q022","section":"6.3","skill_id":"YH1-06-03-S03","type":"single_select","prompt":"Which phrase means “the person at home”?","options":[{"id":"A","text":"evde insan"},{"id":"B","text":"evdeki kişi"},{"id":"C","text":"eveki kişi"},{"id":"D","text":"evden kişi"}],"correct_option_id":"B","explanation":"Evdeki is the locative relative adjective modifying kişi."},{"id":"YH1-V60-Q023","section":"7.2","skill_id":"YH1-07-02-S02","type":"single_select","prompt":"Choose the future-in-the-past form: Biz gelecektik ama hastalandık. What does gelecektik mean?","options":[{"id":"A","text":"we are coming"},{"id":"B","text":"we came"},{"id":"C","text":"we were going to come"},{"id":"D","text":"we will come"}],"correct_option_id":"C","explanation":"Gelecektik expresses a past plan or expectation to come."},{"id":"YH1-V60-Q024","section":"7.2","skill_id":"YH1-07-02-S02","type":"single_select","prompt":"Complete the past intention: O arayacak___ ama unuttu. (He/she was going to call, but forgot.)","options":[{"id":"A","text":"tı"},{"id":"B","text":"tım"},{"id":"C","text":"tık"},{"id":"D","text":"sın"}],"correct_option_id":"A","explanation":"Arayacaktı expresses a past plan or intention: ara-yacak-tı. The future suffix ends in k, which remains k before the consonant-initial past marker -tı."},{"id":"YH1-V62-Q001","section":"7.2","skill_id":"YH1-07-02-S03","type":"single_select","prompt":"Complete the negative future-in-the-past. Fill only the missing portion before -tik: Biz git___tik. (We were not going to go.)","options":[{"id":"A","text":"meyecek"},{"id":"B","text":"meyeceğ"},{"id":"C","text":"meyecekti"},{"id":"D","text":"meyecektik"}],"correct_option_id":"A","explanation":"Gitmeyecektik = git- + -me + -yecek + -tik. Since -tik is already printed after the blank, choose only -meyecek."},{"id":"YH1-V62-Q002","section":"7.2","skill_id":"YH1-07-02-S03","type":"single_select","prompt":"Which sentence means “She was not going to buy it”?","options":[{"id":"A","text":"Onu almayacaktı."},{"id":"B","text":"Onu almayacak."},{"id":"C","text":"Onu almadı."},{"id":"D","text":"Onu almıyordu."}],"correct_option_id":"A","explanation":"Almayacaktı expresses a negative future intention viewed from the past."},{"id":"YH1-V62-Q003","section":"7.3","skill_id":"YH1-07-04-S03","type":"single_select","prompt":"Complete: ___ göre bu film çok güzel. (In my opinion, this film is very good.)","options":[{"id":"A","text":"Beni"},{"id":"B","text":"Bana"},{"id":"C","text":"Benim"},{"id":"D","text":"Bende"}],"correct_option_id":"B","explanation":"Bana göre means in my opinion; göre requires the dative."},{"id":"YH1-V62-Q004","section":"7.3","skill_id":"YH1-07-04-S03","type":"single_select","prompt":"Which expression means “according to the teacher”?","options":[{"id":"A","text":"öğretmeni göre"},{"id":"B","text":"öğretmenden göre"},{"id":"C","text":"öğretmene göre"},{"id":"D","text":"öğretmenin göre"}],"correct_option_id":"C","explanation":"Öğretmene göre uses the dative ending -e with göre."},{"id":"YH1-V62-Q005","section":"7.3","skill_id":"YH1-07-05-S02","type":"single_select","prompt":"Complete: Bu çanta seninki ___ ağır. (This bag is as heavy as yours.)","options":[{"id":"A","text":"göre"},{"id":"B","text":"kadar"},{"id":"C","text":"sonra"},{"id":"D","text":"önce"}],"correct_option_id":"B","explanation":"Seninki kadar ağır compares equal degree of heaviness."},{"id":"YH1-V62-Q006","section":"7.3","skill_id":"YH1-07-05-S02","type":"single_select","prompt":"Which means “as tall as my brother”?","options":[{"id":"A","text":"kardeşimden uzun"},{"id":"B","text":"kardeşim için uzun"},{"id":"C","text":"kardeşim kadar uzun"},{"id":"D","text":"kardeşime uzun"}],"correct_option_id":"C","explanation":"Kardeşim kadar uzun expresses equal degree with kadar."},{"id":"YH1-V62-Q007","section":"8.1","skill_id":"YH1-08-02-S02","type":"single_select","prompt":"Complete the reported negative nominal predicate: Meğer onlar evde ___ . (Apparently they were not at home.)","options":[{"id":"A","text":"değiller"},{"id":"B","text":"değilmişler"},{"id":"C","text":"değildiler"},{"id":"D","text":"değiliz"}],"correct_option_id":"B","explanation":"Değilmişler expresses an inferred or reported negative nominal predicate for onlar."},{"id":"YH1-V62-Q008","section":"8.1","skill_id":"YH1-08-02-S02","type":"single_select","prompt":"Which sentence means “Apparently the shop was not open”?","options":[{"id":"A","text":"Dükkân açık değil."},{"id":"B","text":"Dükkân açık değildi."},{"id":"C","text":"Dükkân açık değilmiş."},{"id":"D","text":"Dükkân açık olmayacak."}],"correct_option_id":"C","explanation":"Değilmiş marks a reported or newly discovered negative nominal predicate."},{"id":"YH1-V62-Q009","section":"8.1","skill_id":"YH1-08-02-S03","type":"single_select","prompt":"Which reported/inferred nominal question means “Was Ali apparently sick?”","options":[{"id":"A","text":"Ali hasta mı?"},{"id":"B","text":"Ali hasta mıydı?"},{"id":"C","text":"Ali hasta mıymış?"},{"id":"D","text":"Ali hasta mısın?"}],"correct_option_id":"C","explanation":"Ali hasta mıymış? uses the separate question particle mı followed by the reported/inferred past form -ymış. The other options ask about a present or directly known past condition, or address “you.”"},{"id":"YH1-V62-Q010","section":"8.1","skill_id":"YH1-08-02-S03","type":"single_select","prompt":"Complete the reported nominal question: Bu ev eski ___? (Was this house apparently old?)","options":[{"id":"A","text":"miydi"},{"id":"B","text":"miymiş"},{"id":"C","text":"midir"},{"id":"D","text":"misiniz"}],"correct_option_id":"B","explanation":"Eski miymiş? asks whether it was reportedly or apparently old."},{"id":"YH1-V62-Q011","section":"8.2","skill_id":"YH1-08-03-S02","type":"single_select","prompt":"Choose the negative reported present progressive: O şimdi çalış___ . (Apparently he/she is not working now.)","options":[{"id":"A","text":"mıyormuş"},{"id":"B","text":"miyormuş"},{"id":"C","text":"muyormuş"},{"id":"D","text":"muyormuştu"}],"correct_option_id":"A","explanation":"Çalışmıyormuş is çalış- + -mı- + -yor + -muş."},{"id":"YH1-V62-Q012","section":"8.2","skill_id":"YH1-08-03-S02","type":"single_select","prompt":"Which sentence means “Apparently they are not coming”?","options":[{"id":"A","text":"Onlar gelmediler."},{"id":"B","text":"Onlar gelmeyecekler."},{"id":"C","text":"Onlar gelmiyorlarmış."},{"id":"D","text":"Onlar gelmiyorlar mı?"}],"correct_option_id":"C","explanation":"Gelmiyorlarmış is the negative reported present progressive."},{"id":"YH1-V62-Q013","section":"8.2","skill_id":"YH1-08-03-S03","type":"single_select","prompt":"Which question uses the reported/inferred form to ask whether he was NOT coming?","options":[{"id":"A","text":"Gelmiyor muymuş?"},{"id":"B","text":"Gelmedi mi?"},{"id":"C","text":"Gelmeyecek mi?"},{"id":"D","text":"Gelmiyor muydu?"}],"correct_option_id":"A","explanation":"Gelmiyor muymuş? asks whether he apparently was not coming: gel-mi-yor (negative progressive) + muymuş (reported question). Gelmiyor muydu? instead asks directly about the past."},{"id":"YH1-V62-Q014","section":"8.2","skill_id":"YH1-08-03-S03","type":"single_select","prompt":"Complete the reported progressive question: Yağmur yağıyor ___? (Was it apparently raining?)","options":[{"id":"A","text":"muydu"},{"id":"B","text":"muymuş"},{"id":"C","text":"miydi"},{"id":"D","text":"miyormuş"}],"correct_option_id":"B","explanation":"Yağıyor muymuş? is the reported present-progressive question; the particle is mu after -yor."},{"id":"YH1-V62-Q015","section":"8.2","skill_id":"YH1-08-04-S03","type":"single_select","prompt":"Which asks “Was she apparently going to leave?” using the reported future?","options":[{"id":"A","text":"Ayrılıyor mu?"},{"id":"B","text":"Ayrılacak mıymış?"},{"id":"C","text":"Ayrıldı mı?"},{"id":"D","text":"Ayrılacak mıydı?"}],"correct_option_id":"B","explanation":"Ayrılacak mıymış? uses future -acak and reported question miymiş."},{"id":"YH1-V62-Q016","section":"8.2","skill_id":"YH1-08-04-S03","type":"single_select","prompt":"Complete: Toplantı yarın başlayacak ___? (Was the meeting apparently going to start tomorrow?)","options":[{"id":"A","text":"mıymış"},{"id":"B","text":"miymiş"},{"id":"C","text":"miydi"},{"id":"D","text":"mısın"}],"correct_option_id":"A","explanation":"Başlayacak mıymış? uses mı after the back vowel a in -acak."},{"id":"YH1-V62-Q017","section":"9.1","skill_id":"YH1-09-01-S05","type":"single_select","prompt":"Choose the first-person singular aorist: Ben hafta sonları erken ___. (I get up early on weekends.)","options":[{"id":"A","text":"kalktım"},{"id":"B","text":"kalkarım"},{"id":"C","text":"kalkıyorum"},{"id":"D","text":"kalkacağım"}],"correct_option_id":"B","explanation":"Kalkarım is the first-person singular aorist of kalkmak."},{"id":"YH1-V62-Q018","section":"9.1","skill_id":"YH1-09-01-S05","type":"single_select","prompt":"Complete the habitual sentence: O her sabah çay ___. (He/she drinks tea every morning.)","options":[{"id":"A","text":"içti"},{"id":"B","text":"içecek"},{"id":"C","text":"içer"},{"id":"D","text":"içiyor"}],"correct_option_id":"C","explanation":"İçer is the third-person singular aorist, appropriate for a repeated habit."},{"id":"YH1-V62-Q019","section":"9.2","skill_id":"YH1-09-02-S03","type":"single_select","prompt":"Choose the ability form: Biz yarın size yardım ___. (We can help you tomorrow.)","options":[{"id":"A","text":"edebilirim"},{"id":"B","text":"edebiliriz"},{"id":"C","text":"edebilirsiniz"},{"id":"D","text":"edebilirler"}],"correct_option_id":"B","explanation":"Yardım edebiliriz is first-person plural ability."},{"id":"YH1-V62-Q020","section":"9.2","skill_id":"YH1-09-02-S03","type":"single_select","prompt":"Complete: Biz bu soruyu çözebil___ . (We can solve this question.)","options":[{"id":"A","text":"irim"},{"id":"B","text":"irsin"},{"id":"C","text":"iriz"},{"id":"D","text":"irler"}],"correct_option_id":"C","explanation":"Çözebiliriz combines ability with first-person plural -iz."},{"id":"YH1-V62-Q021","section":"9.3","skill_id":"YH1-09-03-S03","type":"single_select","prompt":"Complete the past negative habit: Çocukken kahve iç___ . (I did not use to drink coffee as a child.)","options":[{"id":"A","text":"medim"},{"id":"B","text":"mezdim"},{"id":"C","text":"miyorum"},{"id":"D","text":"meyeceğim"}],"correct_option_id":"B","explanation":"İçmezdim expresses a negative past habit."},{"id":"YH1-V62-Q022","section":"9.3","skill_id":"YH1-09-03-S03","type":"single_select","prompt":"Which sentence means “We did not use to go there”?","options":[{"id":"A","text":"Oraya gitmeyeceğiz."},{"id":"B","text":"Oraya gitmedik."},{"id":"C","text":"Oraya gitmezdik."},{"id":"D","text":"Oraya gitmiyoruz."}],"correct_option_id":"C","explanation":"Gitmezdik is the first-person plural negative aorist in the past."},{"id":"YH1-V62-Q023","section":"9.3","skill_id":"YH1-09-04-S01","type":"single_select","prompt":"Complete the reported past habit: Dedemin anlattığına göre, eskiden burada kar yağar___ . (According to my grandfather, it apparently used to snow here.)","options":[{"id":"A","text":"mış"},{"id":"B","text":"ıyor"},{"id":"C","text":"acak"},{"id":"D","text":"dı"}],"correct_option_id":"A","explanation":"Yağarmış combines the aorist -ar with the reported/inferred past -mış. The grandfather’s account supplies the reported-information context."},{"id":"YH1-V62-Q024","section":"9.3","skill_id":"YH1-09-04-S01","type":"single_select","prompt":"Which sentence reports that someone apparently used to walk to school?","options":[{"id":"A","text":"Okula yürürmüş."},{"id":"B","text":"Okula yürüyor."},{"id":"C","text":"Okula yürüdü."},{"id":"D","text":"Okula yürüyecek."}],"correct_option_id":"A","explanation":"Yürürmüş is the reported aorist, expressing a habit known from a report."},{"id":"YH1-V64-Q001","section":"9.3","skill_id":"YH1-09-04-S03","type":"single_select","prompt":"Complete the negative reported habitual form: Eskiden et yemez___. (Apparently he/she did not use to eat meat.)","options":[{"id":"A","text":"di"},{"id":"B","text":"miş"},{"id":"C","text":"yor"},{"id":"D","text":"cek"}],"correct_option_id":"B","explanation":"Yemezmiş combines negative habitual -mez with reported past -miş."},{"id":"YH1-V64-Q002","section":"9.3","skill_id":"YH1-09-04-S03","type":"single_select","prompt":"Which sentence means “Apparently she never used to smoke”?","options":[{"id":"A","text":"Hiç sigara içmezmiş."},{"id":"B","text":"Hiç sigara içmiyor."},{"id":"C","text":"Hiç sigara içmedi."},{"id":"D","text":"Hiç sigara içmeyecek."}],"correct_option_id":"A","explanation":"İçmezmiş reports a negative former habit learned indirectly."},{"id":"YH1-V64-Q003","section":"10.1","skill_id":"YH1-10-02-S01","type":"single_select","prompt":"Choose the phrase meaning “the window of the teacher’s office”.","options":[{"id":"A","text":"öğretmenin odanın penceresi"},{"id":"B","text":"öğretmenin odasının penceresi"},{"id":"C","text":"öğretmen odası pencere"},{"id":"D","text":"öğretmene odasının penceresi"}],"correct_option_id":"B","explanation":"Öğretmenin odasının penceresi has genitive–possessive marking at both links."},{"id":"YH1-V64-Q004","section":"10.1","skill_id":"YH1-10-02-S01","type":"single_select","prompt":"Complete the phrase: okulun bahçe___ kapısı (the gate of the school’s garden).","options":[{"id":"A","text":"si"},{"id":"B","text":"sinin"},{"id":"C","text":"sine"},{"id":"D","text":"sinde"}],"correct_option_id":"B","explanation":"Bahçesinin marks the school garden as the possessor of the gate: okulun bahçesinin kapısı."},{"id":"YH1-V64-Q005","section":"10.2","skill_id":"YH1-10-03-S03","type":"single_select","prompt":"Complete the possessive verbal noun agreeing with senin: Senin burada kal___ iyi olur. (It would be good for you to stay here.)","options":[{"id":"A","text":"mam"},{"id":"B","text":"man"},{"id":"C","text":"ması"},{"id":"D","text":"mak"}],"correct_option_id":"B","explanation":"Kalman is the nominalized verb kal-ma with second-person possessive -n."},{"id":"YH1-V64-Q006","section":"10.2","skill_id":"YH1-10-03-S03","type":"single_select","prompt":"Choose the unmarked (non-accusative) possessive verbal-noun phrase for “your leaving early” (addressing one person). The subject is senin.","options":[{"id":"A","text":"senin erken gitmem"},{"id":"B","text":"senin erken gitmesi"},{"id":"C","text":"senin erken gitmen"},{"id":"D","text":"senin erken gitmeni"}],"correct_option_id":"C","explanation":"Senin (your) requires second-person singular agreement on the verbal noun: git-me-n → gitmen. Gitmeni has an additional accusative -i and is grammatical in some contexts, but not the unmarked form requested."},{"id":"YH1-V64-Q007","section":"10.2","skill_id":"YH1-10-04-S02","type":"single_select","prompt":"Complete: Doktorla konuşmak ___ hastaneye gittim. (I went to the hospital to speak with the doctor.)","options":[{"id":"A","text":"kadar"},{"id":"B","text":"üzere"},{"id":"C","text":"sonra"},{"id":"D","text":"önce"}],"correct_option_id":"B","explanation":"Konuşmak üzere marks the purpose of the hospital visit: “I went to the hospital in order to speak with the doctor.” The alternatives kadar, sonra, and önce do not form the intended purpose construction here."},{"id":"YH1-V64-Q008","section":"10.2","skill_id":"YH1-10-04-S02","type":"single_select","prompt":"Which expression means “in order to learn Turkish” using -mek üzere?","options":[{"id":"A","text":"Türkçe öğrendikten sonra"},{"id":"B","text":"Türkçe öğrenmek üzere"},{"id":"C","text":"Türkçe öğrenmeden önce"},{"id":"D","text":"Türkçe öğrendiği için"}],"correct_option_id":"B","explanation":"Öğrenmek üzere is the infinitive followed by üzere, expressing purpose."},{"id":"YH1-V64-Q009","section":"10.3","skill_id":"YH1-10-05-S03","type":"single_select","prompt":"Complete: Kitabı oku___ sonra uyudum. (After reading the book, I slept.)","options":[{"id":"A","text":"madan"},{"id":"B","text":"yacak"},{"id":"C","text":"duktan"},{"id":"D","text":"yarak"}],"correct_option_id":"C","explanation":"Okuduktan sonra means after reading; oku- takes -duktan."},{"id":"YH1-V64-Q010","section":"10.3","skill_id":"YH1-10-05-S03","type":"single_select","prompt":"Which sentence means “We ate after the film ended”?","options":[{"id":"A","text":"Film bitmeden önce yemek yedik."},{"id":"B","text":"Film biterken yemek yedik."},{"id":"C","text":"Film bittikten sonra yemek yedik."},{"id":"D","text":"Film bitinceye kadar yemek yedik."}],"correct_option_id":"C","explanation":"Bittikten sonra marks an event completed before the next action."},{"id":"YH1-V64-Q011","section":"10.3","skill_id":"YH1-10-06-S02","type":"single_select","prompt":"Complete: Yemek ye___ önce ellerini yıka. (Wash your hands before eating.)","options":[{"id":"A","text":"dikten"},{"id":"B","text":"meden"},{"id":"C","text":"yerek"},{"id":"D","text":"yecek"}],"correct_option_id":"B","explanation":"Ye- (eat) + -meden + önce yields yemeden önce (“before eating”). The negative converb -mAdAn plus önce expresses “before doing.”"},{"id":"YH1-V64-Q012","section":"10.3","skill_id":"YH1-10-06-S02","type":"single_select","prompt":"Which means “before sleeping”?","options":[{"id":"A","text":"uyuduktan sonra"},{"id":"B","text":"uyurken"},{"id":"C","text":"uyumadan önce"},{"id":"D","text":"uyumak üzere"}],"correct_option_id":"C","explanation":"Uyumadan önce combines -madan with önce to mean before sleeping."},{"id":"YH1-V64-Q013","section":"11.1","skill_id":"YH1-11-01-S03","type":"single_select","prompt":"Complete: Kapıyı aç___ içeri girdim. (I opened the door and entered.)","options":[{"id":"A","text":"ıp"},{"id":"B","text":"ip"},{"id":"C","text":"up"},{"id":"D","text":"üp"}],"correct_option_id":"A","explanation":"Açıp uses the converb -ıp after the back unrounded vowel a."},{"id":"YH1-V64-Q014","section":"11.1","skill_id":"YH1-11-01-S03","type":"single_select","prompt":"Complete: Eve gel___ yemek yaptım. (I came home and cooked.)","options":[{"id":"A","text":"ıp"},{"id":"B","text":"up"},{"id":"C","text":"üp"},{"id":"D","text":"ip"}],"correct_option_id":"D","explanation":"Gelip takes -ip after the front unrounded vowel e."},{"id":"YH1-V64-Q015","section":"11.1","skill_id":"YH1-11-02-S02","type":"single_select","prompt":"Complete: Hiç konuş___ odadan çıktı. (He/she left the room without speaking.)","options":[{"id":"A","text":"arak"},{"id":"B","text":"madan"},{"id":"C","text":"duktan"},{"id":"D","text":"up"}],"correct_option_id":"B","explanation":"Konuşmadan is konuş- (speak) + -madan (“without speaking”). Hiç reinforces that no speaking took place."},{"id":"YH1-V64-Q016","section":"11.1","skill_id":"YH1-11-02-S02","type":"single_select","prompt":"Which means “without looking”?","options":[{"id":"A","text":"bakarak"},{"id":"B","text":"bakıp"},{"id":"C","text":"bakmadan"},{"id":"D","text":"baktıktan sonra"}],"correct_option_id":"C","explanation":"Bakmadan is the negative converb expressing without looking."},{"id":"YH1-V64-Q017","section":"11.2","skill_id":"YH1-11-03-S03","type":"single_select","prompt":"Complete: Çocuk gül___ odaya girdi. (The child entered the room laughing.)","options":[{"id":"A","text":"erek"},{"id":"B","text":"arak"},{"id":"C","text":"madan"},{"id":"D","text":"ıp"}],"correct_option_id":"A","explanation":"Gülerek uses -erek after the front vowel ü."},{"id":"YH1-V64-Q018","section":"11.2","skill_id":"YH1-11-03-S03","type":"single_select","prompt":"Which means “walking” as a manner of movement?","options":[{"id":"A","text":"yürüyerek"},{"id":"B","text":"yürümeden"},{"id":"C","text":"yürüdükten"},{"id":"D","text":"yürümek üzere"}],"correct_option_id":"A","explanation":"Yürüyerek is the manner converb of yürümek."},{"id":"YH1-V64-Q019","section":"12.1","skill_id":"YH1-12-01-S03","type":"single_select","prompt":"Choose the grammatical sentence in which an infinitive functions as the subject and means “Reading is useful.”","options":[{"id":"A","text":"Okuyor faydalıdır."},{"id":"B","text":"Okudu faydalıdır."},{"id":"C","text":"Okumak faydalıdır."},{"id":"D","text":"Okuyacak faydalıdır."}],"correct_option_id":"C","explanation":"Okumak is an infinitive nominal subject."},{"id":"YH1-V64-Q020","section":"12.1","skill_id":"YH1-12-01-S03","type":"single_select","prompt":"Complete: Her gün yürü___ sağlıklıdır. (Walking every day is healthy.)","options":[{"id":"A","text":"mek"},{"id":"B","text":"yor"},{"id":"C","text":"dü"},{"id":"D","text":"yecek"}],"correct_option_id":"A","explanation":"The verb stem yürü- takes the infinitive ending -mek: yürümek (“to walk” or “walking”). In Her gün yürümek sağlıklıdır, the infinitive phrase functions as the subject."},{"id":"YH1-V64-Q021","section":"12.2","skill_id":"YH1-12-02-S01","type":"single_select","prompt":"Complete: Senin konuş___ çok güzel. (Your speaking is very nice.)","options":[{"id":"A","text":"mam"},{"id":"B","text":"man"},{"id":"C","text":"ması"},{"id":"D","text":"mak"}],"correct_option_id":"B","explanation":"Konuşman is the second-person possessive verbal noun."},{"id":"YH1-V64-Q022","section":"12.2","skill_id":"YH1-12-02-S01","type":"single_select","prompt":"Which phrase means “your reading the book” (addressing one person)?","options":[{"id":"A","text":"senin kitabı okuman"},{"id":"B","text":"senin kitabı okumam"},{"id":"C","text":"senin kitabı okuması"},{"id":"D","text":"senin kitabı okumak"}],"correct_option_id":"A","explanation":"Senin okuman agrees with the second-person genitive subject."},{"id":"YH1-V64-Q023","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S02","type":"single_select","prompt":"Choose the plural ending for şehir (city).","options":[{"id":"A","text":"-lar"},{"id":"B","text":"-ler"},{"id":"C","text":"-lur"},{"id":"D","text":"-lir"}],"correct_option_id":"B","explanation":"The last vowel i is front, so şehir takes -ler: şehirler."},{"id":"YH1-V64-Q024","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S02","type":"single_select","prompt":"Which is the correct plural of çocuk (child)?","options":[{"id":"A","text":"çocukler"},{"id":"B","text":"çocuklir"},{"id":"C","text":"çocuklar"},{"id":"D","text":"çocuklur"}],"correct_option_id":"C","explanation":"The last vowel u is back, selecting -lar: çocuklar."},{"id":"YH1-V66-Q001","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S01","type":"single_select","prompt":"Which of these Turkish consonants is voiceless (unvoiced)?","options":[{"id":"A","text":"z"},{"id":"B","text":"v"},{"id":"C","text":"ş"},{"id":"D","text":"m"}],"correct_option_id":"C","explanation":"Ş is voiceless; z, v, and m are voiced."},{"id":"YH1-V66-Q002","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S01","type":"single_select","prompt":"Which noun takes -ta (rather than -da) in the locative singular?","options":[{"id":"A","text":"kitap"},{"id":"B","text":"ev"},{"id":"C","text":"okul"},{"id":"D","text":"masa"}],"correct_option_id":"A","explanation":"Kitap ends in voiceless p, so kitap + -DA → kitapta. Ev, okul, and masa take -de/-da instead (evde, okulda, masada)."},{"id":"YH1-V66-Q003","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S01","type":"single_select","prompt":"Complete: burun + your (singular) → ___.","options":[{"id":"A","text":"burunun"},{"id":"B","text":"burnun"},{"id":"C","text":"burnün"},{"id":"D","text":"burunın"}],"correct_option_id":"B","explanation":"Burun loses its second vowel before the second-person singular possessive: burnun."},{"id":"YH1-V66-Q004","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S01","type":"single_select","prompt":"Complete: karın (belly) + my → ___.","options":[{"id":"A","text":"karınım"},{"id":"B","text":"karnım"},{"id":"C","text":"karınum"},{"id":"D","text":"karnum"}],"correct_option_id":"B","explanation":"Karın undergoes vowel deletion before the possessive suffix: karnım."},{"id":"YH1-V66-Q005","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S03","type":"single_select","prompt":"Complete: ağız + my → ___.","options":[{"id":"A","text":"ağzım"},{"id":"B","text":"ağızım"},{"id":"C","text":"ağzum"},{"id":"D","text":"ağızımın"}],"correct_option_id":"A","explanation":"Ağız loses its second vowel before the first-person possessive ending: ağzım."},{"id":"YH1-V66-Q006","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S03","type":"single_select","prompt":"Complete: ağız + dative → ___.","options":[{"id":"A","text":"ağıza"},{"id":"B","text":"ağza"},{"id":"C","text":"ağzı"},{"id":"D","text":"ağızda"}],"correct_option_id":"B","explanation":"Before the vowel-initial dative suffix, ağız loses its second vowel: ağza."},{"id":"YH1-V66-Q007","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S02","type":"single_select","prompt":"Complete: şu + accusative → ___.","options":[{"id":"A","text":"şuyu"},{"id":"B","text":"şunu"},{"id":"C","text":"şuda"},{"id":"D","text":"şuna"}],"correct_option_id":"B","explanation":"The demonstrative pronoun şu takes the linking n before the accusative -u: şu + n + u → şunu. Şuna is dative, not accusative."},{"id":"YH1-V66-Q008","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S02","type":"single_select","prompt":"Complete: o + ablative → ___.","options":[{"id":"A","text":"odan"},{"id":"B","text":"ondan"},{"id":"C","text":"ona"},{"id":"D","text":"onda"}],"correct_option_id":"B","explanation":"The demonstrative o uses pronominal n before the ablative suffix: ondan."},{"id":"YH1-V66-Q009","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S01","type":"single_select","prompt":"Choose the correct bare adjective–noun phrase meaning “an old house” (not a complete sentence).","options":[{"id":"A","text":"ev eski"},{"id":"B","text":"eski ev"},{"id":"C","text":"eskiyi ev"},{"id":"D","text":"evin eski"}],"correct_option_id":"B","explanation":"In a bare adjective–noun phrase, the adjective precedes the noun: eski ev."},{"id":"YH1-V66-Q010","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S01","type":"single_select","prompt":"Choose the correct bare adjective–noun phrase meaning “a small garden” (not a complete sentence).","options":[{"id":"A","text":"bahçe küçük"},{"id":"B","text":"küçük bahçe"},{"id":"C","text":"küçüğü bahçe"},{"id":"D","text":"bahçenin küçük"}],"correct_option_id":"B","explanation":"Küçük modifies the noun bahçe and precedes it."},{"id":"YH1-V66-Q011","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S03","type":"single_select","prompt":"In “çok eski kitap”, which word is the head noun?","options":[{"id":"A","text":"çok"},{"id":"B","text":"eski"},{"id":"C","text":"kitap"},{"id":"D","text":"çok eski"}],"correct_option_id":"C","explanation":"Kitap is the head noun; çok eski modifies it."},{"id":"YH1-V66-Q012","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S03","type":"single_select","prompt":"In “oldukça büyük bahçe”, which word is the head noun?","options":[{"id":"A","text":"bahçe"},{"id":"B","text":"büyük"},{"id":"C","text":"oldukça"},{"id":"D","text":"oldukça büyük"}],"correct_option_id":"A","explanation":"Bahçe is the head noun, modified by oldukça büyük."},{"id":"YH1-V66-Q013","section":"2.3","skill_id":"YH1-02-TIME-S03","type":"single_select","prompt":"Which expression means “It is half past seven”?","options":[{"id":"A","text":"Saat yedi buçuk."},{"id":"B","text":"Saat yediye çeyrek var."},{"id":"C","text":"Saat sekiz buçuk."},{"id":"D","text":"Saat yediyi çeyrek geçiyor."}],"correct_option_id":"A","explanation":"Saat yedi buçuk means 7:30. Yediye çeyrek var is 6:45; yediyi çeyrek geçiyor is 7:15; sekiz buçuk is 8:30."},{"id":"YH1-V66-Q014","section":"2.3","skill_id":"YH1-02-TIME-S03","type":"single_select","prompt":"Which expression means “It is half past nine”?","options":[{"id":"A","text":"Saat ona çeyrek var."},{"id":"B","text":"Saat dokuzu çeyrek geçiyor."},{"id":"C","text":"Saat dokuz buçuk."},{"id":"D","text":"Saat on buçuk."}],"correct_option_id":"C","explanation":"Saat dokuz buçuk means 9:30."},{"id":"YH1-V66-Q015","section":"5.2","skill_id":"YH1-05-03-S02","type":"single_select","prompt":"Complete the first-person plural suggestion: Akşam film izle___! (Let’s watch a film tonight.)","options":[{"id":"A","text":"yelim"},{"id":"B","text":"yeyim"},{"id":"C","text":"sin"},{"id":"D","text":"yecek"}],"correct_option_id":"A","explanation":"İzleyelim is the first-person plural optative of izlemek."},{"id":"YH1-V66-Q016","section":"5.2","skill_id":"YH1-05-03-S02","type":"single_select","prompt":"Which sentence makes the suggestion “Let’s eat together”?","options":[{"id":"A","text":"Birlikte yiyelim."},{"id":"B","text":"Birlikte yiyorum."},{"id":"C","text":"Birlikte yedim."},{"id":"D","text":"Birlikte yiyeceksin."}],"correct_option_id":"A","explanation":"Yiyelim is the first-person plural optative, used to suggest a joint action."},{"id":"YH1-V66-Q017","section":"5.2","skill_id":"YH1-05-03-S03","type":"single_select","prompt":"Which sentence means “Let’s not wait”?","options":[{"id":"A","text":"Beklemiyoruz."},{"id":"B","text":"Beklemeyelim."},{"id":"C","text":"Beklemedik."},{"id":"D","text":"Beklemeyiz."}],"correct_option_id":"B","explanation":"Beklemeyelim is the negative first-person plural optative."},{"id":"YH1-V66-Q018","section":"5.2","skill_id":"YH1-05-03-S03","type":"single_select","prompt":"Complete the negative suggestion: Bugün dışarı çık___! (Let’s not go out today.)","options":[{"id":"A","text":"mayalım"},{"id":"B","text":"mıyoruz"},{"id":"C","text":"madık"},{"id":"D","text":"mayacak"}],"correct_option_id":"A","explanation":"Çıkmayalım is the negative first-person plural optative of çıkmak."},{"id":"YH1-V66-Q019","section":"7.3","skill_id":"YH1-07-03-S02","type":"single_select","prompt":"Which word means “in German” (as a language)?","options":[{"id":"A","text":"Almanca"},{"id":"B","text":"Almanlı"},{"id":"C","text":"Almandan"},{"id":"D","text":"Almansız"}],"correct_option_id":"A","explanation":"Almanca is the language name formed from Alman with -ca."},{"id":"YH1-V66-Q020","section":"7.3","skill_id":"YH1-07-03-S02","type":"single_select","prompt":"Which word means “in English” (as a language)?","options":[{"id":"A","text":"İngilizli"},{"id":"B","text":"İngilizden"},{"id":"C","text":"İngilizce"},{"id":"D","text":"İngilizlik"}],"correct_option_id":"C","explanation":"İngilizce is the language name with -ce."},{"id":"YH1-V66-Q021","section":"7.3","skill_id":"YH1-07-05-S03","type":"single_select","prompt":"Choose the sentence meaning “This bag is as heavy as that bag.”","options":[{"id":"A","text":"Bu çanta o çantadan ağır."},{"id":"B","text":"Bu çanta o çanta kadar ağır."},{"id":"C","text":"Bu çanta o çantaya ağır."},{"id":"D","text":"Bu çanta o çantada ağır."}],"correct_option_id":"B","explanation":"Kadar marks equality of degree: o çanta kadar ağır."},{"id":"YH1-V66-Q022","section":"7.3","skill_id":"YH1-07-05-S03","type":"single_select","prompt":"Choose the sentence meaning “My brother is as tall as me.”","options":[{"id":"A","text":"Kardeşim benden uzun."},{"id":"B","text":"Kardeşim bana uzun."},{"id":"C","text":"Kardeşim benim kadar uzun."},{"id":"D","text":"Kardeşim bende uzun."}],"correct_option_id":"C","explanation":"Benim kadar uzun expresses equality of height."},{"id":"YH1-V66-Q023","section":"8.3","skill_id":"YH1-08-05-S01","type":"single_select","prompt":"Zeynep is not answering her phone. Which sentence uses the third-person predicate ending -DIr to express a possible supposition about her location?","options":[{"id":"A","text":"Zeynep dün evdeydi."},{"id":"B","text":"Zeynep şimdi evdedir."},{"id":"C","text":"Zeynep evde değil."},{"id":"D","text":"Zeynep eve gidiyor mu?"}],"correct_option_id":"B","explanation":"Zeynep şimdi evdedir includes -dir, which may suggest “Zeynep is probably at home now” in an appropriate context. It may also be a formal assertion; the ending is not exclusively inferential."},{"id":"YH1-V66-Q024","section":"8.3","skill_id":"YH1-08-05-S01","type":"single_select","prompt":"Choose the sentence that uses the third-person predicate ending -DIr to make a present-time statement about cold weather.","options":[{"id":"A","text":"Dün hava soğuktu."},{"id":"B","text":"Hava soğuk değil."},{"id":"C","text":"Hava soğuk mudur?"},{"id":"D","text":"Şimdi hava soğuktur."}],"correct_option_id":"D","explanation":"Şimdi hava soğuktur uses -tur, the voiceless-consonant variant of -DIr. It is a present-time predicate and may sound formal or categorical; this item identifies the suffix, not a uniquely inferential meaning."},{"id":"YH1-V68-Q001","section":"8.3","skill_id":"YH1-08-05-S03","type":"single_select","prompt":"Complete the formal third-person predicate: Bu cevap doğru___. (This answer is correct.)","options":[{"id":"A","text":"dur"},{"id":"B","text":"yuz"},{"id":"C","text":"sunuz"},{"id":"D","text":"lar"}],"correct_option_id":"A","explanation":"Doğrudur uses the third-person formal/assertive suffix -dur after the vowel-final adjective doğru."},{"id":"YH1-V68-Q002","section":"8.3","skill_id":"YH1-08-05-S03","type":"single_select","prompt":"Choose the formal third-person statement meaning “The room is clean.”","options":[{"id":"A","text":"Oda temizim."},{"id":"B","text":"Oda temizdir."},{"id":"C","text":"Oda temizsiniz."},{"id":"D","text":"Oda temiziz."}],"correct_option_id":"B","explanation":"Temizdir uses -dir for a formal third-person statement."},{"id":"YH1-V68-Q003","section":"9.3","skill_id":"YH1-09-04-S02","type":"single_select","prompt":"According to what people say, Ali used to swim every summer. Choose the reported-habitual sentence.","options":[{"id":"A","text":"Ali her yaz yüzermiş."},{"id":"B","text":"Ali her yaz yüzüyor."},{"id":"C","text":"Ali her yaz yüzecek."},{"id":"D","text":"Ali her yaz yüzdü."}],"correct_option_id":"A","explanation":"Yüzermiş combines the aorist habitual -er with reported -miş."},{"id":"YH1-V68-Q004","section":"9.3","skill_id":"YH1-09-04-S02","type":"single_select","prompt":"Complete the reported habitual: Duyduğuma göre eskiden burada çalış___ . (Apparently, he/she used to work here.)","options":[{"id":"A","text":"acak"},{"id":"B","text":"ıyor"},{"id":"C","text":"ırmış"},{"id":"D","text":"tı"}],"correct_option_id":"C","explanation":"Çalışırmış reports a habitual activity learned from another source."},{"id":"YH1-V68-Q005","section":"10.1","skill_id":"YH1-10-02-S02","type":"single_select","prompt":"Choose “my sister’s room’s window.”","options":[{"id":"A","text":"kız kardeşimin odasının penceresi"},{"id":"B","text":"kız kardeşimin odası pencere"},{"id":"C","text":"kız kardeşime odanın penceresi"},{"id":"D","text":"kız kardeşimin odayı penceresi"}],"correct_option_id":"A","explanation":"Kız kardeşimin odasının penceresi nests two genitive–possessive relationships."},{"id":"YH1-V68-Q006","section":"10.1","skill_id":"YH1-10-02-S02","type":"single_select","prompt":"Which phrase means “the color of my father’s car”?","options":[{"id":"A","text":"babamın arabaya rengi"},{"id":"B","text":"babamın araba renk"},{"id":"C","text":"babamın arabasının rengi"},{"id":"D","text":"babamın arabasını renk"}],"correct_option_id":"C","explanation":"Babamın arabasının rengi marks the nested possessive relationships."},{"id":"YH1-V68-Q007","section":"10.2","skill_id":"YH1-10-03-S02","type":"single_select","prompt":"Choose the sentence that explicitly says “I am glad YOU came” (not I or someone else).","options":[{"id":"A","text":"Benim gelmeme sevindim."},{"id":"B","text":"Senin gelmene sevindim."},{"id":"C","text":"Onun gelmesine sevindim."},{"id":"D","text":"Gelmek sevindim."}],"correct_option_id":"B","explanation":"Senin gelmene makes the second-person subject of the nominalized action explicit."},{"id":"YH1-V68-Q008","section":"10.2","skill_id":"YH1-10-03-S02","type":"single_select","prompt":"Complete the second-person singular possessive verbal noun: Senin erken kalk___ gerekiyor. (You need to get up early.)","options":[{"id":"A","text":"mam"},{"id":"B","text":"ması"},{"id":"C","text":"man"},{"id":"D","text":"mak"}],"correct_option_id":"C","explanation":"Senin is the second-person singular genitive subject; kalk-ma-n is the matching possessive verbal noun. The full sentence is Senin erken kalkman gerekiyor."},{"id":"YH1-V68-Q009","section":"10.2","skill_id":"YH1-10-04-S03","type":"single_select","prompt":"The train is about to depart. Choose the correct sentence.","options":[{"id":"A","text":"Tren hareket etmek üzere."},{"id":"B","text":"Tren hareket ettikten sonra."},{"id":"C","text":"Tren hareket etmeden önce."},{"id":"D","text":"Tren hareket ederek."}],"correct_option_id":"A","explanation":"Hareket etmek üzere expresses an imminent departure."},{"id":"YH1-V68-Q010","section":"10.2","skill_id":"YH1-10-04-S03","type":"single_select","prompt":"Complete: Film başla___; hemen yerimize oturalım. (The film is about to start; let’s sit down.)","options":[{"id":"A","text":"madan"},{"id":"B","text":"mak üzere"},{"id":"C","text":"dıktan"},{"id":"D","text":"yınca"}],"correct_option_id":"B","explanation":"Başlamak üzere means the film is about to start."},{"id":"YH1-V68-Q011","section":"10.3","skill_id":"YH1-10-06-S03","type":"single_select","prompt":"Complete: Kahve iç___ önce su içiyorum. (I drink water before drinking coffee.)","options":[{"id":"A","text":"dikten"},{"id":"B","text":"yerek"},{"id":"C","text":"meden"},{"id":"D","text":"yecek"}],"correct_option_id":"C","explanation":"Yemeden önce expresses “before eating.”"},{"id":"YH1-V68-Q012","section":"10.3","skill_id":"YH1-10-06-S03","type":"single_select","prompt":"Choose the sentence meaning “Call me before you leave.”","options":[{"id":"A","text":"Gittikten sonra beni ara."},{"id":"B","text":"Gitmeden önce beni ara."},{"id":"C","text":"Giderek beni ara."},{"id":"D","text":"Gidince beni aradın."}],"correct_option_id":"B","explanation":"Gitmeden önce expresses “before leaving.”"},{"id":"YH1-V68-Q013","section":"11.3","skill_id":"YH1-11-05-S01","type":"single_select","prompt":"Which sentence uses the repeated form güle güle to describe someone leaving cheerfully?","options":[{"id":"A","text":"Çocuk güle güle ayrıldı."},{"id":"B","text":"Çocuk gülmeden ayrıldı."},{"id":"C","text":"Çocuk gülecek ayrıldı."},{"id":"D","text":"Çocuk gülmüş ayrıldı."}],"correct_option_id":"A","explanation":"Güle güle is a repeated form associated with smiling or laughing; here güle güle ayrıldı means the child left cheerfully. The expression is also used independently as a farewell, so this item still needs native-speaker review."},{"id":"YH1-V68-Q014","section":"11.3","skill_id":"YH1-11-05-S01","type":"single_select","prompt":"Complete with the repeated -A converb: Eve ___ geldik. (We came home running continuously.)","options":[{"id":"A","text":"koşmadan"},{"id":"B","text":"koşa koşa"},{"id":"C","text":"koşacak"},{"id":"D","text":"koştuk"}],"correct_option_id":"B","explanation":"Koşa koşa is the repeated -A converb of koşmak."},{"id":"YH1-V68-Q015","section":"11.3","skill_id":"YH1-11-05-S02","type":"single_select","prompt":"Which expression is the conventional paired -A converb meaning “laughing and playing”?","options":[{"id":"A","text":"gülerek oynayarak"},{"id":"B","text":"güle oynaya"},{"id":"C","text":"gülmeden oynayarak"},{"id":"D","text":"gülüp oynayarak"}],"correct_option_id":"B","explanation":"Güle oynaya is the conventional paired -A converb. Gülerek oynayarak and gülüp oynayarak use different converb endings; they are not necessarily ungrammatical, but they do not match the requested form."},{"id":"YH1-V68-Q016","section":"11.3","skill_id":"YH1-11-05-S02","type":"single_select","prompt":"Complete using the conventional paired -A converb: Çocuklar ___ eve döndüler. (The children returned home cheerfully, laughing and playing.)","options":[{"id":"A","text":"güle oynaya"},{"id":"B","text":"gülerek oynayarak"},{"id":"C","text":"gülüp oynayarak"},{"id":"D","text":"gülmeden oynayarak"}],"correct_option_id":"A","explanation":"Güle oynaya is the conventional paired -A form. Other choices use different converb morphology and therefore do not answer this specifically worded question."},{"id":"YH1-V68-Q017","section":"11.3","skill_id":"YH1-11-05-S03","type":"single_select","prompt":"Which option repeats the -A converb of ağlamak to express sustained or repeated crying?","options":[{"id":"A","text":"ağlamadan ağlamadan"},{"id":"B","text":"ağlayarak ağlayarak"},{"id":"C","text":"ağlaya ağlaya"},{"id":"D","text":"ağlayacak ağlayacak"}],"correct_option_id":"C","explanation":"Ağlaya ağlaya repeats the -A converb of ağlamak. The other options repeat different forms or endings, not the requested -A converb."},{"id":"YH1-V68-Q018","section":"11.3","skill_id":"YH1-11-05-S03","type":"single_select","prompt":"Complete with the reduplicated -A converb: Bebek ___ uyudu. (The baby fell asleep while crying continuously.)","options":[{"id":"A","text":"ağlayacak"},{"id":"B","text":"ağlaya ağlaya"},{"id":"C","text":"ağlamıyor"},{"id":"D","text":"ağladı"}],"correct_option_id":"B","explanation":"Ağlaya ağlaya conveys repeated or sustained crying accompanying the process of falling asleep; the converb does not itself mean “after.”"},{"id":"YH1-V68-Q019","section":"12.2","skill_id":"YH1-12-02-S03","type":"single_select","prompt":"Choose “I heard that Mehmet arrived.”","options":[{"id":"A","text":"Mehmet’in gelmesini duydum."},{"id":"B","text":"Mehmet’in geldiğini duydum."},{"id":"C","text":"Mehmet’in gelince duydum."},{"id":"D","text":"Mehmet’in gelecek duydum."}],"correct_option_id":"B","explanation":"Geldiğini is a factive embedded-clause form with possessive and accusative marking."},{"id":"YH1-V68-Q020","section":"12.2","skill_id":"YH1-12-02-S03","type":"single_select","prompt":"Complete: Ayşe’nin sınavı geç___ biliyorum. (I know that Ayşe passed the exam.)","options":[{"id":"A","text":"tiğini"},{"id":"B","text":"mesini"},{"id":"C","text":"ince"},{"id":"D","text":"mek"}],"correct_option_id":"A","explanation":"Geçtiğini is built from geç- + -DIK (with consonant softening before a vowel) + third-person possessive + accusative, yielding “that Ayşe passed.”"},{"id":"YH1-V68-Q021","section":"12.3","skill_id":"YH1-12-03-S02","type":"single_select","prompt":"Choose “My mother told me to study.”","options":[{"id":"A","text":"Annem bana ders çalışmamı söyledi."},{"id":"B","text":"Annem bana ders çalıştım söyledi."},{"id":"C","text":"Annem bana ders çalışmak söyledi."},{"id":"D","text":"Annem bana ders çalışıyor söyledi."}],"correct_option_id":"A","explanation":"Çalışmamı is a first-person possessive verbal noun with accusative marking."},{"id":"YH1-V68-Q022","section":"12.3","skill_id":"YH1-12-03-S02","type":"single_select","prompt":"Complete: Müdür bana erken gel___ söyledi. (The manager told me to come early.)","options":[{"id":"A","text":"diğimi"},{"id":"B","text":"memi"},{"id":"C","text":"eceğim"},{"id":"D","text":"iyorum"}],"correct_option_id":"B","explanation":"Gelmemi is the first-person nominalized instruction complement."},{"id":"YH1-V68-Q023","section":"12.3","skill_id":"YH1-12-03-S03","type":"single_select","prompt":"Choose “The coach told us to run.”","options":[{"id":"A","text":"Antrenör bize koşmamı söyledi."},{"id":"B","text":"Antrenör bize koşmasını söyledi."},{"id":"C","text":"Antrenör bize koşmamızı söyledi."},{"id":"D","text":"Antrenör bize koşmanı söyledi."}],"correct_option_id":"C","explanation":"Koşmamızı marks us as the people instructed to run."},{"id":"YH1-V68-Q024","section":"12.3","skill_id":"YH1-12-03-S03","type":"single_select","prompt":"Complete: Öğretmen bize sessiz ol___ söyledi. (The teacher told us to be quiet.)","options":[{"id":"A","text":"mamızı"},{"id":"B","text":"manı"},{"id":"C","text":"masını"},{"id":"D","text":"mak"}],"correct_option_id":"A","explanation":"Olmamızı is the first-person plural possessive verbal noun with accusative marking."},{"id":"YH1-V70-Q001","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S02","type":"single_select","prompt":"Choose the correct accusative form of saat (clock/hour).","options":[{"id":"A","text":"saadı"},{"id":"B","text":"saati"},{"id":"C","text":"saatti"},{"id":"D","text":"saate"}],"correct_option_id":"B","explanation":"Saat takes the accusative -i without changing its final t: saat → saati."},{"id":"YH1-V70-Q002","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S02","type":"single_select","prompt":"Which pair correctly shows a noun retaining its final consonant before the accusative suffix?","options":[{"id":"A","text":"kitap → kitapı"},{"id":"B","text":"ağaç → ağaçı"},{"id":"C","text":"saat → saati"},{"id":"D","text":"renk → renki"}],"correct_option_id":"C","explanation":"Saat → saati keeps the final t; the other nouns undergo consonant softening in these forms."},{"id":"YH1-V70-Q003","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S02","type":"single_select","prompt":"Choose the correct first-person singular possessive form of fikir (idea).","options":[{"id":"A","text":"fikrim"},{"id":"B","text":"fikirım"},{"id":"C","text":"fikirim"},{"id":"D","text":"fikirem"}],"correct_option_id":"A","explanation":"Fikir loses
