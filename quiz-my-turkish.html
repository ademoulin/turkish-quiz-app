":"yor"},{"id":"C","text":"dü"},{"id":"D","text":"yecek"}],"correct_option_id":"A","explanation":"The verb stem yürü- takes the infinitive ending -mek: yürümek (“to walk” or “walking”). In Her gün yürümek sağlıklıdır, the infinitive phrase functions as the subject."},{"id":"YH1-V64-Q021","section":"12.2","skill_id":"YH1-12-02-S01","type":"single_select","prompt":"Complete: Senin konuş___ çok güzel. (Your speaking is very nice.)","options":[{"id":"A","text":"mam"},{"id":"B","text":"man"},{"id":"C","text":"ması"},{"id":"D","text":"mak"}],"correct_option_id":"B","explanation":"Konuşman is the second-person possessive verbal noun."},{"id":"YH1-V64-Q022","section":"12.2","skill_id":"YH1-12-02-S01","type":"single_select","prompt":"Which phrase means “your reading the book” (addressing one person)?","options":[{"id":"A","text":"senin kitabı okuman"},{"id":"B","text":"senin kitabı okumam"},{"id":"C","text":"senin kitabı okuması"},{"id":"D","text":"senin kitabı okumak"}],"correct_option_id":"A","explanation":"Senin okuman agrees with the second-person genitive subject."},{"id":"YH1-V64-Q023","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S02","type":"single_select","prompt":"Choose the plural ending for şehir (city).","options":[{"id":"A","text":"-lar"},{"id":"B","text":"-ler"},{"id":"C","text":"-lur"},{"id":"D","text":"-lir"}],"correct_option_id":"B","explanation":"The last vowel i is front, so şehir takes -ler: şehirler."},{"id":"YH1-V64-Q024","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S02","type":"single_select","prompt":"Which is the correct plural of çocuk (child)?","options":[{"id":"A","text":"çocukler"},{"id":"B","text":"çocuklir"},{"id":"C","text":"çocuklar"},{"id":"D","text":"çocuklur"}],"correct_option_id":"C","explanation":"The last vowel u is back, selecting -lar: çocuklar."},{"id":"YH1-V66-Q001","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S01","type":"single_select","prompt":"Which of these Turkish consonants is voiceless (unvoiced)?","options":[{"id":"A","text":"z"},{"id":"B","text":"v"},{"id":"C","text":"ş"},{"id":"D","text":"m"}],"correct_option_id":"C","explanation":"Ş is voiceless; z, v, and m are voiced."},{"id":"YH1-V66-Q002","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S01","type":"single_select","prompt":"Which noun takes -ta (rather than -da) in the locative singular?","options":[{"id":"A","text":"kitap"},{"id":"B","text":"ev"},{"id":"C","text":"okul"},{"id":"D","text":"masa"}],"correct_option_id":"A","explanation":"Kitap ends in voiceless p, so kitap + -DA → kitapta. Ev, okul, and masa take -de/-da instead (evde, okulda, masada)."},{"id":"YH1-V66-Q003","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S01","type":"single_select","prompt":"Complete: burun + your (singular) → ___.","options":[{"id":"A","text":"burunun"},{"id":"B","text":"burnun"},{"id":"C","text":"burnün"},{"id":"D","text":"burunın"}],"correct_option_id":"B","explanation":"Burun loses its second vowel before the second-person singular possessive: burnun."},{"id":"YH1-V66-Q004","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S01","type":"single_select","prompt":"Complete: karın (belly) + my → ___.","options":[{"id":"A","text":"karınım"},{"id":"B","text":"karnım"},{"id":"C","text":"karınum"},{"id":"D","text":"karnum"}],"correct_option_id":"B","explanation":"Karın undergoes vowel deletion before the possessive suffix: karnım."},{"id":"YH1-V66-Q005","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S03","type":"single_select","prompt":"Complete: ağız + my → ___.","options":[{"id":"A","text":"ağzım"},{"id":"B","text":"ağızım"},{"id":"C","text":"ağzum"},{"id":"D","text":"ağızımın"}],"correct_option_id":"A","explanation":"Ağız loses its second vowel before the first-person possessive ending: ağzım."},{"id":"YH1-V66-Q006","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S03","type":"single_select","prompt":"Complete: ağız + dative → ___.","options":[{"id":"A","text":"ağıza"},{"id":"B","text":"ağza"},{"id":"C","text":"ağzı"},{"id":"D","text":"ağızda"}],"correct_option_id":"B","explanation":"Before the vowel-initial dative suffix, ağız loses its second vowel: ağza."},{"id":"YH1-V66-Q007","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S02","type":"single_select","prompt":"Complete: şu + accusative → ___.","options":[{"id":"A","text":"şuyu"},{"id":"B","text":"şunu"},{"id":"C","text":"şuda"},{"id":"D","text":"şuna"}],"correct_option_id":"B","explanation":"The demonstrative pronoun şu takes the linking n before the accusative -u: şu + n + u → şunu. Şuna is dative, not accusative."},{"id":"YH1-V66-Q008","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S02","type":"single_select","prompt":"Complete: o + ablative → ___.","options":[{"id":"A","text":"odan"},{"id":"B","text":"ondan"},{"id":"C","text":"ona"},{"id":"D","text":"onda"}],"correct_option_id":"B","explanation":"The demonstrative o uses pronominal n before the ablative suffix: ondan."},{"id":"YH1-V66-Q009","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S01","type":"single_select","prompt":"Choose the correct bare adjective–noun phrase meaning “an old house” (not a complete sentence).","options":[{"id":"A","text":"ev eski"},{"id":"B","text":"eski ev"},{"id":"C","text":"eskiyi ev"},{"id":"D","text":"evin eski"}],"correct_option_id":"B","explanation":"In a bare adjective–noun phrase, the adjective precedes the noun: eski ev."},{"id":"YH1-V66-Q010","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S01","type":"single_select","prompt":"Choose the correct bare adjective–noun phrase meaning “a small garden” (not a complete sentence).","options":[{"id":"A","text":"bahçe küçük"},{"id":"B","text":"küçük bahçe"},{"id":"C","text":"küçüğü bahçe"},{"id":"D","text":"bahçenin küçük"}],"correct_option_id":"B","explanation":"Küçük modifies the noun bahçe and precedes it."},{"id":"YH1-V66-Q011","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S03","type":"single_select","prompt":"In “çok eski kitap”, which word is the head noun?","options":[{"id":"A","text":"çok"},{"id":"B","text":"eski"},{"id":"C","text":"kitap"},{"id":"D","text":"çok eski"}],"correct_option_id":"C","explanation":"Kitap is the head noun; çok eski modifies it."},{"id":"YH1-V66-Q012","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S03","type":"single_select","prompt":"In “oldukça büyük bahçe”, which word is the head noun?","options":[{"id":"A","text":"bahçe"},{"id":"B","text":"büyük"},{"id":"C","text":"oldukça"},{"id":"D","text":"oldukça büyük"}],"correct_option_id":"A","explanation":"Bahçe is the head noun, modified by oldukça büyük."},{"id":"YH1-V66-Q013","section":"2.3","skill_id":"YH1-02-TIME-S03","type":"single_select","prompt":"Which expression means “It is half past seven”?","options":[{"id":"A","text":"Saat yedi buçuk."},{"id":"B","text":"Saat yediye çeyrek var."},{"id":"C","text":"Saat sekiz buçuk."},{"id":"D","text":"Saat yediyi çeyrek geçiyor."}],"correct_option_id":"A","explanation":"Saat yedi buçuk means 7:30. Yediye çeyrek var is 6:45; yediyi çeyrek geçiyor is 7:15; sekiz buçuk is 8:30."},{"id":"YH1-V66-Q014","section":"2.3","skill_id":"YH1-02-TIME-S03","type":"single_select","prompt":"Which expression means “It is half past nine”?","options":[{"id":"A","text":"Saat ona çeyrek var."},{"id":"B","text":"Saat dokuzu çeyrek geçiyor."},{"id":"C","text":"Saat dokuz buçuk."},{"id":"D","text":"Saat on buçuk."}],"correct_option_id":"C","explanation":"Saat dokuz buçuk means 9:30."},{"id":"YH1-V66-Q015","section":"5.2","skill_id":"YH1-05-03-S02","type":"single_select","prompt":"Complete the first-person plural suggestion: Akşam film izle___! (Let’s watch a film tonight.)","options":[{"id":"A","text":"yelim"},{"id":"B","text":"yeyim"},{"id":"C","text":"sin"},{"id":"D","text":"yecek"}],"correct_option_id":"A","explanation":"İzleyelim is the first-person plural optative of izlemek."},{"id":"YH1-V66-Q016","section":"5.2","skill_id":"YH1-05-03-S02","type":"single_select","prompt":"Which sentence makes the suggestion “Let’s eat together”?","options":[{"id":"A","text":"Birlikte yiyelim."},{"id":"B","text":"Birlikte yiyorum."},{"id":"C","text":"Birlikte yedim."},{"id":"D","text":"Birlikte yiyeceksin."}],"correct_option_id":"A","explanation":"Yiyelim is the first-person plural optative, used to suggest a joint action."},{"id":"YH1-V66-Q017","section":"5.2","skill_id":"YH1-05-03-S03","type":"single_select","prompt":"Which sentence means “Let’s not wait”?","options":[{"id":"A","text":"Beklemiyoruz."},{"id":"B","text":"Beklemeyelim."},{"id":"C","text":"Beklemedik."},{"id":"D","text":"Beklemeyiz."}],"correct_option_id":"B","explanation":"Beklemeyelim is the negative first-person plural optative."},{"id":"YH1-V66-Q018","section":"5.2","skill_id":"YH1-05-03-S03","type":"single_select","prompt":"Complete the negative suggestion: Bugün dışarı çık___! (Let’s not go out today.)","options":[{"id":"A","text":"mayalım"},{"id":"B","text":"mıyoruz"},{"id":"C","text":"madık"},{"id":"D","text":"mayacak"}],"correct_option_id":"A","explanation":"Çıkmayalım is the negative first-person plural optative of çıkmak."},{"id":"YH1-V66-Q019","section":"7.3","skill_id":"YH1-07-03-S02","type":"single_select","prompt":"Which word means “in German” (as a language)?","options":[{"id":"A","text":"Almanca"},{"id":"B","text":"Almanlı"},{"id":"C","text":"Almandan"},{"id":"D","text":"Almansız"}],"correct_option_id":"A","explanation":"Almanca is the language name formed from Alman with -ca."},{"id":"YH1-V66-Q020","section":"7.3","skill_id":"YH1-07-03-S02","type":"single_select","prompt":"Which word means “in English” (as a language)?","options":[{"id":"A","text":"İngilizli"},{"id":"B","text":"İngilizden"},{"id":"C","text":"İngilizce"},{"id":"D","text":"İngilizlik"}],"correct_option_id":"C","explanation":"İngilizce is the language name with -ce."},{"id":"YH1-V66-Q021","section":"7.3","skill_id":"YH1-07-05-S03","type":"single_select","prompt":"Choose the sentence meaning “This bag is as heavy as that bag.”","options":[{"id":"A","text":"Bu çanta o çantadan ağır."},{"id":"B","text":"Bu çanta o çanta kadar ağır."},{"id":"C","text":"Bu çanta o çantaya ağır."},{"id":"D","text":"Bu çanta o çantada ağır."}],"correct_option_id":"B","explanation":"Kadar marks equality of degree: o çanta kadar ağır."},{"id":"YH1-V66-Q022","section":"7.3","skill_id":"YH1-07-05-S03","type":"single_select","prompt":"Choose the sentence meaning “My brother is as tall as me.”","options":[{"id":"A","text":"Kardeşim benden uzun."},{"id":"B","text":"Kardeşim bana uzun."},{"id":"C","text":"Kardeşim benim kadar uzun."},{"id":"D","text":"Kardeşim bende uzun."}],"correct_option_id":"C","explanation":"Benim kadar uzun expresses equality of height."},{"id":"YH1-V66-Q023","section":"8.3","skill_id":"YH1-08-05-S01","type":"single_select","prompt":"Zeynep is not answering her phone. Which sentence uses the third-person predicate ending -DIr to express a possible supposition about her location?","options":[{"id":"A","text":"Zeynep dün evdeydi."},{"id":"B","text":"Zeynep şimdi evdedir."},{"id":"C","text":"Zeynep evde değil."},{"id":"D","text":"Zeynep eve gidiyor mu?"}],"correct_option_id":"B","explanation":"Zeynep şimdi evdedir includes -dir, which may suggest “Zeynep is probably at home now” in an appropriate context. It may also be a formal assertion; the ending is not exclusively inferential."},{"id":"YH1-V66-Q024","section":"8.3","skill_id":"YH1-08-05-S01","type":"single_select","prompt":"Choose the sentence that uses the third-person predicate ending -DIr to make a present-time statement about cold weather.","options":[{"id":"A","text":"Dün hava soğuktu."},{"id":"B","text":"Hava soğuk değil."},{"id":"C","text":"Hava soğuk mudur?"},{"id":"D","text":"Şimdi hava soğuktur."}],"correct_option_id":"D","explanation":"Şimdi hava soğuktur uses -tur, the voiceless-consonant variant of -DIr. It is a present-time predicate and may sound formal or categorical; this item identifies the suffix, not a uniquely inferential meaning."},{"id":"YH1-V68-Q001","section":"8.3","skill_id":"YH1-08-05-S03","type":"single_select","prompt":"Complete the formal third-person predicate: Bu cevap doğru___. (This answer is correct.)","options":[{"id":"A","text":"dur"},{"id":"B","text":"yuz"},{"id":"C","text":"sunuz"},{"id":"D","text":"lar"}],"correct_option_id":"A","explanation":"Doğrudur uses the third-person formal/assertive suffix -dur after the vowel-final adjective doğru."},{"id":"YH1-V68-Q002","section":"8.3","skill_id":"YH1-08-05-S03","type":"single_select","prompt":"Choose the formal third-person statement meaning “The room is clean.”","options":[{"id":"A","text":"Oda temizim."},{"id":"B","text":"Oda temizdir."},{"id":"C","text":"Oda temizsiniz."},{"id":"D","text":"Oda temiziz."}],"correct_option_id":"B","explanation":"Temizdir uses -dir for a formal third-person statement."},{"id":"YH1-V68-Q003","section":"9.3","skill_id":"YH1-09-04-S02","type":"single_select","prompt":"According to what people say, Ali used to swim every summer. Choose the reported-habitual sentence.","options":[{"id":"A","text":"Ali her yaz yüzermiş."},{"id":"B","text":"Ali her yaz yüzüyor."},{"id":"C","text":"Ali her yaz yüzecek."},{"id":"D","text":"Ali her yaz yüzdü."}],"correct_option_id":"A","explanation":"Yüzermiş combines the aorist habitual -er with reported -miş."},{"id":"YH1-V68-Q004","section":"9.3","skill_id":"YH1-09-04-S02","type":"single_select","prompt":"Complete the reported habitual: Duyduğuma göre eskiden burada çalış___ . (Apparently, he/she used to work here.)","options":[{"id":"A","text":"acak"},{"id":"B","text":"ıyor"},{"id":"C","text":"ırmış"},{"id":"D","text":"tı"}],"correct_option_id":"C","explanation":"Çalışırmış reports a habitual activity learned from another source."},{"id":"YH1-V68-Q005","section":"10.1","skill_id":"YH1-10-02-S02","type":"single_select","prompt":"Choose “my sister’s room’s window.”","options":[{"id":"A","text":"kız kardeşimin odasının penceresi"},{"id":"B","text":"kız kardeşimin odası pencere"},{"id":"C","text":"kız kardeşime odanın penceresi"},{"id":"D","text":"kız kardeşimin odayı penceresi"}],"correct_option_id":"A","explanation":"Kız kardeşimin odasının penceresi nests two genitive–possessive relationships."},{"id":"YH1-V68-Q006","section":"10.1","skill_id":"YH1-10-02-S02","type":"single_select","prompt":"Which phrase means “the color of my father’s car”?","options":[{"id":"A","text":"babamın arabaya rengi"},{"id":"B","text":"babamın araba renk"},{"id":"C","text":"babamın arabasının rengi"},{"id":"D","text":"babamın arabasını renk"}],"correct_option_id":"C","explanation":"Babamın arabasının rengi marks the nested possessive relationships."},{"id":"YH1-V68-Q007","section":"10.2","skill_id":"YH1-10-03-S02","type":"single_select","prompt":"Choose the sentence that explicitly says “I am glad YOU came” (not I or someone else).","options":[{"id":"A","text":"Benim gelmeme sevindim."},{"id":"B","text":"Senin gelmene sevindim."},{"id":"C","text":"Onun gelmesine sevindim."},{"id":"D","text":"Gelmek sevindim."}],"correct_option_id":"B","explanation":"Senin gelmene makes the second-person subject of the nominalized action explicit."},{"id":"YH1-V68-Q008","section":"10.2","skill_id":"YH1-10-03-S02","type":"single_select","prompt":"Complete the second-person singular possessive verbal noun: Senin erken kalk___ gerekiyor. (You need to get up early.)","options":[{"id":"A","text":"mam"},{"id":"B","text":"ması"},{"id":"C","text":"man"},{"id":"D","text":"mak"}],"correct_option_id":"C","explanation":"Senin is the second-person singular genitive subject; kalk-ma-n is the matching possessive verbal noun. The full sentence is Senin erken kalkman gerekiyor."},{"id":"YH1-V68-Q009","section":"10.2","skill_id":"YH1-10-04-S03","type":"single_select","prompt":"The train is about to depart. Choose the correct sentence.","options":[{"id":"A","text":"Tren hareket etmek üzere."},{"id":"B","text":"Tren hareket ettikten sonra."},{"id":"C","text":"Tren hareket etmeden önce."},{"id":"D","text":"Tren hareket ederek."}],"correct_option_id":"A","explanation":"Hareket etmek üzere expresses an imminent departure."},{"id":"YH1-V68-Q010","section":"10.2","skill_id":"YH1-10-04-S03","type":"single_select","prompt":"Complete: Film başla___; hemen yerimize oturalım. (The film is about to start; let’s sit down.)","options":[{"id":"A","text":"madan"},{"id":"B","text":"mak üzere"},{"id":"C","text":"dıktan"},{"id":"D","text":"yınca"}],"correct_option_id":"B","explanation":"Başlamak üzere means the film is about to start."},{"id":"YH1-V68-Q011","section":"10.3","skill_id":"YH1-10-06-S03","type":"single_select","prompt":"Complete: Kahve iç___ önce su içiyorum. (I drink water before drinking coffee.)","options":[{"id":"A","text":"dikten"},{"id":"B","text":"yerek"},{"id":"C","text":"meden"},{"id":"D","text":"yecek"}],"correct_option_id":"C","explanation":"Yemeden önce expresses “before eating.”"},{"id":"YH1-V68-Q012","section":"10.3","skill_id":"YH1-10-06-S03","type":"single_select","prompt":"Choose the sentence meaning “Call me before you leave.”","options":[{"id":"A","text":"Gittikten sonra beni ara."},{"id":"B","text":"Gitmeden önce beni ara."},{"id":"C","text":"Giderek beni ara."},{"id":"D","text":"Gidince beni aradın."}],"correct_option_id":"B","explanation":"Gitmeden önce expresses “before leaving.”"},{"id":"YH1-V68-Q013","section":"11.3","skill_id":"YH1-11-05-S01","type":"single_select","prompt":"Which sentence uses the repeated form güle güle to describe someone leaving cheerfully?","options":[{"id":"A","text":"Çocuk güle güle ayrıldı."},{"id":"B","text":"Çocuk gülmeden ayrıldı."},{"id":"C","text":"Çocuk gülecek ayrıldı."},{"id":"D","text":"Çocuk gülmüş ayrıldı."}],"correct_option_id":"A","explanation":"Güle güle is a repeated form associated with smiling or laughing; here güle güle ayrıldı means the child left cheerfully. The expression is also used independently as
