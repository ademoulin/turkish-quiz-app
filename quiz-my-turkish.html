mpt":"Complete using the negative future-in-the-past: O gel___ti. (He/she was not going to come.)","options":[{"id":"A","text":"meyeceğim"},{"id":"B","text":"meyeceğ"},{"id":"C","text":"meyecek"},{"id":"D","text":"mayacak"}],"correct_option_id":"C","explanation":"Gel- takes the negative future form gelmeyecekti."},{"id":"YH1-V13-Q014","section":"7.3","skill_id":"YH1-07-04-S03","type":"single_select","prompt":"Complete the expression meaning “in my opinion”: Bana ___ bu kolay.","options":[{"id":"A","text":"önce"},{"id":"B","text":"göre"},{"id":"C","text":"kadar"},{"id":"D","text":"gibi"}],"correct_option_id":"B","explanation":"Bana göre is “in my opinion.” The postposition göre follows the dative pronoun bana, not the nominative ben."},{"id":"YH1-V13-Q015","section":"7.3","skill_id":"YH1-07-05-S02","type":"single_select","prompt":"Complete the equal-degree comparison: Senin ___ hızlı koşuyorum. (I run as fast as you do.)","options":[{"id":"A","text":"gibi"},{"id":"B","text":"göre"},{"id":"C","text":"kadar"},{"id":"D","text":"sonra"}],"correct_option_id":"C","explanation":"Kadar can mark equality of degree: senin kadar hızlı."},{"id":"YH1-V13-Q016","section":"8.1","skill_id":"YH1-08-02-S02","type":"single_select","prompt":"Complete: Meğer o doktor ___. (Apparently he/she was not a doctor.)","options":[{"id":"A","text":"değil"},{"id":"B","text":"değilmiş"},{"id":"C","text":"değildi"},{"id":"D","text":"değilsin"}],"correct_option_id":"B","explanation":"Değilmiş expresses an inferred or reported negative nominal predicate."},{"id":"YH1-V13-Q017","section":"8.1","skill_id":"YH1-08-02-S03","type":"single_select","prompt":"Complete the reported nominal question: O öğrenci ___?","options":[{"id":"A","text":"miymiş"},{"id":"B","text":"miyiz"},{"id":"C","text":"miydi"},{"id":"D","text":"midir"}],"correct_option_id":"A","explanation":"Öğrenci miymiş? asks whether someone was apparently a student."},{"id":"YH1-V13-Q018","section":"8.2","skill_id":"YH1-08-03-S02","type":"single_select","prompt":"Complete: Ali çalış___muş. (Apparently Ali was not working.)","options":[{"id":"A","text":"muyor"},{"id":"B","text":"müyor"},{"id":"C","text":"mıyor"},{"id":"D","text":"miyor"}],"correct_option_id":"C","explanation":"Çalışmıyormuş is the negative reported present continuous."},{"id":"YH1-V13-Q019","section":"8.2","skill_id":"YH1-08-03-S03","type":"single_select","prompt":"Which question uses the reported past form of the present continuous to ask “Was she apparently sleeping?”","options":[{"id":"A","text":"Uyuyor muydu?"},{"id":"B","text":"Uyuyor muymuş?"},{"id":"C","text":"Uyuyacak mı?"},{"id":"D","text":"Uyumuş mu?"}],"correct_option_id":"B","explanation":"Uyuyor muymuş asks a reported/inferred present-continuous question."},{"id":"YH1-V13-Q020","section":"8.2","skill_id":"YH1-08-04-S03","type":"single_select","prompt":"Which question uses the reported form of the future tense to ask “Was he apparently going to come?”","options":[{"id":"A","text":"Gelecek miymiş?"},{"id":"B","text":"Geliyor mu?"},{"id":"C","text":"Gelecek miydi?"},{"id":"D","text":"Gelmiş mi?"}],"correct_option_id":"A","explanation":"Gelecek miymiş is a reported future question."},{"id":"YH1-V13-Q021","section":"9.1","skill_id":"YH1-09-01-S05","type":"single_select","prompt":"Use the aorist (geniş zaman): Ben her gün kitap ___ . (I read every day.)","options":[{"id":"A","text":"okurum"},{"id":"B","text":"okirim"},{"id":"C","text":"okuyordum"},{"id":"D","text":"okarım"}],"correct_option_id":"A","explanation":"Oku- takes -r in the aorist: okurum."},{"id":"YH1-V13-Q022","section":"9.2","skill_id":"YH1-09-02-S03","type":"single_select","prompt":"Complete: Biz Türkçe konuşabil___. (We can speak Turkish.)","options":[{"id":"A","text":"irler"},{"id":"B","text":"irsin"},{"id":"C","text":"irim"},{"id":"D","text":"iriz"}],"correct_option_id":"D","explanation":"Konuşabiliriz is first-person plural ability in the aorist."},{"id":"YH1-V13-Q023","section":"9.3","skill_id":"YH1-09-03-S03","type":"single_select","prompt":"Complete: Eskiden et ye___. (I did not use to eat meat.)","options":[{"id":"A","text":"mezdim"},{"id":"B","text":"meyeceğim"},{"id":"C","text":"miyorum"},{"id":"D","text":"medim"}],"correct_option_id":"A","explanation":"Yemezdim is the negative habitual past."},{"id":"YH1-V13-Q024","section":"9.3","skill_id":"YH1-09-04-S01","type":"single_select","prompt":"A friend told you that someone used to live here. Complete with the reported habitual form: Eskiden burada yaşar___.","options":[{"id":"A","text":"ıyor"},{"id":"B","text":"dı"},{"id":"C","text":"mış"},{"id":"D","text":"acak"}],"correct_option_id":"C","explanation":"Yaşarmış expresses a reported past habit."},{"id":"YH1-V13-Q025","section":"9.3","skill_id":"YH1-09-04-S03","type":"single_select","prompt":"Complete: O eskiden kahve iç___miş. (Apparently he/she did not use to drink coffee.)","options":[{"id":"A","text":"me"},{"id":"B","text":"medi"},{"id":"C","text":"miyor"},{"id":"D","text":"mez"}],"correct_option_id":"D","explanation":"İçmezmiş is the negative reported aorist."},{"id":"YH1-V13-Q026","section":"10.1","skill_id":"YH1-10-02-S01","type":"single_select","prompt":"Choose the complete nested genitive–possessive phrase meaning “the door of the school’s library”.","options":[{"id":"A","text":"okulun kütüphane kapı"},{"id":"B","text":"okul kütüphane kapı"},{"id":"C","text":"okulun kütüphanesinin kapısı"},{"id":"D","text":"okula kütüphanenin kapısı"}],"correct_option_id":"C","explanation":"Chained possessives mark both school → library and library → door."},{"id":"YH1-V13-Q027","section":"10.2","skill_id":"YH1-10-03-S03","type":"single_select","prompt":"Complete the second-person possessive verbal noun: Senin erken gel___ için taksi çağırdım. (I called a taxi so that you could arrive early.)","options":[{"id":"A","text":"mem"},{"id":"B","text":"men"},{"id":"C","text":"mesi"},{"id":"D","text":"mek"}],"correct_option_id":"B","explanation":"Gel-me-n forms the second-person singular possessive verbal noun gelmen; senin agrees with the possessive marking."},{"id":"YH1-V13-Q028","section":"10.2","skill_id":"YH1-10-04-S02","type":"single_select","prompt":"Complete using the -mek üzere purpose construction: Sizinle görüşmek ___ geldim. (I came to meet you.)","options":[{"id":"A","text":"üzere"},{"id":"B","text":"önce"},{"id":"C","text":"sonra"},{"id":"D","text":"kadar"}],"correct_option_id":"A","explanation":"-mek üzere expresses purpose or intention."},{"id":"YH1-V13-Q029","section":"10.3","skill_id":"YH1-10-05-S03","type":"single_select","prompt":"Complete: Yemek ye___ sonra çıktık. (After eating, we left.)","options":[{"id":"A","text":"diğimiz"},{"id":"B","text":"mek"},{"id":"C","text":"meden"},{"id":"D","text":"dikten"}],"correct_option_id":"D","explanation":"Yedikten sonra uses -DIK + ablative -tAn."},{"id":"YH1-V13-Q030","section":"10.3","skill_id":"YH1-10-06-S02","type":"single_select","prompt":"Complete: Evden çık___ önce anahtarı aldım. (Before leaving home...)","options":[{"id":"A","text":"madan"},{"id":"B","text":"ıyor"},{"id":"C","text":"dıktan"},{"id":"D","text":"acak"}],"correct_option_id":"A","explanation":"Çıkmadan önce means before leaving; the -mAdAn form is required."},{"id":"YH1-V13-Q031","section":"11.1","skill_id":"YH1-11-01-S03","type":"single_select","prompt":"Complete: Kahvaltı yap___ işe gittim. (I had breakfast and went to work.)","options":[{"id":"A","text":"ip"},{"id":"B","text":"üp"},{"id":"C","text":"ıp"},{"id":"D","text":"up"}],"correct_option_id":"C","explanation":"Yap- takes the converb -ıp after back unrounded a."},{"id":"YH1-V13-Q032","section":"11.1","skill_id":"YH1-11-02-S02","type":"single_select","prompt":"Complete: Kahve iç___ çıktım. (I left without drinking coffee.)","options":[{"id":"A","text":"meden"},{"id":"B","text":"erek"},{"id":"C","text":"ip"},{"id":"D","text":"dikten"}],"correct_option_id":"A","explanation":"İçmeden is iç- (drink) + -meden (“without doing”); kahve içmeden çıktım means “I left without drinking coffee.”"},{"id":"YH1-V13-Q033","section":"11.2","skill_id":"YH1-11-03-S03","type":"single_select","prompt":"Complete: Eve koş___ geldim. (I came home running.)","options":[{"id":"A","text":"erek"},{"id":"B","text":"arak"},{"id":"C","text":"ıp"},{"id":"D","text":"madan"}],"correct_option_id":"B","explanation":"Koşarak expresses manner, with -arak after the back vowel o."},{"id":"YH1-V13-Q034","section":"12.1","skill_id":"YH1-12-01-S03","type":"single_select","prompt":"Which sentence naturally means “Swimming is good”?","options":[{"id":"A","text":"Yüzecek iyidir."},{"id":"B","text":"Yüzüyor iyidir."},{"id":"C","text":"Yüzdü iyidir."},{"id":"D","text":"Yüzmek iyidir."}],"correct_option_id":"D","explanation":"The infinitive -mek can function as a nominal subject."},{"id":"YH1-V13-Q035","section":"12.2","skill_id":"YH1-12-02-S01","type":"single_select","prompt":"Complete: Senin gel___ beni mutlu etti. (Your coming made me happy.)","options":[{"id":"A","text":"mem"},{"id":"B","text":"mesi"},{"id":"C","text":"men"},{"id":"D","text":"mek"}],"correct_option_id":"C","explanation":"Gelmen is gel-me + second-person possessive -n."},{"id":"YH1-V13-Q036","section":"Appendix introduction","skill_id":"YH1-FOUND-01-S02","type":"single_select","prompt":"Choose the correct suffix for göz + plural.","options":[{"id":"A","text":"-ler"},{"id":"B","text":"-lir"},{"id":"C","text":"-lur"},{"id":"D","text":"-lar"}],"correct_option_id":"A","explanation":"The final vowel ö is front, selecting -ler."},{"id":"YH1-V13-Q037","section":"Appendix introduction","skill_id":"YH1-FOUND-02-S01","type":"single_select","prompt":"Which pair contains two voiceless Turkish consonants?","options":[{"id":"A","text":"d, t"},{"id":"B","text":"ç, p"},{"id":"C","text":"g, k"},{"id":"D","text":"b, f"}],"correct_option_id":"B","explanation":"Both ç and p are voiceless. In the other pairs, d, g, and b are voiced, although t, k, and f are voiceless."},{"id":"YH1-V13-Q038","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S01","type":"single_select","prompt":"Complete: burun + my → ___.","options":[{"id":"A","text":"burunum"},{"id":"B","text":"burnım"},{"id":"C","text":"burnum"},{"id":"D","text":"burunım"}],"correct_option_id":"C","explanation":"Burun loses its second vowel before the first-person possessive: burnum."},{"id":"YH1-V13-Q039","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S03","type":"single_select","prompt":"Complete: ağız + accusative → ___.","options":[{"id":"A","text":"ağzı"},{"id":"B","text":"ağızı"},{"id":"C","text":"ağıza"},{"id":"D","text":"ağzıı"}],"correct_option_id":"A","explanation":"Ağız loses its second vowel before the accusative: ağzı."},{"id":"YH1-V13-Q040","section":"Appendix introduction","skill_id":"YH1-FOUND-05-S02","type":"single_select","prompt":"Complete: bu + dative → ___.","options":[{"id":"A","text":"bunda"},{"id":"B","text":"buna"},{"id":"C","text":"bua"},{"id":"D","text":"buya"}],"correct_option_id":"B","explanation":"Demonstrative bu uses pronominal n before the dative: buna."},{"id":"YH1-V13-Q041","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S01","type":"single_select","prompt":"Choose the correct bare adjective–noun phrase meaning “a new car” (not a complete sentence).","options":[{"id":"A","text":"yeniyi araba"},{"id":"B","text":"yeni araba"},{"id":"C","text":"arabayı yeni"},{"id":"D","text":"araba yeni"}],"correct_option_id":"B","explanation":"An adjective ordinarily precedes its noun."},{"id":"YH1-V13-Q042","section":"Appendix introduction","skill_id":"YH1-FOUND-07-S03","type":"single_select","prompt":"In “çok güzel ev”, which word is the head noun?","options":[{"id":"A","text":"çok güzel"},{"id":"B","text":"çok"},{"id":"C","text":"güzel"},{"id":"D","text":"ev"}],"correct_option_id":"D","explanation":"Ev is the head noun; çok güzel modifies it."},{"id":"YH1-V13-Q043","section":"2.3","skill_id":"YH1-02-TIME-S03","type":"single_select","prompt":"Which means “It is half past four”?","options":[{"id":"A","text":"Saat beşe çeyrek var."},{"id":"B","text":"Saat dört buçuk."},{"id":"C","text":"Saat beş buçuk."},{"id":"D","text":"Saat dördü çeyrek geçiyor."}],"correct_option_id":"B","explanation":"Saat dört buçuk means 4:30: buçuk means “half” after the hour. Saat beşe çeyrek var is 4:45, and dördü çeyrek geçiyor is 4:15."},{"id":"YH1-V14-Q001","section":"5.2","skill_id":"YH1-05-03-S02","type":"single_select","prompt":"Complete the suggestion: Yarın sahilde yürüyüş yap___! (Let’s take a walk.)","options":[{"id":"A","text":"ayım"},{"id":"B","text":"asın"},{"id":"C","text":"alım"},{"id":"D","text":"acak"}],"correct_option_id":"C","explanation":"Yapalım is the first-person plural optative form."},{"id":"YH1-V14-Q002","section":"5.2","skill_id":"YH1-05-03-S03","type":"single_select","prompt":"Choose the negative first-person plural suggestion: “Let’s not go.”","options":[{"id":"A","text":"Gitmeyiz."},{"id":"B","text":"Gitmiyoruz."},{"id":"C","text":"Gitmedik."},{"id":"D","text":"Gitmeyelim."}],"correct_option_id":"D","explanation":"Gitmeyelim uses -mA plus the first-person plural optative ending."},{"id":"YH1-V14-Q003","section":"7.3","skill_id":"YH1-07-03-S02","type":"single_select","prompt":"Which word means “in Turkish” (as a language)?","options":[{"id":"A","text":"Türkten"},{"id":"B","text":"Türkçe"},{"id":"C","text":"Türklü"},{"id":"D","text":"Türksüz"}],"correct_option_id":"B","explanation":"The equative suffix -CA forms language names, as in Türkçe."},{"id":"YH1-V14-Q004","section":"7.3","skill_id":"YH1-07-05-S03","type":"single_select","prompt":"Choose the sentence meaning “This room is as big as that room.”","options":[{"id":"A","text":"Bu oda o odadan büyük."},{"id":"B","text":"Bu oda o odada büyük."},{"id":"C","text":"Bu oda o odaya büyük."},{"id":"D","text":"Bu oda o oda kadar büyük."}],"correct_option_id":"D","explanation":"Kadar expresses equality of degree; -DAn alone can mark a comparison."},{"id":"YH1-V14-Q005","section":"8.3","skill_id":"YH1-08-05-S01","type":"single_select","prompt":"Which sentence contains the present-time third-person predicate ending -DIr (which can convey inference in context)?","options":[{"id":"A","text":"Ali dün evdeydi."},{"id":"B","text":"Ali evde değil."},{"id":"C","text":"Ali şimdi evdedir."},{"id":"D","text":"Ali eve gidiyor mu?"}],"correct_option_id":"C","explanation":"Ali şimdi evdedir contains the third-person predicate ending -dir. Depending on context, -DIr may convey a supposition or a formal assertion; the suffix alone does not force an inferential reading."},{"id":"YH1-V14-Q006","section":"8.3","skill_id":"YH1-08-05-S03","type":"single_select","prompt":"Complete the formal inference: Ayşe şu anda okulda___ .","options":[{"id":"A","text":"dır"},{"id":"B","text":"yız"},{"id":"C","text":"sınız"},{"id":"D","text":"dırlar"}],"correct_option_id":"A","explanation":"The third-person -DIr follows the locative predicate: okuldadır."},{"id":"YH1-V14-Q007","section":"9.3","skill_id":"YH1-09-04-S02","type":"single_select","prompt":"Someone tells you about a former habit you did not witness. Choose the reported form.","options":[{"id":"A","text":"Her sabah erkenden kalkacak."},{"id":"B","text":"Her sabah erkenden kalkardı."},{"id":"C","text":"Her sabah erkenden kalkıyor."},{"id":"D","text":"Her sabah erkenden kalkarmış."}],"correct_option_id":"D","explanation":"-ArmIş marks a reported or inferred habitual situation."},{"id":"YH1-V14-Q008","section":"10.1","skill_id":"YH1-10-02-S02","type":"single_select","prompt":"Which is the correct nested possessive phrase for “the door of my friend’s house”?","options":[{"id":"A","text":"arkadaşımın evine kapısı"},{"id":"B","text":"arkadaşımın evinin kapısı"},{"id":"C","text":"arkadaşımın ev kapı"},{"id":"D","text":"arkadaşımın evin kapısı"}],"correct_option_id":"B","explanation":"Nested genitive and possessive marking gives arkadaşımın evinin kapısı."},{"id":"YH1-V14-Q009","section":"10.2","skill_id":"YH1-10-03-S02","type":"single_select","prompt":"Which Turkish sentence explicitly identifies YOU as the person who should arrive early: “What can I do so that you arrive early?”","options":[{"id":"A","text":"Erken gelmek için ne yapabilirim?"},{"id":"B","text":"Senin erken gelmen için ne yapabilirim?"},{"id":"C","text":"Benim erken gelmem için ne yapabilirim?"},{"id":"D","text":"Onun erken gelmesi için ne yapabilirim?"}],"correct_option_id":"B","explanation":"Senin erken gelmen için explicitly makes sen the subject of the nominalized action; the other options change or omit that subject."},{"id":"YH1-V14-Q010","section":"10.2","skill_id":"YH1-10-04-S03","type":"single_select","prompt":"It is 8:59 and the meeting starts at 9:00. Complete with the construction meaning “about to”: Toplantı başla___ .","options":[{"id":"A","text":"mak üzere"},{"id":"B","text":"mış gibi"},{"id":"C","text":"madan önce"},{"id":"D","text":"dıktan sonra"}],"correct_option_id":"A","explanation":"Başlamak üzere expresses an imminent or intended action."},{"id":"YH1-V14-Q011","section":"10.3","skill_id":"YH1-10-06-S03","type":"single_select","prompt":"Complete: Dışarı çık___ önce anahtarını al. (Before going out, take your key.)","options":[{"id":"A","text":"dıktan"},{"id":"B","text":"ınca"},{"id":"C","text":"arak"},{"id":"D","text":"madan"}],"correct_option_id":"D","explanation":"Çıkmadan önce means before going out."},{"id":"YH1-V14-Q012","section":"11.3","skill_id":"YH1-11-05-S01","type":"single_select","prompt":"Which sentence uses the reduplicated -A converb koşa koşa (running repeatedly/continuously), not the single -ArAk converb koşarak?","options":[{"id":"A","text":"Çocuklar bahçede koşmadan yoruldu."},{"id":"B","text":"Çocuklar bahçede koşarak yoruldu."},{"id":"C","text":"Çocuklar bahçede koşa koşa yoruldu."},{"id":"D","text":"Çocuklar bahçede koşacak yoruldu."}],"correct_option_id":"C","explanation":"Koşa koşa expresses repeated or sustained running."},{"id":"YH1-V14-Q013","section":"11.3","skill_id":"YH1-11-05-S02","type":"single_select","prompt":"Complete the paired -A converb: Çocuklar parkta ___ vakit geçirdi. (The children spent time cheerfully, laughing and playing.)","options":[{"id":"A","text":"gülerek oynaya"},{"id":"B","text":"güle oynaya"},{"id":"C","text":"güle oynarken"},{"id":"D","text":"gülmeden oynaya"}],"correct_option_id":"B","explanation":"Güle oynaya is a natural paired -A converb expression meaning cheerfully or joyfully."},{"id":"YH1-V14-Q014","section":"11.3","skill_id":"YH1-11-05-S03","type":"single_select","prompt":"Which sentence contains the reduplicated converb ağlaya ağlaya (crying repeatedly or continuously)?","options":[{"id":"A","text":"Çocuk eve ağlamış geldi."},{"id":"B","text":"Çocuk eve ağlaya ağlaya geldi."},{"id":"C","text":"Çocuk eve ağlamadan geldi."},{"id":"D","text":"Çocuk eve ağlayarak geldi."}],"correct_option_id":"B","explanation":"Ağlaya ağlaya is a reduplicated converb expressing prolonged crying."},{"id":"YH1-V14-Q015","section":"12.2","skill_id":"YH1-12-02-S03","type":"single_select","prompt":"Choose the sentence meaning “I know that Ayşe came.”","options":[{"id":"A","text":"Ayşe’nin geldiğini biliyorum."},{"id":"B","text":"Ayşe’nin gelmesini biliyorum."},{"id":"C","text":"Ayşe’nin geldiğinde biliyorum."},{"id":"D","text":"Ayşe’nin gelecekte biliyorum."}],"correct_option_id":"A","explanation":"The embedded clause uses a verbal noun with possessive and accusative marking: geldiğini."},{"id":"YH1-V14-Q016","section":"12.3","skill_id":"YH1-12-03-S02","type":"single_select","prompt":"Which correctly reports “The teacher told me to sit down”?","options":[{"id":"A","text":"Öğretmen bana oturdum söyledi."},{"id":"B","text":"Öğretmen bana oturmak söyledi."},{"id":"C","text":"Öğretmen bana oturuyorum söyledi."},{"id":"D","text":"Öğretmen bana oturmamı söyledi."}],"correct_option_id":"D","explanation":"The reported instruction can be expressed with a nominalized verb and possessive/accusative marking."},{"id":"YH1-V14-Q017","section":"12.3","skill_id":"YH1-12-03-S03","type":"single_select","prompt":"Choose “The teacher told us to wait.”","options":[{"id":"A","text":"Öğretmen bize beklememi söyledi."},{"id":"B","text":"Öğretmen bize beklememizi söyledi."},{"id":"C","text":"Öğretmen bize beklemesini söyledi."},{"id":"D","text":"Öğretmen bize beklemeni söyledi."}],"correct_option_id":"B","explanation":"Beklememizi marks the people expected to wait as first-person plural."},{"id":"YH1-V14-Q018","section":"Appendix introduction","skill_id":"YH1-FOUND-03-S02","type":"single_select","prompt":"Which word normally keeps its final consonant unchanged when a vowel-initial case suffix is added?","options":[{"id":"A","text":"rengi"},{"id":"B","text":"ağacı"},{"id":"C","text":"kitabı"},{"id":"D","text":"saati"}],"correct_option_id":"D","explanation":"Saat takes saati; the other examples show consonant softening."},{"id":"YH1-V14-Q019","section":"Appendix introduction","skill_id":"YH1-FOUND-04-S02","type":"single_select","prompt":"Choose the correct accusative form of fikir (idea).","options":[{"id":"A","text":"fikiri"},{"id":"B","text":"fikire"},{"id":"C","text":"fikirı"},{"id":"D","text":"fikri"}],"correct_option_id":"D","explanation":"Some loanwords undergo vowel loss before vowel-initial suffixes: fikir → fikri."},{"id":"YH1-V14-Q020","section":"Appendix introduction","skill_id":"YH1-FOUND-06-S01","type":"single_select","prompt":"Choose the correct accusative form of hak (right, entitlement).","options":[{"id":"A","text":"hağı"},{"id":"B","text":"hakkı"},{"id":"C","text":"hakı"},{"id":"D","text":"haki"}],"correct_option_id":"B","explanation":"Hak becomes hakkı with consonant gemination in this inflection."},{"id":"YH1-V14-Q021","section":"Appendix introduction","skill_id":"YH1-FOUND-06-S02","type":"single_select","prompt":"Complete: Bu benim ___ . (This is my right.)","options":[{"id":"A","text":"hakım"},{"id":"B","text":"hakkem"},{"id":"C","text":"hağım"},{"id":"D","text":"hakkım"}],"correct_option_id":"D","explanation":"Hak + first-person possessive -ım yields hakkım with gemination."},{"id":"YH1-V32-Q001","section":"4.1","skill_id":"YH1-04-01-S01","type":"single_select","prompt":"Complete with the definite past (-DI): Dün akşam annemi ___ (aramak, ben).","options":[{"id":"A","text":"aradım"},{"id":"B","text":"arardım"},{"id":"C","text":"arıyorum"},{"id":"D","text":"arayacağım"}],"correct_option_id":"A","explanation":"Aramak takes -dı + -m in the definite past: aradım."},{"id":"YH1-V32-Q002","section":"4.1","skill_id":"YH1-04-01-S01","type":"single_select","prompt":"Complete with the definite past (-DI): Geçen hafta müzeye ___ (gitmek, biz).","options":[{"id":"A","text":"gideriz"},{"id":"B","text":"gidiyoruz"},{"id":"C","text":"gittik"},{"id":"D","text":"gideceğiz"}],"correct_option_id":"C","explanation":"Gitmek takes the definite past form gittik for first-person plural."},{"id":"YH1-V32-Q003","section":"4.1","skill_id":"YH1-04-01-S02","type":"single_select","prompt":"Use the negative definite past (-DI): Dün akşam televizyon ___ (izlemek, ben, negative).","options":[{"id":"A","text":"izlemem"},{"id":"B","text":"izlemedim"},{"id":"C","text":"izlemeyeceğim"},{"id":"D","text":"izlemiyorum"}],"correct_option_id":"B","explanation":"The negative definite past is izle-me-di-m → izlemedim."},{"id":"YH1-V32-Q004","section":"4.1","skill_id":"YH1-04-01-S02","type":"single_select","prompt":"Use the negative definite past (-DI): Geçen pazar dışarı ___ (çıkmak, biz, negative).","options":[{"id":"A","text":"çıkmayacağız"},{"id":"B","text":"çıkmıyoruz"},{"id":"C","text":"çıkmazdık"},{"id":"D","text":"çıkmadık"}],"correct_option_id":"D","explanation":"The negative definite past for biz is çıkmadık."},{"id":"YH1-V32-Q005","section":"4.2","skill_id":"YH1-04-02-S01","type":"single_select","prompt":"Choose the definite-past (-DI) nominal sentence meaning “I was tired yesterday” (stated as a directly known fact).","options":[{"id":"A","text":"Dün yorgundum."},{"id":"B","text":"Dün yorgunmuşum."},{"id":"C","text":"Dün yorgunum."},{"id":"D","text":"Dün yorgunsam."}],"correct_option_id":"A","explanation":"Yorgun + past copular ending -dum forms yorgundum."},{"id":"YH1-V32-Q006","section":"4.2","skill_id":"YH1-04-02-S01","type":"single_select","prompt":"Choose the definite-past (-DI) nominal sentence meaning “We were at school yesterday” (stated as a directly known fact).","options":[{"id":"A","text":"Dün okuldaysak."},{"id":"B","text":"Dün okuldaymışız."},{"id":"C","text":"Dün okuldaydık."},{"id":"D","text":"Dün okuldayız."}],"correct_option_id":"C","explanation":"The past copular form for biz is okuldaydık."},{"id":"YH1-V32-Q007","section":"4.2","skill_id":"YH1-04-02-S03","type":"single_select","prompt":"Choose the definite-past (-DI) question meaning “Were they at work yesterday?”","options":[{"id":"A","text":"Dün işte miydiler?"},{"id":"B","text":"Dün işte mi?"},{"id":"C","text":"Dün işte miydim?"},{"id":"D","text":"Dün işte misiniz?"}],"correct_option_id":"A","explanation":"The question particle plus past copula and third-person plural gives miydiler."},{"id":"YH1-V32-Q008","section":"4.2","skill_id":"YH1-04-02-S03","type":"single_select","prompt":"Choose the definite-past (-DI) question meaning “Was she ill yesterday?”","options":[{"id":"A","text":"Dün hasta mıyım?"},{"id":"B","text":"Dün hasta mısın?"},{"id":"C","text":"Dün hasta mı?"},{"id":"D","text":"Dün hasta mıydı?"}],"correct_option_id":"D","explanation":"The past copular question is mıydı for third-person singular."},{"id":"YH1-V32-Q009","section":"4.3","skill_id":"YH1-04-03-S01","type":"single_select","prompt":"Use past continuous (-Iyor + -DI): Dün saat sekizde kitap ___ (okumak, ben).","options":[{"id":"A","text":"okuyorum"},{"id":"B","text":"okuyordum"},{"id":"C","text":"okuyacağım"},{"id":"D","text":"okudum"}],"correct_option_id":"B","explanation":"Okumak takes the progressive past form okuyordum."},{"id":"YH1-V32-Q010","section":"4.3","skill_id":"YH1-04-03-S01","type":"single_select","prompt":"Use past continuous (-Iyor + -DI): Dün bu saatte yemek ___ (yapmak, biz).","options":[{"id":"A","text":"yapıyorduk"},{"id":"B","text":"yapacağız"},{"id":"C","text":"yapıyoruz"},{"id":"D","text":"yaptık"}],"correct_option_id":"A","explanation":"Yapmak takes the past progressive form yapıyorduk."},{"id":"YH1-V32-Q011","section":"4.3","skill_id":"YH1-04-04-S01","type":"single_select","prompt":"Complete with -ken (“when I was a child”): Çocuk___ burada oturuyordum.","options":[{"id":"A","text":"dan"},{"id":"B","text":"de"},{"id":"C","text":"ki"},{"id":"D","text":"ken"}],"correct_option_id":"D","explanation":"Çocukken means “when (I was) a child.”"},{"id":"YH1-V32-Q012","section":"4.3","skill_id":"YH1-04-04-S01","type":"single_select","prompt":"Complete with -ken (“while at school”): Okulda___ çok kitap okuyordum.","options":[{"id":"A","text":"dan"},{"id":"B","text":"lar"},{"id":"C","text":"yken"},{"id":"D","text":"ki"}],"correct_option_id":"C","explanation":"Okuldayken means “while at school”; the buffer y joins the vowel-final locative form to -ken."},{"id":"YH1-V32-Q013","section":"4.3","skill_id":"YH1-04-05-S03","type":"single_select","prompt":"Choose the correctly suffixed, single-word expression meaning “by train” (-le/-la).","options":[{"id":"A","text":"trenla"},{"id":"B","text":"trenile"},{"id":"C","text":"trenle"},{"id":"D","text":"trenden"}],"correct_option_id":"C","explanation":"Tren + -(y)lA forms trenle (“by train”)."},{"id":"YH1-V32-Q014","section":"4.3","skill_id":"YH1-04-05-S03","type":"single_select","prompt":"Choose the correctly suffixed, single-word expression meaning “by car” (-yle/-yla).","options":[{"id":"A","text":"arabadan"},{"id":"B","text":"arabayla"},{"id":"C","text":"arabale"},{"id":"D","text":"arabaile"}],"correct_option_id":"B","explanation":"Araba + -(y)lA forms arabayla (“by car”)."},{"id":"YH1-V32-Q015","section":"5.1","skill_id":"YH1-05-01-S04","type":"single_select","prompt":"Addressing several people politely, complete: Lütfen burada ___ (beklemek).","options":[{"id":"A","text":"bekle"},{"id":"B","text":"beklesin"},{"id":"C","text":"bekleyelim"},{"id":"D","text":"bekleyin"}],"correct_option_id":"D","explanation":"Bekleyin is the polite/plural second-person imperative."},{"id":"YH1-V32-Q016","section":"5.1","skill_id":"YH1-05-01-S04","type":"single_select","prompt":"Addressing one person formally, complete: Lütfen kapıyı ___ (kapatmak).","options":[{"id":"A","text":"kapatalım"},{"id":"B","text":"kapatsın"},{"id":"C","text":"kapatın"},{"id":"D","text":"kapat"}],"correct_option_id":"C","explanation":"Kapatın is the formal second-person imperative."},{"id":"YH1-V32-Q017","section":"5.1","skill_id":"YH1-05-01-S03","type":"single_select","prompt":"Choose the negative polite command: “Please do not enter.”","options":[{"id":"A","text":"Lütfen girmez."},{"id":"B","text":"Lütfen girmiyorsun."},{"id":"C","text":"Lütfen girmeyin."},{"id":"D","text":"Lütfen girmedin."}],"correct_option_id":"C","explanation":"Girmeyin uses the negative imperative for polite/plural second person."},{"id":"YH1-V32-Q018","section":"5.1","skill_id":"YH1-05-01-S03","type":"single_select","prompt":"Choose the negative polite command: “Please do not wait here.”","options":[{"id":"A","text":"Lütfen burada beklemez."},{"id":"B","text":"Lütfen burada beklemiyorsun."},{"id":"C","text":"Lütfen burada beklemeyin."},{"id":"D","text":"Lütfen burada beklemedin."}],"correct_option_id":"C","explanation":"Beklemeyin is the polite negative imperative."},{"id":"YH1-V32-Q019","section":"5.2","skill_id":"YH1-05-02-S02","type":"single_select","prompt":"Complete with the adjective suffix meaning “with salt”: Tuz___ çorba istiyorum.","options":[{"id":"A","text":"lu"},{"id":"B","text":"da"},{"id":"C","text":"suz"},{"id":"D","text":"dan"}],"correct_option_id":"A","explanation":"Tuzlu means “salty/with salt”; -lI follows vowel harmony."},{"id":"YH1-V32-Q020","section":"5.2","skill_id":"YH1-05-02-S02","type":"single_select","prompt":"Complete with the adjective suffix meaning “without milk”: Süt___ kahve istiyorum.","options":[{"id":"A","text":"te"},{"id":"B","text":"süz"},{"id":"C","text":"ten"},{"id":"D","text":"lü"}],"correct_option_id":"B","explanation":"Sütsüz means “without milk”; -sIz follows vowel harmony."},{"id":"YH1-V32-Q021","section":"5.2","skill_id":"YH1-05-03-S01","type":"single_select","prompt":"Complete with the first-person plural suggestion: Haydi biraz ___ (dinlenmek).","options":[{"id":"A","text":"dinleniriz"},{"id":"B","text":"dinlenelim"},{"id":"C","text":"dinlendik"},{"id":"D","text":"dinleniyoruz"}],"correct_option_id":"B","explanation":"Dinlenelim is dinlen- (rest) + -elim, the first-person plural suggestion ending. With haydi, it means “let’s rest.”"},{"id":"YH1-V32-Q022","section":"5.2","skill_id":"YH1-05-03-S01","type":"single_select","prompt":"Complete with the first-person plural suggestion: Haydi birlikte yemek ___ (yapmak).","options":[{"id":"A","text":"yaptık"},{"id":"B","text":"yaparız"},{"id":"C","text":"yapalım"},{"id":"D","text":"yapıyoruz"}],"correct_option_id":"C","explanation":"Yapalım is yap- (do/make) + -alım, the first-person plural suggestion ending. Haydi birlikte yemek yapalım means “Let’s cook together.”"},{"id":"YH1-V32-Q023","section":"5.3","skill_id":"YH1-05-04-S02","type":"single_select","prompt":"Complete the comparative: İzmir, Ankara’___ daha sıcak.","options":[{"id":"A","text":"ya"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"yı"}],"correct_option_id":"B","explanation":"The ablative -dan marks the comparison standard: Ankara’dan."},{"id":"YH1-V32-Q024","section":"5.3","skill_id":"YH1-05-04-S02","type":"single_select","prompt":"Complete the comparative: Bu çanta, o çanta___ daha ağır.","options":[{"id":"A","text":"yı"},{"id":"B","text":"ya"},{"id":"C","text":"dan"},{"id":"D","text":"da"}],"correct_option_id":"C","explanation":"The ablative -dan marks the comparison standard: o çantadan."},{"id":"YH1-V34-Q001","section":"5.3","skill_id":"YH1-05-05-S01","type":"single_select","prompt":"Choose the superlative expression to complete the sentence: “This is the most expensive restaurant.” Bu, ___ pahalı restoran.","options":[{"id":"A","text":"en"},{"id":"B","text":"çok"},{"id":"C","text":"daha"},{"id":"D","text":"kadar"}],"correct_option_id":"A","explanation":"En + adjective expresses a superlative: en pahalı."},{"id":"YH1-V34-Q002","section":"5.3","skill_id":"YH1-05-05-S01","type":"single_select","prompt":"Complete the superlative: Sınıfın ___ genç öğrencisi kim? (Who is the youngest student?)","options":[{"id":"A","text":"en"},{"id":"B","text":"kadar"},{"id":"C","text":"daha"},{"id":"D","text":"gibi"}],"correct_option_id":"A","explanation":"En immediately before an adjective makes a superlative: en genç = “youngest.” Daha genç means “younger,” a comparative."},{"id":"YH1-V34-Q003","section":"6.1","skill_id":"YH1-06-01-S03","type":"single_select","prompt":"Complete the definite object: Şu elma___ yedim. (I ate that particular apple.)","options":[{"id":"A","text":"ya"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"yı"}],"correct_option_id":"D","explanation":"The definite accusative after vowel-final elma is -(y)ı: elmayı."},{"id":"YH1-V34-Q004","section":"6.1","skill_id":"YH1-06-01-S03","type":"single_select","prompt":"Complete the definite object: Bu kapı___ kapat. (Close this door.)","options":[{"id":"A","text":"da"},{"id":"B","text":"ya"},{"id":"C","text":"yı"},{"id":"D","text":"dan"}],"correct_option_id":"C","explanation":"The definite accusative after kapı is -(y)ı: kapıyı."},{"id":"YH1-V34-Q005","section":"6.1","skill_id":"YH1-06-01-S01","type":"single_select","prompt":"Choose the sentence meaning “I saw the child” with a definite object.","options":[{"id":"A","text":"Çocukta gördüm."},{"id":"B","text":"Çocuğa gördüm."},{"id":"C","text":"Çocuğu gördüm."},{"id":"D","text":"Çocuk gördüm."}],"correct_option_id":"C","explanation":"The definite accusative of çocuk is çocuğu (k softens to ğ)."},{"id":"YH1-V34-Q006","section":"6.1","skill_id":"YH1-06-01-S01","type":"single_select","prompt":"Choose the sentence meaning “I read the newspaper” with a definite object.","options":[{"id":"A","text":"Gazete okudum."},{"id":"B","text":"Gazetede okudum."},{"id":"C","text":"Gazeteyi okudum."},{"id":"D","text":"Gazeteye okudum."}],"correct_option_id":"C","explanation":"Gazeteyi is the definite accusative of gazete."},{"id":"YH1-V34-Q007","section":"6.2","skill_id":"YH1-06-02-S01","type":"single_select","prompt":"Choose the sentence meaning “I bought some bread” without identifying a specific loaf.","options":[{"id":"A","text":"Bu ekmeği aldım."},{"id":"B","text":"O ekmeği aldım."},{"id":"C","text":"Ekmeği aldım."},{"id":"D","text":"Ekmek aldım."}],"correct_option_id":"D","explanation":"Bare ekmek is a nonspecific object (“some bread”); bu ekmeği and o ekmeği refer to specified bread, while ekmeği has accusative marking."},{"id":"YH1-V34-Q008","section":"6.2","skill_id":"YH1-06-02-S01","type":"single_select","prompt":"Choose the sentence meaning “I read a novel” without specifying which novel.","options":[{"id":"A","text":"Bir roman okudum."},{"id":"B","text":"Romanı okudum."},{"id":"C","text":"Bu romanı okudum."},{"id":"D","text":"Bir romanı okudum."}],"correct_option_id":"A","explanation":"Bir roman without accusative supports a nonspecific reading."},{"id":"YH1-V34-Q009","section":"6.3","skill_id":"YH1-06-03-S01","type":"single_select","prompt":"Complete with the locative relative suffix -DAki (the children who are in the park): Park___ çocuklar oynuyor.","options":[{"id":"A","text":"ın"},{"id":"B","text":"tan"},{"id":"C","text":"ta"},{"id":"D","text":"taki"}],"correct_option_id":"D","explanation":"Parktaki means “in the park” and modifies çocuklar: “the children in the park.”"},{"id":"YH1-V34-Q010","section":"6.3","skill_id":"YH1-06-03-S01","type":"single_select","prompt":"Complete with the locative relative suffix -DAki (the cat that is in the house): Ev___ kedi uyuyor.","options":[{"id":"A","text":"in"},{"id":"B","text":"den"},{"id":"C","text":"deki"},{"id":"D","text":"de"}],"correct_option_id":"C","explanation":"Evdeki modifies kedi: “the cat in the house.”"},{"id":"YH1-V34-Q011","section":"6.3","skill_id":"YH1-06-04-S02","type":"single_select","prompt":"Choose the sentence meaning “Ayşe is coming too.”","options":[{"id":"A","text":"Ayşe geliyor da."},{"id":"B","text":"Ayşe’den geliyor."},{"id":"C","text":"Ayşede geliyor."},{"id":"D","text":"Ayşe de geliyor."}],"correct_option_id":"D","explanation":"Additive de (“too”) is written separately: Ayşe de geliyor."},{"id":"YH1-V34-Q012","section":"6.3","skill_id":"YH1-06-04-S02","type":"single_select","prompt":"Choose the correct spelling meaning “We also want tea.”","options":[{"id":"A","text":"Bizde çay istiyoruz."},{"id":"B","text":"Bizden çay istiyoruz."},{"id":"C","text":"Biz de çay istiyoruz."},{"id":"D","text":"Biz çayda istiyoruz."}],"correct_option_id":"C","explanation":"Additive de is separate from the pronoun biz."},{"id":"YH1-V34-Q013","section":"7.1","skill_id":"YH1-07-01-S01","type":"single_select","prompt":"Use the future tense (-AcAk): Yarın seni ___ (aramak, ben).","options":[{"id":"A","text":"arardım"},{"id":"B","text":"aradım"},{"id":"C","text":"arayacağım"},{"id":"D","text":"arıyorum"}],"correct_option_id":"C","explanation":"Ara- + -(y)acak + first-person singular gives arayacağım."},{"id":"YH1-V34-Q014","section":"7.1","skill_id":"YH1-07-01-S01","type":"single_select","prompt":"Use the future tense (-AcAk): Gelecek hafta İstanbul’a ___ (gitmek, biz).","options":[{"id":"A","text":"gidiyoruz"},{"id":"B","text":"gideceğiz"},{"id":"C","text":"gittik"},{"id":"D","text":"giderdik"}],"correct_option_id":"B","explanation":"Future first-person plural of gitmek is gideceğiz."},{"id":"YH1-V34-Q015","section":"7.2","skill_id":"YH1-07-02-S01","type":"single_select","prompt":"Express a past intention that did not happen: Dün sana mesaj ___ ama telefonum bozuldu. (atmak, ben, future-in-the-past)","options":[{"id":"A","text":"atacaktım"},{"id":"B","text":"atıyorum"},{"id":"C","text":"atacağım"},{"id":"D","text":"attım"}],"correct_option_id":"A","explanation":"Atacaktım expresses “I was going to send” in a past plan."},{"id":"YH1-V34-Q016","section":"7.2","skill_id":"YH1-07-02-S01","type":"single_select","prompt":"Express a past plan that changed: Dün erken ___ ama işim uzadı. (çıkmak, ben, future-in-the-past)","options":[{"id":"A","text":"çıkıyorum"},{"id":"B","text":"çıkacağım"},{"id":"C","text":"çıktım"},{"id":"D","text":"çıkacaktım"}],"correct_option_id":"D","explanation":"Çıkacaktım means “I was going to leave.”"},{"id":"YH1-V34-Q017","section":"7.3","skill_id":"YH1-07-04-S02","type":"single_select","prompt":"Complete “In my opinion, this is easy”: ___ göre bu kolay.","options":[{"id":"A","text":"Bende"},{"id":"B","text":"Bana"},{"id":"C","text":"Beni"},{"id":"D","text":"Benim"}],"correct_option_id":"B","explanation":"Bana göre means “according to me” or “in my opinion.” Göre requires the dative form bana, not the nominative ben."},{"id":"YH1-V34-Q018","section":"7.3","skill_id":"YH1-07-04-S02","type":"single_select","prompt":"Complete “According to you, which is better?”: ___ göre hangisi daha iyi?","options":[{"id":"A","text":"Sende"},{"id":"B","text":"Senin"},{"id":"C","text":"Sana"},{"id":"D","text":"Seni"}],"correct_option_id":"C","explanation":"Sana göre means “according to you / in your opinion.”"},{"id":"YH1-V34-Q019","section":"8.1","skill_id":"YH1-08-01-S01","type":"single_select","prompt":"You wake up and see wet streets, so you infer that it rained overnight. Complete with inferential past (-mIş): Dün gece yağmur ___ . (yağmak)","options":[{"id":"A","text":"yağmış"},{"id":"B","text":"yağıyor"},{"id":"C","text":"yağacak"},{"id":"D","text":"yağdı"}],"correct_option_id":"A","explanation":"Yağmış marks a conclusion based on evidence rather than directly witnessed rain."},{"id":"YH1-V34-Q020","section":"8.1","skill_id":"YH1-08-01-S01","type":"single_select","prompt":"You find an empty plate and infer someone ate the cake. Use -mIş: Pastayı biri ___! (yemek)","options":[{"id":"A","text":"yiyor"},{"id":"B","text":"yemiş"},{"id":"C","text":"yedi"},{"id":"D","text":"yiyecek"}],"correct_option_id":"B","explanation":"Yemiş signals an inference from evidence."},{"id":"YH1-V34-Q021","section":"8.2","skill_id":"YH1-08-04-S01","type":"single_select","prompt":"Complete with reported future (-AcAk + -mIş): Duyduğuma göre yarın hava güzel ___ . (olmak)","options":[{"id":"A","text":"olacakmış"},{"id":"B","text":"olmuş"},{"id":"C","text":"olacak"},{"id":"D","text":"oluyormuş"}],"correct_option_id":"A","explanation":"Olacakmış is a future form reported secondhand."},{"id":"YH1-V34-Q022","section":"8.2","skill_id":"YH1-08-04-S01","type":"single_select","prompt":"Complete with reported future (-AcAk + -mIş): Söylediklerine göre tren geç ___ . (gelmek)","options":[{"id":"A","text":"gelecek"},{"id":"B","text":"geliyormuş"},{"id":"C","text":"gelecekmiş"},{"id":"D","text":"gelmiş"}],"correct_option_id":"C","explanation":"Gelecekmiş reports a future event learned indirectly."},{"id":"YH1-V34-Q023","section":"8.3","skill_id":"YH1-08-05-S02","type":"single_select","prompt":"The phone is switched off, so you guess the person is busy. Use conjectural -DIr: Telefonu kapalı; şimdi meşgul___ .","options":[{"id":"A","text":"ken"},{"id":"B","text":"dür"},{"id":"C","text":"müş"},{"id":"D","text":"dü"}],"correct_option_id":"B","explanation":"Meşguldür expresses a conjecture; ü harmonizes with meşgul."},{"id":"YH1-V34-Q024","section":"8.3","skill_id":"YH1-08-05-S02","type":"single_select","prompt":"It is late, so you guess the children are sleeping. Use conjectural -DIr: Saat geç; çocuklar uyuyor___ .","options":[{"id":"A","text":"ken"},{"id":"B","text":"du"},{"id":"C","text":"dur"},{"id":"D","text":"muş"}],"correct_option_id":"C","explanation":"Uyuyordur combines progressive -yor with conjectural -dur."},{"id":"YH1-V36-Q001","section":"9.1","skill_id":"YH1-09-01-S02","type":"single_select","prompt":"Use the habitual aorist (geniş zaman): Her hafta sonu kitap ___ (okumak, ben).","options":[{"id":"A","text":"okudum"},{"id":"B","text":"okuyacağım"},{"id":"C","text":"okuyorum"},{"id":"D","text":"okurum"}],"correct_option_id":"D","explanation":"The affirmative aorist of okumak in first-person singular is okurum."},{"id":"YH1-V36-Q002","section":"9.1","skill_id":"YH1-09-01-S02","type":"single_select","prompt":"Use the habitual aorist (geniş zaman): Babam her sabah erken ___ (kalkmak).","options":[{"id":"A","text":"kalkıyor"},{"id":"B","text":"kalkar"},{"id":"C","text":"kalkacak"},{"id":"D","text":"kalktı"}],"correct_option_id":"B","explanation":"Kalkmak takes -ar in the third-person singular aorist: kalkar."},{"id":"YH1-V36-Q003","section":"9.2","skill_id":"YH1-09-02-S01","type":"single_select","prompt":"Choose the ability form -(y)Abil: Ben bisiklet ___ . (I know how to ride a bicycle.)","options":[{"id":"A","text":"süreceğim"},{"id":"B","text":"sürebilirim"},{"id":"C","text":"sürdüm"},{"id":"D","text":"sürüyorum"}],"correct_option_id":"B","explanation":"Sürebilirim expresses ability to ride, not merely an action in progress."},{"id":"YH1-V36-Q004","section":"9.2","skill_id":"YH1-09-02-S01","type":"single_select","prompt":"Choose the -(y)Abil ability form: Ayşe İngilizce ___ . (Ayşe is able to speak English.)","options":[{"id":"A","text":"konuşuyor"},{"id":"B","text":"konuştu"},{"id":"C","text":"konuşabilir"},{"id":"D","text":"konuşacak"}],"correct_option_id":"C","explanation":"Konuşabilir is the third-person singular affirmative ability/aorist form."},{"id":"YH1-V36-Q005","section":"9.3","skill_id":"YH1-09-03-S01","type":"single_select","prompt":"Use the habitual past (-ArDI): Çocukken her yaz köye ___ (gitmek, biz).","options":[{"id":"A","text":"giderdik"},{"id":"B","text":"gidiyoruz"},{"id":"C","text":"gideceğiz"},{"id":"D","text":"gittik"}],"correct_option_id":"A","explanation":"Giderdik describes a repeated past habit: we used to go."},{"id":"YH1-V36-Q006","section":"9.3","skill_id":"YH1-09-03-S01","type":"single_select","prompt":"Use the habitual past (-ArDI): Eskiden her akşam yürüyüş ___ (yapmak, o).","options":[{"id":"A","text":"yapacak"},{"id":"B","text":"yaptı"},{"id":"C","text":"yapıyor"},{"id":"D","text":"yapardı"}],"correct_option_id":"D","explanation":"Yapardı marks an action habitually performed in the past."},{"id":"YH1-V36-Q007","section":"10.1","skill_id":"YH1-10-01-S01","type":"single_select","prompt":"Choose the conjunction that introduces a reason: Dışarı çıkmadık, ___ yağmur yağıyordu.","options":[{"id":"A","text":"veya"},{"id":"B","text":"ve"},{"id":"C","text":"çünkü"},{"id":"D","text":"ama"}],"correct_option_id":"C","explanation":"Çünkü introduces the reason: because it was raining."},{"id":"YH1-V36-Q008","section":"10.1","skill_id":"YH1-10-01-S01","type":"single_select","prompt":"Complete with the causal conjunction: Bugün erken yatacağım, ___ çok yorgunum.","options":[{"id":"A","text":"veya"},{"id":"B","text":"fakat"},{"id":"C","text":"çünkü"},{"id":"D","text":"ancak"}],"correct_option_id":"C","explanation":"Çünkü explicitly supplies the reason for going to bed early."},{"id":"YH1-V36-Q009","section":"10.2","skill_id":"YH1-10-03-S01","type":"single_select","prompt":"Complete the purpose clause using -mAk için: Seni gör___ için buraya geldim.","options":[{"id":"A","text":"di"},{"id":"B","text":"dük"},{"id":"C","text":"iyor"},{"id":"D","text":"mek"}],"correct_option_id":"D","explanation":"Görmek için means in order to see; the infinitive ending is -mek."},{"id":"YH1-V36-Q010","section":"10.2","skill_id":"YH1-10-03-S01","type":"single_select","prompt":"Choose the phrase meaning “in order to learn Turkish.”","options":[{"id":"A","text":"Türkçe öğrenirken"},{"id":"B","text":"Türkçe öğrenmeden önce"},{"id":"C","text":"Türkçe öğrenmek için"},{"id":"D","text":"Türkçe öğrendikten sonra"}],"correct_option_id":"C","explanation":"Öğrenmek için is an infinitive plus için purpose construction."},{"id":"YH1-V36-Q011","section":"10.3","skill_id":"YH1-10-05-S01","type":"single_select","prompt":"Complete with the -DIktAn sonra construction (after doing something): Eve gel___ sonra yemek yedim.","options":[{"id":"A","text":"ecek"},{"id":"B","text":"irken"},{"id":"C","text":"meden"},{"id":"D","text":"dikten"}],"correct_option_id":"D","explanation":"Geldikten sonra means after coming home."},{"id":"YH1-V36-Q012","section":"10.3","skill_id":"YH1-10-05-S01","type":"single_select","prompt":"Choose the expression meaning “after finishing the lesson.”","options":[{"id":"A","text":"dersi bitirmek için"},{"id":"B","text":"dersi bitirdikten sonra"},{"id":"C","text":"dersi bitirirken"},{"id":"D","text":"dersi bitirmeden önce"}],"correct_option_id":"B","explanation":"Bitirdikten sonra specifies that the lesson was finished before the next action."},{"id":"YH1-V36-Q013","section":"11.1","skill_id":"YH1-11-01-S01","type":"single_select","prompt":"Complete using the -(y)Ip converb to link two sequential actions: Eve dön___ dinlendim.","options":[{"id":"A","text":"üp"},{"id":"B","text":"meden"},{"id":"C","text":"ünce"},{"id":"D","text":"erek"}],"correct_option_id":"A","explanation":"Dönüp dinlendim means I returned home and then rested."},{"id":"YH1-V36-Q014","section":"11.1","skill_id":"YH1-11-01-S01","type":"single_select","prompt":"Use the -(y)Ip converb to link two sequential actions: Kapıyı aç___ içeri girdi.","options":[{"id":"A","text":"ınca"},{"id":"B","text":"arak"},{"id":"C","text":"ıp"},{"id":"D","text":"madan"}],"correct_option_id":"C","explanation":"Açıp is the -(y)Ip converb of açmak; it links opening the door to the following action, entering."},{"id":"YH1-V36-Q015","section":"11.2","skill_id":"YH1-11-03-S01","type":"single_select","prompt":"Use the -(y)ArAk manner converb, meaning “laughing as they entered”: Çocuk gül___ odaya girdi.","options":[{"id":"A","text":"erek"},{"id":"B","text":"meden"},{"id":"C","text":"ünce"},{"id":"D","text":"üp"}],"correct_option_id":"A","explanation":"Gülerek means laughing, describing how the child entered."},{"id":"YH1-V36-Q016","section":"11.2","skill_id":"YH1-11-03-S01","type":"single_select","prompt":"Choose the sentence using -(y)ArAk to describe how someone went to work.","options":[{"id":"A","text":"İşe yürüyerek gittim."},{"id":"B","text":"İşe yürümeden gittim."},{"id":"C","text":"İşe yürümek için gittim."},{"id":"D","text":"İşe yürüdükten sonra gittim."}],"correct_option_id":"A","explanation":"Yürüyerek indicates the manner of going to work: on foot."},{"id":"YH1-V36-Q017","section":"12.1","skill_id":"YH1-12-01-S01","type":"single_select","prompt":"Use the -mA verbal noun with accusative marking: Yüz___ çok seviyorum. (I love swimming.)","options":[{"id":"A","text":"düm"},{"id":"B","text":"meyi"},{"id":"C","text":"üyorum"},{"id":"D","text":"mek"}],"correct_option_id":"B","explanation":"Yüzmeyi is the -mA verbal noun with accusative -(y)I, as the object of seviyorum."},{"id":"YH1-V36-Q018","section":"12.1","skill_id":"YH1-12-01-S01","type":"single_select","prompt":"Choose the -mA verbal noun with accusative marking: Kitap oku___ seviyorum. (I enjoy reading books.)","options":[{"id":"A","text":"mak"},{"id":"B","text":"dum"},{"id":"C","text":"yorum"},{"id":"D","text":"mayı"}],"correct_option_id":"D","explanation":"Okumayı combines the -mA verbal noun with accusative -(y)I."},{"id":"YH1-V36-Q019","section":"12.3","skill_id":"YH1-12-03-S01","type":"single_select","prompt":"Use the possessed -mA verbal noun with accusative marking: Müdür çalışanlardan erken gel___ istedi. (The manager wanted the employees to come early.)","options":[{"id":"A","text":"mek"},{"id":"B","text":"melerini"},{"id":"C","text":"miş"},{"id":"D","text":"meleri"}],"correct_option_id":"B","explanation":"Gelmelerini is a possessive-marked verbal noun with accusative in the reported request."},{"id":"YH1-V36-Q020","section":"12.3","skill_id":"YH1-12-03-S01","type":"single_select","prompt":"Use the possessed -mA verbal noun with accusative marking: Anne çocuklarına odalarını temizle___ söyledi. (The mother told her children to clean their rooms.)","options":[{"id":"A","text":"melerini"},{"id":"B","text":"mek"},{"id":"C","text":"meleri"},{"id":"D","text":"di"}],"correct_option_id":"A","explanation":"Temizlemelerini is the possessed verbal noun in accusative, referring to the children’s action."},{"id":"YH1-V36-Q021","section":"0","skill_id":"YH1-00-01-S02","type":"single_select","prompt":"Which word contains only back vowels (a, ı, o, u)?","options":[{"id":"A","text":"şehir"},{"id":"B","text":"deniz"},{"id":"C","text":"okul"},{"id":"D","text":"güneş"}],"correct_option_id":"C","explanation":"Okul contains o and u, both back vowels."},{"id":"YH1-V36-Q022","section":"0","skill_id":"YH1-00-01-S02","type":"single_select","prompt":"Which word contains only front vowels (e, i, ö, ü)?","options":[{"id":"A","text":"çocuk"},{"id":"B","text":"sokak"},{"id":"C","text":"gözlük"},{"id":"D","text":"kapı"}],"correct_option_id":"C","explanation":"Gözlük contains ö and ü, both front vowels."},{"id":"YH1-V36-Q023","section":"0","skill_id":"YH1-00-03-S02","type":"single_select","prompt":"Choose the plural of “kitap.”","options":[{"id":"A","text":"kitapta"},{"id":"B","text":"kitapları"},{"id":"C","text":"kitaplar"},{"id":"D","text":"kitapler"}],"correct_option_id":"C","explanation":"The plural suffix after a back vowel is -lar: kitaplar."},{"id":"YH1-V36-Q024","section":"0","skill_id":"YH1-00-03-S02","type":"single_select","prompt":"Choose the plural of “gün.”","options":[{"id":"A","text":"günlar"},{"id":"B","text":"günde"},{"id":"C","text":"günler"},{"id":"D","text":"günü"}],"correct_option_id":"C","explanation":"The plural suffix after a front vowel is -ler: günler."},{"id":"YH1-V38-Q001","section":"1.2","skill_id":"YH1-01-01-S02","type":"single_select","prompt":"Complete the negative nominal predicate (I am not tired): Ben yorgun ___.","options":[{"id":"A","text":"değilsin"},{"id":"B","text":"değilim"},{"id":"C","text":"değiliz"},{"id":"D","text":"değil"}],"correct_option_id":"B","explanation":"Yorgun değilim means “I am not tired”; değil takes the first-person singular ending -im."},{"id":"YH1-V38-Q002","section":"1.2","skill_id":"YH1-01-01-S02","type":"single_select","prompt":"Choose the sentence meaning “I am not a teacher.”","options":[{"id":"A","text":"Ben öğretmen değildim."},{"id":"B","text":"Ben öğretmen değilmişim."},{"id":"C","text":"Ben öğretmen değilim."},{"id":"D","text":"Ben öğretmen olmayacağım."}],"correct_option_id":"C","explanation":"The first-person singular nominal negation is öğretmen değilim."},{"id":"YH1-V38-Q003","section":"1.2","skill_id":"YH1-01-01-S03","type":"single_select","prompt":"Complete the yes/no question: Sen doktor ___? (Are you a doctor?)","options":[{"id":"A","text":"misin"},{"id":"B","text":"mısın"},{"id":"C","text":"musun"},{"id":"D","text":"müsün"}],"correct_option_id":"C","explanation":"The last vowel of doktor is o, so the question particle is mu; with second-person singular it becomes musun."},{"id":"YH1-V38-Q004","section":"1.2","skill_id":"YH1-01-01-S03","type":"single_select","prompt":"Complete the question: Sen Türk ___? (Are you Turkish?)","options":[{"id":"A","text":"musun"},{"id":"B","text":"mısın"},{"id":"C","text":"müsün"},{"id":"D","text":"misin"}],"correct_option_id":"C","explanation":"The final vowel in Türk is ü, which requires müsün."},{"id":"YH1-V38-Q005","section":"1.2","skill_id":"YH1-01-02-S01","type":"single_select","prompt":"Complete: Biz öğrenci___. (We are students.)","options":[{"id":"A","text":"yiz"},{"id":"B","text":"yız"},{"id":"C","text":"yuz"},{"id":"D","text":"yüz"}],"correct_option_id":"A","explanation":"A vowel-final predicate takes the buffer y: öğrenciyiz."},{"id":"YH1-V38-Q006","section":"1.2","skill_id":"YH1-01-02-S01","type":"single_select","prompt":"Complete: Biz mutlu___. (We are happy.)","options":[{"id":"A","text":"yız"},{"id":"B","text":"yiz"},{"id":"C","text":"yuz"},{"id":"D","text":"yüz"}],"correct_option_id":"C","explanation":"Mutlu ends in u and takes the first-person plural ending -yuz: mutluyuz."},{"id":"YH1-V38-Q007","section":"1.3","skill_id":"YH1-01-03-S01","type":"single_select","prompt":"Complete with a neutral present-time existential: Çantamda bir kalem ___. (There is a pen in my bag now.)","options":[{"id":"A","text":"yok"},{"id":"B","text":"var"},{"id":"C","text":"vardı"},{"id":"D","text":"varmış"}],"correct_option_id":"B","explanation":"Var indicates that something exists or is present."},{"id":"YH1-V38-Q008","section":"1.3","skill_id":"YH1-01-03-S01","type":"single_select","prompt":"Choose the sentence meaning “There is no milk in the refrigerator.”","options":[{"id":"A","text":"Buzdolabında süt var."},{"id":"B","text":"Buzdolabında süt de var."},{"id":"C","text":"Buzdolabında süt yok."},{"id":"D","text":"Buzdolabında süt mü?"}],"correct_option_id":"C","explanation":"Yok expresses nonexistence: Buzdolabında süt yok."},{"id":"YH1-V38-Q009","section":"1.3","skill_id":"YH1-01-04-S01","type":"single_select","prompt":"Choose the ordinal meaning “fifth.”","options":[{"id":"A","text":"beşte"},{"id":"B","text":"beşinci"},{"id":"C","text":"beşler"},{"id":"D","text":"beşten"}],"correct_option_id":"B","explanation":"Beşinci is the ordinal “fifth”: beş (five) + -inci. Turkish ordinal suffixes follow four-way vowel harmony."},{"id":"YH1-V38-Q010","section":"1.3","skill_id":"YH1-01-04-S01","type":"single_select","prompt":"Choose the ordinal meaning “second.”","options":[{"id":"A","text":"iki"},{"id":"B","text":"ikide"},{"id":"C","text":"ikinci"},{"id":"D","text":"ikiler"}],"correct_option_id":"C","explanation":"İkinci means “second”; iki is the cardinal “two.”"},{"id":"YH1-V38-Q011","section":"2.1","skill_id":"YH1-02-01-S01","type":"single_select","prompt":"Complete with the present continuous (-Iyor): Şu anda kitap ___. (I am reading a book right now.)","options":[{"id":"A","text":"okuyorum"},{"id":"B","text":"okurum"},{"id":"C","text":"okudum"},{"id":"D","text":"okuyacağım"}],"correct_option_id":"A","explanation":"The verb okumak forms okuyorum in the present continuous: oku- + -yor + -um. The y is part of the present-continuous form, not an independently inserted buffer consonant."},{"id":"YH1-V38-Q012","section":"2.1","skill_id":"YH1-02-01-S01","type":"single_select","prompt":"Complete using the present continuous (-Iyor): Şimdi müzik ___. (We are listening to music.)","options":[{"id":"A","text":"dinledik"},{"id":"B","text":"dinleriz"},{"id":"C","text":"dinliyoruz"},{"id":"D","text":"dinleyeceğiz"}],"correct_option_id":"C","explanation":"Dinle- forms dinliyor- in the present continuous; first-person plural gives dinliyoruz."},{"id":"YH1-V38-Q013","section":"2.1","skill_id":"YH1-02-01-S02","type":"single_select","prompt":"Complete using the negative present continuous (-mIyor): Şu anda televizyon ___. (I am not watching television.)","options":[{"id":"A","text":"izlemedim"},{"id":"B","text":"izlemiyorum"},{"id":"C","text":"izlemem"},{"id":"D","text":"izlemeyeceğim"}],"correct_option_id":"B","explanation":"İzle- + negative present continuous yields izlemiyorum."},{"id":"YH1-V38-Q014","section":"2.1","skill_id":"YH1-02-01-S02","type":"single_select","prompt":"Complete using the negative present continuous (-mIyor): Şimdi kahve ___. (We are not drinking coffee right now.)","options":[{"id":"A","text":"içmeyiz"},{"id":"B","text":"içmeyeceğiz"},{"id":"C","text":"içmedik"},{"id":"D","text":"içmiyoruz"}],"correct_option_id":"D","explanation":"The negative present continuous first-person plural of içmek is içmiyoruz."},{"id":"YH1-V38-Q015","section":"2.2","skill_id":"YH1-02-02-S01","type":"single_select","prompt":"Complete the destination case: Yarın İzmir’___ gidiyoruz.","options":[{"id":"A","text":"de"},{"id":"B","text":"den"},{"id":"C","text":"e"},{"id":"D","text":"i"}],"correct_option_id":"C","explanation":"A destination takes the dative: İzmir’e."},{"id":"YH1-V38-Q016","section":"2.2","skill_id":"YH1-02-02-S01","type":"single_select","prompt":"Complete the destination case: Bu akşam sinema___ gidiyorum.","options":[{"id":"A","text":"dan"},{"id":"B","text":"ya"},{"id":"C","text":"da"},{"id":"D","text":"yı"}],"correct_option_id":"B","explanation":"Sinema ends in a vowel, so the dative takes buffer -y-: sinemaya."},{"id":"YH1-V38-Q017","section":"2.2","skill_id":"YH1-02-03-S03","type":"single_select","prompt":"Complete the locative case: Anahtar çanta___. (The key is in the bag.)","options":[{"id":"A","text":"dan"},{"id":"B","text":"da"},{"id":"C","text":"ya"},{"id":"D","text":"yı"}],"correct_option_id":"B","explanation":"Çanta has a back vowel a and ends in a vowel, so it takes locative -da: çanta + da → çantada (“in the bag”)."},{"id":"YH1-V38-Q018","section":"2.2","skill_id":"YH1-02-03-S03","type":"single_select","prompt":"Complete the locative case: Çocuk park___ oynuyor. (The child is playing in the park.)","options":[{"id":"A","text":"ta"},{"id":"B","text":"tan"},{"id":"C","text":"a"},{"id":"D","text":"ı"}],"correct_option_id":"A","explanation":"After voiceless k, locative -da becomes -ta: parkta."},{"id":"YH1-V38-Q019","section":"2.2","skill_id":"YH1-02-04-S01","type":"single_select","prompt":"Complete the ablative case: İş___ eve dönüyorum. (I am returning home from work.)","options":[{"id":"A","text":"te"},{"id":"B","text":"ten"},{"id":"C","text":"e"},{"id":"D","text":"i"}],"correct_option_id":"B","explanation":"After voiceless ş, the ablative is -ten: işten."},{"id":"YH1-V38-Q020","section":"2.2","skill_id":"YH1-02-04-S01","type":"single_select","prompt":"Complete the ablative case: Ankara’___ geliyorum. (I am coming from Ankara.)","options":[{"id":"A","text":"ya"},{"id":"B","text":"yı"},{"id":"C","text":"da"},{"id":"D","text":"dan"}],"correct_option_id":"D","explanation":"Ankara takes ablative -dan: Ankara’dan."},{"id":"YH1-V38-Q021","section":"2.3","skill_id":"YH1-02-05-S02","type":"single_select","prompt":"Complete the “before” construction: Toplantı___ önce yemek yiyelim. (Let’s eat before the meeting.)","options":[{"id":"A","text":"ya"},{"id":"B","text":"dan"},{"id":"C","text":"da"},{"id":"D","text":"yı"}],"correct_option_id":"B","explanation":"-DAn önce expresses “before”: toplantıdan önce."},{"id":"YH1-V38-Q022","section":"2.3","skill_id":"YH1-02-05-S02","type":"single_select","prompt":"Complete the “before” construction: İş___ önce kahve içiyorum. (I drink coffee before work.)","options":[{"id":"A","text":"te"},{"id":"B","text":"e"},{"id":"C","text":"ten"},{"id":"D","text":"i"}],"correct_option_id":"C","explanation":"After voiceless ş, -DAn önce becomes işten önce."},{"id":"YH1-V38-Q023","section":"2.3","skill_id":"YH1-02-TIME-S01","type":"single_select","prompt":"Choose the sentence meaning “It is half past seven.”","options":[{"id":"A","text":"Saat yediyi çeyrek geçiyor."},{"id":"B","text":"Saat yedi buçuk."},{"id":"C","text":"Saat sekize çeyrek var."},{"id":"D","text":"Saat yedi."}],"correct_option_id":"B","explanation":"Saat yedi buçuk is 7:30. Yediyi çeyrek geçiyor is 7:15; sekize çeyrek var is 7:45."},{"id":"YH1-V38-Q024","section":"2.3","skill_id":"YH1-02-TIME-S01","type":"single_select","prompt":"Choose the sentence meaning “It is quarter to nine.”","options":[{"id":"A","text":"Saat dokuzu çeyrek geçiyor."},{"id":"B","text":"Saat dokuz buçuk."},{"id":"C","text":"Saat sekize çeyrek var."},{"id":"D","text":"Saat dokuza çeyrek var."}],"correct_option_id":"D","explanation":"Saat dokuza çeyrek var means fifteen minutes remain until nine."},{"id":"YH1-V46-Q001","section":"2.3","skill_id":"YH1-02-TIME-S02","type":"single_select","prompt":"Complete: Tren saat beşi çeyrek ___ kalkıyor. (The train leaves at 5:15.)","options":[{"id":"A","text":"geçe"},{"id":"B","text":"kala"},{"id":"C","text":"var"},{"id":"D","text":"geçiyor"}],"correct_option_id":"A","explanation":"With clock time + accusative numeral, çeyrek geçe expresses a quarter past the hour for an event time."},{"id":"YH1-V46-Q002","section":"2.3","skill_id":"YH1-02-TIME-S02","type":"single_select","prompt":"Complete: Film saat sekize çeyrek ___ başlıyor. (The film starts at 7:45.)","options":[{"id":"A","text":"geçe"},{"id":"B","text":"kala"},{"id":"C","text":"geçiyor"},{"id":"D","text":"var"}],"correct_option_id":"B","explanation":"With the hour in the dative, çeyrek kala expresses a quarter to the hour for an event time."},{"id":"YH1-V46-Q003","section":"3.1","skill_id":"YH1-03-01-S01","type":"single_select","prompt":"Complete: Bu benim kitab___. (This is my book.)","options":[{"id":"A","text":"ın"},{"id":"B","text":"ı"},{"id":"C","text":"ım"},{"id":"D","text":"ımız"}],"correct_option_id":"C","explanation":"Kitap takes the first-person singular possessive suffix -ım: kitabım, with p becoming b before the vowel-initial suffix."},{"id":"YH1-V46-Q004","section":"3.1","skill_id":"YH1-03-01-S01","type":"single_select","prompt":"Complete: Bu benim ev___. (This is my house.)","options":[{"id":"A","text":"in"},{"id":"B","text":"i"},{"id":"C","text":"imiz"},{"id":"D","text":"im"}],"correct_option_id":"D","explanation":"The first-person singular possessive suffix after ev is -im: evim."},{"id":"YH1-V46-Q005","section":"3.1","skill_id":"YH1-03-01-S03","type":"single_select","prompt":"Complete: Bu onun çanta___. (This is his/her bag.)","options":[{"id":"A","text":"sı"},{"id":"B","text":"m"},{"id":"C","text":"n"},{"id":"D","text":"ları"}],"correct_option_id":"A","explanation":"A vowel-final noun takes the third-person singular possessive suffix -sı: çantası."},{"id":"YH1-V46-Q006","section":"3.1","skill_id":"YH1-03-01-S03","type":"single_select","prompt":"Complete: Bu onun ev___. (This is his/her house.)","options":[{"id":"A","text":"im"},{"id":"B","text":"i"},{"id":"C","text":"in"},{"id":"D","text":"imiz"}],"correct_option_id":"B","explanation":"A consonant-final noun takes the third-person singular possessive suffix -i here: evi."},{"id":"YH1-V46-Q007","section":"3.2","skill_id":"YH1-03-02-S01","type":"single_select","prompt":"Supply the full genitive suffix after the apostrophe: Ayşe’___ telefonu çalıyor. (Ayşe’s phone is ringing.)","options":[{"id":"A","text":"nın"},{"id":"B","text":"na"},{"id":"C","text":"nin"},{"id":"D","text":"nün"}],"correct_option_id":"C","explanation":"Ayşe ends in the front vowel e. Add buffer n and the front-vowel genitive ending -in: Ayşe’nin telefonu çalıyor."},{"id":"YH1-V46-Q008","section":"3.2","skill_id":"YH1-03-02-S01","type":"single_select","prompt":"Supply the genitive suffix after the apostrophe: Mehmet’___ arabası yeni. (Mehmet’s car is new.)","options":[{"id":"A","text":"ın"},{"id":"B","text":"un"},{"id":"C","text":"e"},{"id":"D","text":"in"}],"correct_option_id":"D","explanation":"Mehmet ends in a consonant, so no buffer consonant is needed. Its last vowel e requires the front-vowel genitive -in: Mehmet’in arabası."},{"id":"YH1-V46-Q009","section":"3.3","skill_id":"YH1-03-03-S01","type":"single_select","prompt":"Complete the noun compound: elma su___ . (Apple juice.)","options":[{"id":"A","text":"yu"},{"id":"B","text":"su"},{"id":"C","text":"ya"},{"id":"D","text":"dan"}],"correct_option_id":"A","explanation":"The compound elma suyu uses the third-person possessive marker -(s)I; su takes the irregular linking y: suyu."},{"id":"YH1-V46-Q010","section":"3.3","skill_id":"YH1-03-03-S01","type":"single_select","prompt":"Complete the noun compound: çocuk kitab___. (A children’s book.)","options":[{"id":"A","text":"ın"},{"id":"B","text":"ı"},{"id":"C","text":"ta"},{"id":"D","text":"tan"}],"correct_option_id":"B","explanation":"In the indefinite noun compound çocuk kitabı, kitap takes the third-person possessive suffix -ı and p softens to b."},{"id":"YH1-V46-Q011","section":"3.3","skill_id":"YH1-03-04-S01","type":"single_select","prompt":"Choose the bare adjective + noun phrase for “a big garden,” without a possessive suffix.","options":[{"id":"A","text":"bahçe büyük"},{"id":"B","text":"büyük bahçeyi"},{"id":"C","text":"büyük bahçe"},{"id":"D","text":"bahçenin büyüğü"}],"correct_option_id":"C","explanation":"In a basic adjective–noun phrase, the adjective precedes the noun: büyük bahçe."},{"id":"YH1-V46-Q012","section":"3.3","skill_id":"YH1-03-04-S01","type":"single_select","prompt":"Choose the bare adjective + noun phrase for “a new book,” without a possessive suffix.","options":[{"id":"A","text":"kitap yeni"},{"id":"B","text":"yeni kitabı"},{"id":"C","text":"kitabın yenisi"},{"id":"D","text":"yeni kitap"}],"correct_option_id":"D","explanation":"An attributive adjective precedes its noun: yeni kitap."},{"id":"YH1-V46-Q013","section":"4.1","skill_id":"YH1-04-01-S03","type":"single_select","prompt":"Choose the question meaning “Did you see Ali yesterday?”","options":[{"id":"A","text":"Dün Ali’yi gördün mü?"},{"id":"B","text":"Dün Ali’yi görüyor musun?"},{"id":"C","text":"Dün Ali’yi görecek misin?"},{"id":"D","text":"Dün Ali’yi gördüm mü?"}],"correct_option_id":"A","explanation":"Gördün mü asks the second-person singular definite-past yes/no question."},{"id":"YH1-V46-Q014","section":"4.1","skill_id":"YH1-04-01-S03","type":"single_select","prompt":"Choose the question meaning “Did you drink tea this morning?”","options":[{"id":"A","text":"Bu sabah çay içiyor musun?"},{"id":"B","text":"Bu sabah çay içtin mi?"},{"id":"C","text":"Bu sabah çay içtim mi?"},{"id":"D","text":"Bu sabah çay içecek misin?"}],"correct_option_id":"B","explanation":"İçtin mi is the second-person singular definite-past question form."},{"id":"YH1-V46-Q015","section":"4.1","skill_id":"YH1-04-01-S04","type":"single_select","prompt":"Choose the definite-past third-person singular form: “He/she arrived.” (gelmek)","options":[{"id":"A","text":"gelmiş"},{"id":"B","text":"geliyor"},{"id":"C","text":"geldi"},{"id":"D","text":"geldim"}],"correct_option_id":"C","explanation":"Gelmek forms the third-person singular definite past as geldi."},{"id":"YH1-V46-Q016","section":"4.1","skill_id":"YH1-04-01-S04","type":"single_select","prompt":"Choose the definite-past third-person singular form: “He/she wrote.” (yazmak)","options":[{"id":"A","text":"yazmış"},{"id":"B","text":"yazıyor"},{"id":"C","text":"yazdım"},{"id":"D","text":"yazdı"}],"correct_option_id":"D","explanation":"Yazmak forms the third-person singular definite past as yazdı."},{"id":"YH1-V46-Q017","section":"4.2","skill_id":"YH1-04-02-S02","type":"single_select","prompt":"Choose the sentence meaning “I was not tired.”","options":[{"id":"A","text":"Yorgun değildim."},{"id":"B","text":"Yorgun değilim."},{"id":"C","text":"Yorgun olmayacağım."},{"id":"D","text":"Yorgun değilmişim."}],"correct_option_id":"A","explanation":"Değildim negates a nominal predicate in the definite past with first-person singular agreement."},{"id":"YH1-V46-Q018","section":"4.2","skill_id":"YH1-04-02-S02","type":"single_select","prompt":"Choose the sentence meaning “I was not at home.”","options":[{"id":"A","text":"Evde değilim."},{"id":"B","text":"Evde değildim."},{"id":"C","text":"Evde olmayacağım."},{"id":"D","text":"Evde değilmişim."}],"correct_option_id":"B","explanation":"Evde değildim means I was not at home; değildim is past negative nominal predication."},{"id":"YH1-V46-Q019","section":"4.3","skill_id":"YH1-04-03-S02","type":"single_select","prompt":"Choose the sentence meaning “I was not working.”","options":[{"id":"A","text":"Çalışmadım."},{"id":"B","text":"Çalışmıyorum."},{"id":"C","text":"Çalışmıyordum."},{"id":"D","text":"Çalışmayacağım."}],"correct_option_id":"C","explanation":"Çalışmıyordum expresses the negative past progressive, rather than a simple past or present negative."},{"id":"YH1-V46-Q020","section":"4.3","skill_id":"YH1-04-03-S02","type":"single_select","prompt":"Choose the sentence meaning “I was not reading.”","options":[{"id":"A","text":"Okumadım."},{"id":"B","text":"Okumuyorum."},{"id":"C","text":"Okumayacağım."},{"id":"D","text":"Okumuyordum."}],"correct_option_id":"D","explanation":"Okumuyordum is the negative past progressive first-person singular form."},{"id":"YH1-V46-Q021","section":"4.3","skill_id":"YH1-04-03-S03","type":"single_select","prompt":"Choose the question meaning “Were you sleeping?”","options":[{"id":"A","text":"Uyuyor muydun?"},{"id":"B","text":"Uyuyor musun?"},{"id":"C","text":"Uyudun mu?"},{"id":"D","text":"Uyuyacak mısın?"}],"correct_option_id":"A","explanation":"Uyuyor muydun asks a second-person singular question in the past progressive."},{"id":"YH1-V46-Q022","section":"4.3","skill_id":"YH1-04-03-S03","type":"single_select","prompt":"Choose the question meaning “Were you waiting?”","options":[{"id":"A","text":"Bekliyor musun?"},{"id":"B","text":"Bekliyor muydun?"},{"id":"C","text":"Bekledin mi?"},{"id":"D","text":"Bekleyecek misin?"}],"correct_option_id":"B","explanation":"Bekliyor muydun asks whether someone was waiting in the past."},{"id":"YH1-V46-Q023","section":"4.3","skill_id":"YH1-04-05-S01","type":"single_select","prompt":"Choose the sentence meaning “I came with my sister.”","options":[{"id":"A","text":"Kız kardeşimden geldim."},{"id":"B","text":"Kız kardeşime geldim."},{"id":"C","text":"Kız kardeşimle geldim."},{"id":"D","text":"Kız kardeşimde geldim."}],"correct_option_id":"C","explanation":"The comitative/instrumental suffix -le marks with: kız kardeşimle."},{"id":"YH1-V46-Q024","section":"4.3","skill_id":"YH1-04-05-S01","type":"single_select","prompt":"Choose the sentence meaning “I walked with my father.”","options":[{"id":"A","text":"Babamdan yürüdüm."},{"id":"B","text":"Babama yürüdüm."},{"id":"C","text":"Babamda yürüdüm."},{"id":"D","text":"Babamla yürüdüm."}],"correct_option_id":"D","explanation":"Babamla uses the comitative suffix -la to mean with my father."},{"id":"YH1-V48-Q001","section":"5.1","skill_id":"YH1-05-01-S01","type":"single_select","prompt":"Choose the informal singular affirmative command meaning “Sit!”","options":[{"id":"A","text":"Oturun!"},{"id":"B","text":"Otursun!"},{"id":"C","text":"Otur!"},{"id":"D","text":"Oturma!"}],"correct_option_id":"C","explanation":"Otur! is the informal singular imperative of oturmak; oturun is plural/polite and oturma is negative."},{"id":"YH1-V48-Q002","section":"5.1","skill_id":"YH1-05-01-S01","type":"single_select","prompt":"Choose the informal singular negative command meaning “Don’t go!”","options":[{"id":"A","text":"Git!"},{"id":"B","text":"Gitmeyin!"},{"id":"C","text":"Gitsin!"},{"id":"D","text":"Gitme!"}],"correct_option_id":"D","explanation":"Gitme! uses -me to make the informal singular imperative negative."},{"id":"YH1-V48-Q003","section":"5.1","skill_id":"YH1-05-01-S02","type":"single_select","prompt":"Choose the third-person singular command meaning “Let him/her sit!”","options":[{"id":"A","text":"Otursun!"},{"id":"B","text":"Otur!"},{"id":"C","text":"Oturun!"},{"id":"D","text":"Oturmasın!"}],"correct_option_id":"A","explanation":"The third-person singular imperative takes -sIn: otursun; oturmasın is negative."},{"id":"YH1-V48-Q004","section":"5.1","skill_id":"YH1-05-01-S02","type":"single_select","prompt":"Choose the third-person singular negative command meaning “Let him/her not come!”","options":[{"id":"A","text":"Gelsin!"},{"id":"B","text":"Gelmesin!"},{"id":"C","text":"Gelme!"},{"id":"D","text":"Gelmeyin!"}],"correct_option_id":"B","explanation":"Gelmesin combines the negative -me with the third-person imperative -sin."},{"id":"YH1-V48-Q005","section":"5.2","skill_id":"YH1-05-02-S01","type":"single_select","prompt":"Choose the adjective meaning “salty / with salt.”","options":[{"id":"A","text":"tuzsuz"},{"id":"B","text":"tuz"},{"id":"C","text":"tuzlu"},{"id":"D","text":"tuzluk"}],"correct_option_id":"C","explanation":"The suffix -lu forms an adjective meaning containing salt: tuzlu."},{"id":"YH1-V48-Q006","section":"5.2","skill_id":"YH1-05-02-S01","type":"single_select","prompt":"Choose the adjective meaning “milky / containing milk.”","options":[{"id":"A","text":"sütsüz"},{"id":"B","text":"süt"},{"id":"C","text":"sütçü"},{"id":"D","text":"sütlü"}],"correct_option_id":"D","explanation":"Sütlü means containing milk, using the vowel-harmonic form -lü."},{"id":"YH1-V48-Q007","section":"5.2","skill_id":"YH1-05-02-S04","type":"single_select","prompt":"Choose the adjective meaning “without sugar / sugar-free.”","options":[{"id":"A","text":"şekersiz"},{"id":"B","text":"şekerli"},{"id":"C","text":"şeker"},{"id":"D","text":"şekerlik"}],"correct_option_id":"A","explanation":"The privative suffix -siz expresses absence: şekersiz means sugar-free."},{"id":"YH1-V48-Q008","section":"5.2","skill_id":"YH1-05-02-S04","type":"single_select","prompt":"Choose the adjective meaning “without milk / milk-free.”","options":[{"id":"A","text":"sütlü"},{"id":"B","text":"sütsüz"},{"id":"C","text":"süt"},{"id":"D","text":"sütçü"}],"correct_option_id":"B","explanation":"Sütsüz uses the privative suffix -süz to mean without milk."},{"id":"YH1-V48-Q009","section":"5.3","skill_id":"YH1-05-04-S01","type":"single_select","prompt":"Complete the comparison “Ankara is colder than Antalya”: Ankara Antalya’___ daha soğuk.","options":[{"id":"A","text":"Antalya’ya"},{"id":"B","text":"Antalya’da"},{"id":"C","text":"Antalya’dan"},{"id":"D","text":"Antalya’nın"}],"correct_option_id":"C","explanation":"Comparisons use the ablative -DAn on the standard: Antalya’dan daha soğuk. The apostrophe separates the suffix from the proper name."},{"id":"YH1-V48-Q010","section":"5.3","skill_id":"YH1-05-04-S01","type":"single_select","prompt":"Complete the comparison “This bag is heavier than that bag”: Bu çanta, o çanta___ daha ağır.","options":[{"id":"A","text":"ya"},{"id":"B","text":"da"},{"id":"C","text":"nın"},{"id":"D","text":"dan"}],"correct_option_id":"D","explanation":"After çanta, the ablative comparison ending is -dan: o çantadan daha ağır."},{"id":"YH1-V48-Q011","section":"5.3","skill_id":"YH1-05-05-S02","type":"single_select","prompt":"Choose the phrase meaning “the fastest train.”","options":[{"id":"A","text":"en hızlı tren"},{"id":"B","text":"daha hızlı tren"},{"id":"C","text":"hızlı tren"},{"id":"D","text":"en hızla tren"}],"correct_option_id":"A","explanation":"En before an adjective marks the superlative: en hızlı tren."},{"id":"YH1-V48-Q012","section":"5.3","skill_id":"YH1-05-05-S02","type":"single_select","prompt":"Choose the phrase meaning “the oldest house.”","options":[{"id":"A","text":"daha eski ev"},{"id":"B","text":"en eski ev"},{"id":"C","text":"eski ev"},{"id":"D","text":"en eskiden ev"}],"correct_option_id":"B","explanation":"En eski is the superlative adjective meaning oldest."},{"id":"YH1-V48-Q013","section":"6.1","skill_id":"YH1-06-01-S02","type":"single_select","prompt":"Choose the sentence meaning “I read the book” (a particular book).","options":[{"id":"A","text":"Kitap okudum."},{"id":"B","text":"Kitaba okudum."},{"id":"C","text":"Kitabı okudum."},{"id":"D","text":"Kitapta okudum."}],"correct_option_id":"C","explanation":"Kitabı is the definite accusative form of kitap; p softens to b before -ı."},{"id":"YH1-V48-Q014","section":"6.1","skill_id":"YH1-06-01-S02","type":"single_select","prompt":"Complete “I opened the door” (a particular door): Kapı___ açtım.","options":[{"id":"A","text":"ya"},{"id":"B","text":"da"},{"id":"C","text":"dan"},{"id":"D","text":"yı"}],"correct_option_id":"D","explanation":"The definite object kapı takes the buffer y plus accusative -ı: kapıyı."},{"id":"YH1-V48-Q015","section":"6.3","skill_id":"YH1-06-04-S01","type":"single_select","prompt":"Choose the sentence meaning “I also speak Turkish.”","options":[{"id":"A","text":"Ben de Türkçe konuşuyorum."},{"id":"B","text":"Ben Türkçe konuşuyorum."},{"id":"C","text":"Ben Türkçede konuşuyorum."},{"id":"D","text":"Ben Türkçe konuşmuyorum."}],"correct_option_id":"A","explanation":"The separately written particle de adds also/too to ben: Ben de."},{"id":"YH1-V48-Q016","section":"6.3","skill_id":"YH1-06-04-S01","type":"single_select","prompt":"Choose the sentence meaning “Ayşe also came.”","options":[{"id":"A","text":"Ayşe geldi."},{"id":"B","text":"Ayşe de geldi."},{"id":"C","text":"Ayşe’den geldi."},{"id":"D","text":"Ayşe gelmedi."}],"correct_option_id":"B","explanation":"The additive particle de is written separately: Ayşe de geldi."},{"id":"YH1-V48-Q017","section":"6.3","skill_id":"YH1-06-04-S03","type":"single_select","prompt":"Choose the sentence meaning simply “I am at school,” without “also/too.”","options":[{"id":"A","text":"Ben de okuldayım."},{"id":"B","text":"Ben okulda değilim."},{"id":"C","text":"Ben okuldayım."},{"id":"D","text":"Ben okuldanım."}],"correct_option_id":"C","explanation":"Okuldayım is the locative okulda plus first-person predicate; separate de would mean also."},{"id":"YH1-V48-Q018","section":"6.3","skill_id":"YH1-06-04-S03","type":"single_select","prompt":"Choose the sentence meaning simply “Ayşe is at home,” without “also/too.”","options":[{"id":"A","text":"Ayşe de evde."},{"id":"B","text":"Ayşe evden."},{"id":"C","text":"Ayşe evde değil."},{"id":"D","text":"Ayşe evde."}],"correct_option_id":"D","explanation":"Evde is locative (at home); the separate particle de in Ayşe de evde adds also."},{"id":"YH1-V48-Q019","section":"7.1","skill_id":"YH1-07-01-S02","type":"single_select","prompt":"Choose the sentence meaning “We will not come tomorrow.”","options":[{"id":"A","text":"Yarın gelmeyeceğiz."},{"id":"B","text":"Yarın geleceğiz."},{"id":"C","text":"Yarın gelmiyoruz."},{"id":"D","text":"Yarın gelmedik."}],"correct_option_id":"A","explanation":"Gelmeyeceğiz is first-person plural negative future: gel- + -me- (negation) + -y- (buffer) + -ecek (future) + -iz (we). Before the vowel-initial personal ending, k softens to ğ: gelmeyeceğiz."},{"id":"YH1-V48-Q020","section":"7.1","skill_id":"YH1-07-01-S02","type":"single_select","prompt":"Choose the sentence meaning “She will not eat.”","options":[{"id":"A","text":"Yiyecek."},{"id":"B","text":"Yemeyecek."},{"id":"C","text":"Yemiyor."},{"id":"D","text":"Yemedi."}],"c
